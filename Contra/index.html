<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Retro Alien Wars</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 35px rgba(255, 120, 35, 0.35);
            border: 5px solid #16130f;
            background: #111;
        }
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
            mix-blend-mode: screen;
        }
        canvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            letter-spacing: 1px;
        }
        #touch-controls {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
        }
        .touch-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .t-btn {
            width: 55px;
            height: 55px;
            background: rgba(211, 84, 0, 0.3);
            border: 2px solid rgba(230, 126, 34, 0.7);
            border-radius: 50%;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6);
        }
        .t-btn:active, .t-btn.active-press {
            background: rgba(230, 126, 34, 0.8);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="640" height="360"></canvas>
    <div id="ui-overlay">
        <div id="p1-hud">[P1 LIFE: 3] [CONT: 3] [WPN: N]</div>
        <div id="level-hud">[STAGE 1: JUNGLE]</div>
        <div id="p2-hud">[P2 LIFE: 3] [CONT: 3] [WPN: N]</div>
    </div>
    <div id="touch-controls">
        <div class="touch-group">
            <div class="t-btn" id="btn-left">←</div>
            <div class="t-btn" id="btn-right">→</div>
            <div class="t-btn" id="btn-down">↓</div>
        </div>
        <div class="touch-group">
            <div class="t-btn" id="btn-jump">SPC</div>
            <div class="t-btn" id="btn-shoot">SFT</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'MENU';
let currentLevel = 1;
const MAX_LEVELS = 10;
const STAGE_LENGTH = 3400;
const WEAPON_NAMES = ['NORMAL', 'SPREAD', 'LASER', 'MISSILE', 'FLAME'];

let p1 = {
    x: 80, y: 220, w: 34, h: 56, vx: 0, vy: 0, speed: 3.1, jumpForce: -10.5,
    grounded: false, hanging: false, ledgeObj: null, dir: 1, up: false, down: false, ducking: false, 
    life: 3, continues: 3, weapon: 0, invulnerable: 0, active: true, color: '#2980b9'
};

let p2 = {
    x: 120, y: 220, w: 34, h: 56, vx: 0, vy: 0, speed: 3.1, jumpForce: -10.5,
    grounded: false, hanging: false, ledgeObj: null, dir: 1, up: false, down: false, ducking: false, 
    life: 3, continues: 3, weapon: 0, invulnerable: 0, active: false, color: '#c0392b'
};

let bullets = [];
let enemies = [];
let hazards = [];
let platforms = [];
let pickups = [];
let boss = null;
let cameraX = 0;

const keys = {};
window.addEventListener('keydown', e => { 
    if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') {
        e.preventDefault();
    }
    keys[e.code] = true; 
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function setupControl(id, code) {
    const el = document.getElementById(id);
    const press = (e) => { e.preventDefault(); keys[code] = true; el.classList.add('active-press'); };
    const release = (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('active-press'); };
    
    el.addEventListener('touchstart', press);
    el.addEventListener('touchend', release);
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);
}

setupControl('btn-left', 'KeyA');
setupControl('btn-right', 'KeyD');
setupControl('btn-down', 'KeyS');
setupControl('btn-jump', 'Space');
setupControl('btn-shoot', 'ShiftLeft');

const LEVEL_THEMES = [
    { name: "JUNGLE", skyTop: "#78281f", skyBot: "#d35400", ground: "#142914" },
    { name: "ALIEN HIVE", skyTop: "#4a148c", skyBot: "#7b1fa2", ground: "#2b1030" },
    { name: "ROBOT FACTORY", skyTop: "#212121", skyBot: "#424242", ground: "#1a237e" },
    { name: "TERMINATOR WASTELAND", skyTop: "#b71c1c", skyBot: "#e65100", ground: "#3e2723" },
    { name: "BIO-LABORATORY", skyTop: "#004d40", skyBot: "#00695c", ground: "#1b5e20" },
    { name: "CYBER CORE", skyTop: "#0d47a1", skyBot: "#1565c0", ground: "#000051" },
    { name: "VOLCANIC DEPTHS", skyTop: "#bf360c", skyBot: "#ff6f00", ground: "#263238" },
    { name: "MOTHERHIVE", skyTop: "#4a148c", skyBot: "#880e4f", ground: "#311b92" },
    { name: "DEFENSE GRID", skyTop: "#006064", skyBot: "#00838f", ground: "#004d40" },
    { name: "FINAL NEXUS", skyTop: "#311b92", skyBot: "#b71c1c", ground: "#111111" }
];

function startLevel(lvl) {
    currentLevel = lvl;
    enemies = [];
    bullets = [];
    pickups = [];
    hazards = [];
    platforms = [];
    boss = null;
    cameraX = 0;
    p1.x = 80; p1.y = 220; p1.vy = 0; p1.grounded = true; p1.ducking = false; p1.h = 56; p1.hanging = false; p1.ledgeObj = null;
    p2.x = 120; p2.y = 220; p2.vy = 0; p2.grounded = true; p2.ducking = false; p2.h = 56; p2.hanging = false; p2.ledgeObj = null;

    let currentX = 350;
    while (currentX < STAGE_LENGTH - 400) {
        let hasPit = Math.random() < 0.22;
        if (hasPit) {
            let pitWidth = 45 + Math.random() * 35;
            platforms.push({ type: 'pit', x: currentX, w: pitWidth });
            currentX += pitWidth;
        } else {
            if (Math.random() < 0.7) {
                platforms.push({
                    type: 'ledge',
                    x: currentX + 30,
                    y: 155 + (Math.random() * 55),
                    w: 120 + Math.random() * 75,
                    h: 18
                });
            }
            if (Math.random() < 0.25) {
                hazards.push({ x: currentX + 50, y: 288, w: 30, h: 8, type: 'spike' });
            }
            currentX += 210 + Math.random() * 130;
        }
    }

    for (let xPos = 500; xPos < STAGE_LENGTH - 300; xPos += 180 + Math.random() * 100) {
        let tOpts = ['robot', 'terminator', 'alien'];
        let chosen = tOpts[Math.floor(Math.random() * tOpts.length)];
        spawnEnemy(chosen, xPos, 226);
    }
}

function spawnEnemy(type, x, y) {
    enemies.push({
        type: type,
        x: x, y: y, w: 38, h: 50, vx: 0, vy: 0,
        hp: type === 'terminator' ? 4 : (type === 'robot' ? 3 : 1),
        shootTimer: 0, maxHp: type === 'terminator' ? 4 : 3,
        behaviorTimer: 0, moveDir: -1
    });
}

function spawnBoss() {
    boss = {
        x: STAGE_LENGTH - 200, y: 100, w: 100, h: 120,
        hp: 45 + currentLevel * 10, maxHp: 45 + currentLevel * 10,
        vx: 0, vy: 1.2, timer: 0, active: true
    };
}

function checkGamepads() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < gamepads.length; i++) {
        let gp = gamepads[i];
        if (gp && gp.buttons.some(b => b.pressed)) return true;
    }
    return false;
}

function updateGame() {
    if (gameState === 'MENU') {
        if (keys['Space'] || keys['ShiftLeft'] || keys['ShiftRight'] || checkGamepads()) {
            gameState = 'PLAYING';
            startLevel(1);
        }
        return;
    }
    if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
        if (keys['Space'] || keys['ShiftLeft']) gameState = 'MENU';
        return;
    }

    handleGamepads();

    handlePlayerInput(p1, {
        left: keys['KeyA'],
        right: keys['KeyD'],
        up: keys['KeyW'],
        down: keys['KeyS'],
        jump: keys['Space'],
        shoot: keys['ShiftLeft'] || keys['ShiftRight']
    });

    if (!p2.active && (keys['KeyC'] || keys['GamepadJoin'])) p2.active = true;
    if (p2.active) {
        handlePlayerInput(p2, {
            left: keys['ArrowLeft'],
            right: keys['ArrowRight'],
            up: keys['ArrowUp'],
            down: keys['ArrowDown'],
            jump: keys['KeyN'],
            shoot: keys['KeyM']
        });
    }

    updatePlayerPhysics(p1);
    if (p2.active) updatePlayerPhysics(p2);

    let leadX = p1.x;
    if (p2.active && p2.x > p1.x) leadX = p2.x;
    if (leadX >= STAGE_LENGTH - 350 && !boss) {
        spawnBoss();
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.x < cameraX || b.x > cameraX + canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
            continue;
        }

        if (boss && boss.active && b.fromPlayer) {
            if (b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
                boss.hp--;
                bullets.splice(i, 1);
                if (boss.hp <= 0) {
                    boss.active = false;
                    pickups.push({x: boss.x, y: 240, type: Math.floor(Math.random()*5)});
                }
                continue;
            }
        }

        let hitEnemy = false;
        if (b.fromPlayer) {
            for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                    e.hp--;
                    hitEnemy = true;
                    if (e.hp <= 0) {
                        if (Math.random() < 0.5) {
                            pickups.push({x: e.x, y: e.y, type: Math.floor(Math.random()*5)});
                        }
                        enemies.splice(j, 1);
                    }
                    break;
                }
            }
        }
        if (hitEnemy) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        let distToPlayer = Math.abs(e.x - leadX);
        
        if (distToPlayer < 550) {
            e.behaviorTimer++;
            if (e.behaviorTimer > 100) {
                e.behaviorTimer = 0;
                e.moveDir = leadX < e.x ? -1 : 1;
            }
            e.vx = e.moveDir * 0.8;
            e.x += e.vx;

            e.shootTimer++;
            if (e.shootTimer > 95) {
                e.shootTimer = 0;
                // Forced high bullet spawn (y + 12 relative to enemy top) so they strictly target standing head height
                let exactHeadLevelY = e.y + 8;
                bullets.push({x: e.x + (e.moveDir > 0 ? 35 : -5), y: exactHeadLevelY, vx: e.moveDir * 4.0, vy: 0, fromPlayer: false});
            }
        }
    }

    if (boss && boss.active) {
        boss.y += boss.vy;
        if (boss.y < 25 || boss.y > 130) boss.vy *= -1;
        boss.timer++;
        if (boss.timer > 40) {
            boss.timer = 0;
            bullets.push({x: boss.x, y: boss.y + 45, vx: -5.0, vy: 0, fromPlayer: false});
        }
    }

    if (boss && !boss.active) {
        if (currentLevel < MAX_LEVELS) startLevel(currentLevel + 1);
        else gameState = 'VICTORY';
    }

    for (let i = pickups.length - 1; i >= 0; i--) {
        let pk = pickups[i];
        let target = null;
        if (p1.active && Math.abs(p1.x - pk.x) < 32 && Math.abs(p1.y - pk.y) < 32) target = p1;
        if (p2.active && Math.abs(p2.x - pk.x) < 32 && Math.abs(p2.y - pk.y) < 32) target = p2;

        if (target) {
            if (pk.type === 4) target.life = Math.min(5, target.life + 1);
            else target.weapon = pk.type;
            pickups.splice(i, 1);
        }
    }

    cameraX = leadX - 220;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > STAGE_LENGTH - canvas.width) cameraX = STAGE_LENGTH - canvas.width;
}

function handlePlayerInput(p, input) {
    if (!p.active) return;

    // Ledge grab is a recovery mechanic, not the only way to climb.
    if (p.hanging) {
        p.vx = 0;
        p.vy = 0;
        if (input.jump || input.up) {
            const l = p.ledgeObj;
            p.h = 56;
            p.ducking = false;
            p.x = p.dir > 0 ? l.x + 6 : l.x + l.w - p.w - 6;
            p.y = l.y - p.h;
            p.vy = -1.5;
            p.hanging = false;
            p.grounded = true;
            p.ledgeObj = null;
        } else if (input.down) {
            p.hanging = false;
            p.vy = 2.5;
            p.ledgeObj = null;
        }
        return;
    }

    p.vx = 0;
    if (input.left) { p.vx = -p.speed; p.dir = -1; }
    if (input.right) { p.vx = p.speed; p.dir = 1; }

    // Crouch around the FEET, so the player's lower silhouette stays planted.
    const wantsDuck = !!input.down && p.grounded;
    const targetH = wantsDuck ? 24 : 56;
    if (p.h !== targetH) {
        const feet = p.y + p.h;
        p.h = targetH;
        p.y = feet - p.h;
    }
    p.ducking = wantsDuck;

    p.up = !!input.up;
    p.down = !!input.down;

    // A jump always works from the floor or a ledge.
    if (input.jump && p.grounded && !p.ducking) {
        p.vy = p.jumpForce;
        p.grounded = false;
    }

    if (input.shoot && (!p.lastShoot || performance.now() - p.lastShoot > 130)) {
        p.lastShoot = performance.now();
        fireDirectionalWeapon(p);
    }
}

function fireDirectionalWeapon(p) {
    let dx = p.dir;
    let dy = 0;

    if (p.up && !p.down) dy = -1;
    if (p.down && !p.up && !p.grounded) dy = 1;
    if (p.up && Math.abs(p.vx) < 0.1) { dx = 0; dy = -1; }

    const speed = 9.5;
    let vx = 0, vy = 0;

    if (dx !== 0 && dy !== 0) {
        const diag = speed * 0.707;
        vx = dx * diag; vy = dy * diag;
    } else if (dx !== 0) {
        vx = dx * speed;
    } else if (dy !== 0) {
        vy = dy * speed;
    } else {
        vx = p.dir * speed;
    }

    // Gun sits lower while crouching, matching the smaller hit silhouette.
    const gunYOffset = p.ducking ? 11 : 22;
    const gunX = p.dir > 0 ? p.x + p.w - 1 : p.x - 7;

    const addBullet = (vx2, vy2, damage=1) => {
        bullets.push({
            x: gunX, y: p.y + gunYOffset,
            vx: vx2, vy: vy2, fromPlayer: true, damage
        });
    };

    if (p.weapon === 0) addBullet(vx, vy);
    else if (p.weapon === 1) {
        addBullet(vx, vy);
        addBullet(vx * 0.95, vy - 3);
        addBullet(vx * 0.95, vy + 3);
    } else if (p.weapon === 2) {
        addBullet(vx * 1.5, vy * 1.5, 2);
    } else if (p.weapon === 3) {
        addBullet(vx * 0.8, vy * 0.8 - 1.2, 2);
    } else {
        addBullet(vx * 0.7, vy + (Math.random() - 0.5) * 3, 2);
    }
}

function rectsOverlap(a, b, pad=0) {
    return a.x < b.x + b.w + pad &&
           a.x + a.w > b.x - pad &&
           a.y < b.y + b.h + pad &&
           a.y + a.h > b.y - pad;
}

function updatePlayerPhysics(p) {
    if (p.hanging) return;

    const oldBottom = p.y + p.h;
    p.x += p.vx;
    p.vy += 0.42;
    p.y += p.vy;

    if (p.x < 0) p.x = 0;
    if (p.x > STAGE_LENGTH - p.w) p.x = STAGE_LENGTH - p.w;

    p.grounded = false;

    // The actual ground is the top of the foreground at y=276.
    const floorY = 276;

    // Jump-through ledges: only land while falling and only when crossing the top.
    for (const l of platforms) {
        if (l.type !== 'ledge') continue;

        const horizontal = p.x + p.w - 5 > l.x && p.x + 5 < l.x + l.w;
        const crossedTop = oldBottom <= l.y + 4 && p.y + p.h >= l.y;
        if (horizontal && crossedTop && p.vy >= 0) {
            p.y = l.y - p.h;
            p.vy = 0;
            p.grounded = true;
            break;
        }

        // Grab the front lip if the player sails just past it while rising/falling.
        const nearRightLip = p.dir > 0 && Math.abs((p.x + p.w) - l.x) < 14;
        const nearLeftLip = p.dir < 0 && Math.abs(p.x - (l.x + l.w)) < 14;
        const nearLip = nearRightLip || nearLeftLip;
        const verticalWindow = p.y + p.h > l.y + 2 && p.y < l.y + l.h + 28;

        if (!p.grounded && nearLip && verticalWindow && p.vy < 2.5) {
            p.hanging = true;
            p.ledgeObj = l;
            p.x = nearRightLip ? l.x - p.w + 2 : l.x + l.w - 2;
            p.y = l.y + 3;
            p.vx = 0;
            p.vy = 0;
            break;
        }
    }

    if (p.hanging) return;

    if (p.y + p.h >= floorY) {
        let overPit = false;
        for (const pit of platforms) {
            if (pit.type === 'pit' &&
                p.x + p.w * 0.5 > pit.x &&
                p.x + p.w * 0.5 < pit.x + pit.w) {
                overPit = true;
                break;
            }
        }

        if (overPit) {
            if (p.y > canvas.height + 30) triggerPlayerDeath(p);
        } else {
            p.y = floorY - p.h;
            p.vy = 0;
            p.grounded = true;
        }
    }

    for (const h of hazards) {
        if (rectsOverlap(p, h)) triggerPlayerDamage(p);
    }

    if (p.invulnerable > 0) p.invulnerable--;

    // Enemy bullets use a tiny hitbox. Crouching now genuinely lowers the
    // hurtbox: bullets at standing chest/head height pass over the player.
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (!b.fromPlayer) {
            const bulletBox = { x: b.x - 2, y: b.y - 2, w: 8, h: 5 };
            if (rectsOverlap(p, bulletBox)) {
                bullets.splice(i, 1);
                triggerPlayerDamage(p);
            }
        }
    }
}

function triggerPlayerDamage(p) {
    if (p.invulnerable === 0) {
        p.life--;
        p.invulnerable = 75;
        if (p.life <= 0) handlePlayerLoss(p);
    }
}

function triggerPlayerDeath(p) {
    p.life--;
    p.invulnerable = 75;
    p.vy = -7;
    p.hanging = false;
    p.ledgeObj = null;
    p.x = Math.max(0, cameraX + 40);
    p.y = 220;
    if (p.life <= 0) handlePlayerLoss(p);
}

function handlePlayerLoss(p) {
    if (p.continues > 0) {
        p.continues--;
        p.life = 3;
        p.x = cameraX + 50;
        p.y = 220;
    } else {
        if ((p === p1 && !p2.active) || (!p1.active && p === p2) || (!p1.active && !p2.active)) {
            gameState = 'GAMEOVER';
        } else {
            p.active = false;
        }
    }
}

function handleGamepads() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < gamepads.length; i++) {
        let gp = gamepads[i];
        if (!gp) continue;
        let target = i === 0 ? p1 : p2;
        if (i === 1 && !p2.active) p2.active = true;
        keys['GamepadJoin'] = true;

        let input = {
            left: gp.axes[0] < -0.4 || gp.buttons[14].pressed,
            right: gp.axes[0] > 0.4 || gp.buttons[15].pressed,
            up: gp.axes[1] < -0.4 || gp.buttons[12].pressed,
            down: gp.axes[1] > 0.4 || gp.buttons[13].pressed,
            jump: gp.buttons[0].pressed,
            shoot: gp.buttons[2].pressed
        };
        handlePlayerInput(target, input);
    }
}

function pxRect(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function drawCommando(p) {
    if (p.invulnerable > 0 && Math.floor(p.invulnerable / 4) % 2 === 0) return;
    ctx.save();
    ctx.translate(Math.round(p.x), Math.round(p.y));

    const skin = '#d58b55';
    const skinHi = '#f0b06b';
    const vest = p.color;
    const dark = '#17231c';
    const gun = '#4d5960';
    const metal = '#aab2b3';

    if (p.hanging) {
        pxRect(6, 7, 24, 18, vest);
        pxRect(9, -4, 17, 12, skin);
        pxRect(8, -5, 19, 5, '#3a2b20');
        pxRect(p.dir > 0 ? 25 : 1, 25, 9, 14, dark);
        pxRect(p.dir > 0 ? 30 : -4, 20, 7, 4, skinHi);
        ctx.restore();
        return;
    }

    if (p.ducking) {
        pxRect(3, 15, 11, 9, dark);
        pxRect(21, 15, 11, 9, dark);
        pxRect(4, 7, 28, 13, vest);
        pxRect(8, 1, 18, 8, skin);
        pxRect(7, 0, 20, 4, '#3a2b20');
        pxRect(12, 9, 13, 4, '#273c2e');
        if (p.dir > 0) {
            pxRect(27, 8, 15, 5, gun);
            pxRect(41, 7, 8, 7, metal);
        } else {
            pxRect(-13, 8, 15, 5, gun);
            pxRect(-18, 7, 8, 7, metal);
        }
    } else {
        // boots
        pxRect(5, 43, 11, 13, dark);
        pxRect(20, 43, 11, 13, dark);
        pxRect(2, 52, 14, 5, '#0b1110');
        pxRect(20, 52, 14, 5, '#0b1110');

        // legs
        pxRect(7, 34, 10, 12, '#254b38');
        pxRect(20, 34, 10, 12, '#254b38');
        pxRect(7, 34, 10, 4, '#3d684d');

        // torso + tactical straps
        pxRect(5, 14, 27, 22, vest);
        pxRect(8, 17, 4, 17, '#356d50');
        pxRect(22, 17, 4, 17, '#356d50');
        pxRect(14, 17, 3, 19, '#14241b');
        pxRect(25, 25, 6, 6, '#111');

        // head + hair
        pxRect(8, 3, 19, 14, skin);
        pxRect(7, 2, 20, 5, '#3a2b20');
        pxRect(11, 8, 4, 3, skinHi);
        pxRect(23, 8, 3, 2, '#202020');

        // rifle
        if (p.up) {
            pxRect(p.dir > 0 ? 22 : 4, -7, 6, 22, gun);
            pxRect(p.dir > 0 ? 21 : 3, -13, 8, 8, metal);
        } else if (p.dir > 0) {
            pxRect(27, 20, 18, 6, gun);
            pxRect(42, 18, 9, 10, metal);
            pxRect(50, 20, 5, 5, '#e6c04c');
        } else {
            pxRect(-11, 20, 18, 6, gun);
            pxRect(-17, 18, 9, 10, metal);
            pxRect(-21, 20, 5, 5, '#e6c04c');
        }
    }
    ctx.restore();
}

function drawEnemy(e) {
    ctx.save();
    ctx.translate(Math.round(e.x), Math.round(e.y));
    if (e.type === 'robot') {
        pxRect(5, 14, 28, 31, '#65727a');
        pxRect(8, 4, 22, 13, '#8d989c');
        pxRect(11, 7, 16, 5, '#20272b');
        pxRect(14, 8, 4, 3, '#ff3948');
        pxRect(21, 8, 4, 3, '#ff3948');
        pxRect(2, 19, 5, 16, '#455158');
        pxRect(31, 19, 5, 16, '#455158');
        pxRect(8, 45, 8, 5, '#242b2f');
        pxRect(22, 45, 8, 5, '#242b2f');
        pxRect(2, 25, 14, 4, '#aeb7ba');
        pxRect(31, 25, 10, 4, '#aeb7ba');
    } else if (e.type === 'terminator') {
        pxRect(7, 7, 25, 40, '#9ca7aa');
        pxRect(4, 15, 31, 7, '#d2d6d5');
        pxRect(10, 12, 5, 4, '#ff3145');
        pxRect(22, 12, 5, 4, '#ff3145');
        pxRect(11, 22, 17, 16, '#3c474a');
        pxRect(8, 38, 8, 12, '#707a7d');
        pxRect(22, 38, 8, 12, '#707a7d');
        pxRect(2, 26, 9, 5, '#20272a');
        pxRect(30, 26, 9, 5, '#20272a');
    } else {
        // insectoid alien
        ctx.fillStyle = '#557d36';
        ctx.beginPath();
        ctx.ellipse(19, 28, 18, 15, 0, 0, Math.PI * 2);
        ctx.fill();
        pxRect(10, 10, 19, 20, '#314f28');
        pxRect(13, 6, 5, 6, '#86ad4d');
        pxRect(23, 6, 5, 6, '#86ad4d');
        pxRect(13, 15, 5, 4, '#ff5a4e');
        pxRect(22, 15, 5, 4, '#ff5a4e');
        pxRect(4, 31, 8, 5, '#29451f');
        pxRect(27, 31, 8, 5, '#29451f');
        pxRect(10, 42, 5, 8, '#29451f');
        pxRect(24, 42, 5, 8, '#29451f');
    }
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'MENU') {
        ctx.fillStyle = '#f39c12';
        ctx.font = 'bold 24px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('SUPER RETRO ALIEN WARS', canvas.width/2, 85);
        ctx.fillStyle = '#fff';
        ctx.font = '12px Courier New';
        ctx.fillText('A/D: MOVE   S: DUCK   SPACE: JUMP / VAULT   SHIFT: FIRE', canvas.width/2, 130);
        ctx.fillText('DUCKING LOWERS YOUR HURTBOX — ENEMY ROUNDS PASS OVER YOU.', canvas.width/2, 160);
        ctx.fillText('JUMP ONTO STONE LEDGES — FALLING THROUGH THEIR TOPS LANDS CLEANLY.', canvas.width/2, 190);
        ctx.fillText('PRESS SPACE OR SHIFT TO START', canvas.width/2, 230);
        ctx.fillText('2 PLAYERS: PRESS C TO JOIN P2', canvas.width/2, 270);
        return;
    }

    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 30px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
        ctx.fillStyle = '#fff';
        ctx.font = '13px Courier New';
        ctx.fillText('PRESS SPACE OR SHIFT TO RESTART', canvas.width/2, canvas.height/2 + 40);
        return;
    }

    if (gameState === 'VICTORY') {
        ctx.fillStyle = '#2ecc71';
        ctx.font = 'bold 24px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION COMPLETE! EARTH IS SAVED.', canvas.width/2, canvas.height/2);
        ctx.fillStyle = '#fff';
        ctx.font = '13px Courier New';
        ctx.fillText('PRESS SPACE OR SHIFT TO RESTART', canvas.width/2, canvas.height/2 + 40);
        return;
    }

    let theme = LEVEL_THEMES[(currentLevel - 1) % LEVEL_THEMES.length];

    // --- PIXEL-ART JUNGLE BACKDROP ---
    // Warm sunset gradient, then three chunky parallax layers to evoke the
    // dense 16-bit jungle/ruins look of the reference image.
    const sky = ctx.createLinearGradient(0, 0, 0, 276);
    sky.addColorStop(0, '#24152d');
    sky.addColorStop(0.38, theme.skyTop);
    sky.addColorStop(0.72, '#d85a27');
    sky.addColorStop(1, '#f4b45f');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Pixel clouds / sunset bands
    ctx.save();
    ctx.translate(-cameraX * 0.08, 0);
    for (let i = -200; i < STAGE_LENGTH + 600; i += 170) {
        const y = 55 + ((i / 170) % 3) * 18;
        pxRect(i, y, 95, 7, 'rgba(74,29,31,.55)');
        pxRect(i + 18, y - 5, 52, 6, 'rgba(255,176,83,.38)');
        pxRect(i + 65, y + 7, 70, 5, 'rgba(98,35,28,.45)');
    }
    ctx.restore();

    // Distant jungle canopy
    ctx.save();
    ctx.translate(-cameraX * 0.14, 0);
    for (let i = -200; i < STAGE_LENGTH + 500; i += 110) {
        const h = 65 + ((i / 110) % 4) * 13;
        pxRect(i, 210 - h, 70, h + 66, '#263c29');
        pxRect(i + 10, 180 - h, 32, 18, '#304d2f');
        pxRect(i + 38, 198 - h, 36, 15, '#1d3324');
    }
    ctx.restore();

    // Ancient jungle ruins + giant palms
    ctx.save();
    ctx.translate(-cameraX * 0.30, 0);
    for (let i = -160; i < STAGE_LENGTH + 500; i += 230) {
        const base = 248;
        pxRect(i + 20, 120, 28, 128, '#3d5136');
        pxRect(i + 8, 112, 52, 12, '#536746');
        pxRect(i + 14, 103, 40, 9, '#6b7750');
        pxRect(i + 33, 142, 8, 8, '#202d20');
        pxRect(i - 2, 178, 18, 10, '#263827');
        pxRect(i + 51, 155, 16, 8, '#263827');

        // hanging vines
        ctx.strokeStyle = '#172c1d';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(i + 65, 80); ctx.quadraticCurveTo(i + 45, 145, i + 68, 205);
        ctx.stroke();

        // palm trunk
        pxRect(i + 118, 135, 9, 110, '#4b3b27');
        for (let k = 0; k < 6; k++) {
            pxRect(i + 112 + k * 3, 155 + k * 13, 22, 4, '#60492b');
        }
        // palm fronds
        pxRect(i + 75, 125, 80, 5, '#294a2a');
        pxRect(i + 93, 105, 62, 5, '#294a2a');
        pxRect(i + 108, 92, 45, 5, '#355c30');
        pxRect(i + 125, 112, 62, 5, '#294a2a');
        pxRect(i + 128, 95, 42, 5, '#355c30');
    }
    ctx.restore();

    ctx.save();
    ctx.translate(-cameraX, 0);

    let drawStart = cameraX - 50;
    let drawEnd = cameraX + canvas.width + 50;
    
    let pMap = platforms.filter(p => p.type === 'pit');
    pMap.sort((a,b) => a.x - b.x);

    let renderSegments = [];
    let lastEdge = 0;
    for (let pit of pMap) {
        if (pit.x > lastEdge) {
            renderSegments.push({ start: lastEdge, end: pit.x });
        }
        lastEdge = pit.x + pit.w;
    }
    renderSegments.push({ start: lastEdge, end: STAGE_LENGTH + 500 });

    for (let seg of renderSegments) {
        if (seg.end > drawStart && seg.start < drawEnd) {
            ctx.fillStyle = '#29351f';
            ctx.fillRect(seg.start, 276, seg.end - seg.start, 84);
            ctx.fillStyle = '#52683a';
            ctx.fillRect(seg.start, 276, seg.end - seg.start, 7);

            // chunky dirt strata
            for (let gx = Math.floor(seg.start / 24) * 24; gx < seg.end; gx += 24) {
                const seed = Math.abs(Math.floor(gx * 17.31)) % 9;
                pxRect(gx, 287 + seed, 15, 5, '#3b4528');
                pxRect(gx + 8, 304 + (seed % 5), 19, 6, '#1e291b');
                pxRect(gx - 5, 330 - (seed % 7), 13, 4, '#56633a');
                if (seed % 3 === 0) pxRect(gx + 3, 318, 5, 5, '#687647');
            }

            // grass blades along the lip
            for (let gx = Math.floor(seg.start / 12) * 12; gx < seg.end; gx += 12) {
                const lean = ((gx / 12) % 3) - 1;
                pxRect(gx, 271, 3, 8, '#274b27');
                pxRect(gx + lean * 3, 267, 3, 8, '#396338');
            }
        }
    }

    // Platforms and cliffs with rich metal borders
    for (let l of platforms) {
        if (l.type === 'ledge') {
            pxRect(l.x, l.y, l.w, l.h, '#46533a');
            pxRect(l.x, l.y, l.w, 5, '#77805a');
            pxRect(l.x + 5, l.y + 7, l.w - 10, 5, '#303b2a');
            pxRect(l.x + 12, l.y + 12, 18, 5, '#5f6948');
            pxRect(l.x + l.w - 36, l.y + 9, 22, 5, '#5f6948');
            // moss hanging from the ledge
            pxRect(l.x + 8, l.y + l.h, 5, 8, '#2b5a2b');
            pxRect(l.x + l.w - 20, l.y + l.h, 4, 7, '#315f2d');
        }
    }

    for (let h of hazards) {
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.moveTo(h.x, h.y + h.h);
        ctx.lineTo(h.x + h.w/2, h.y);
        ctx.lineTo(h.x + h.w, h.y + h.h);
        ctx.closePath();
        ctx.fill();
        pxRect(h.x + 3, h.y + h.h - 3, h.w - 6, 3, '#8b241e');
    }

    // Foreground leaves and vines. Kept as rectangles/polygons for mobile GPU speed.
    for (let fx = Math.floor(drawStart / 70) * 70; fx < drawEnd; fx += 70) {
        const seed = Math.abs(Math.floor(fx * 3.7)) % 7;
        pxRect(fx, 254 - seed, 9, 25 + seed, '#17361f');
        pxRect(fx - 12, 262 - seed, 22, 8, '#1e4925');
        pxRect(fx + 8, 248 - seed, 28, 7, '#28572a');
        pxRect(fx + 24, 259 - seed, 24, 6, '#1b4021');
    }

    for (let pk of pickups) {
        ctx.fillStyle = pk.type === 4 ? '#00ffff' : '#f1c40f';
        ctx.fillRect(pk.x, pk.y, 20, 20);
        ctx.fillStyle = '#000';
        ctx.font = 'bold 12px Courier New';
        ctx.fillText(pk.type === 4 ? 'H' : WEAPON_NAMES[pk.type][0], pk.x + 6, pk.y + 14);
    }

    if (boss && boss.active) {
        ctx.fillStyle = '#c0392b';
        ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
        ctx.fillStyle = '#111';
        ctx.fillRect(boss.x, boss.y - 18, boss.w, 8);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(boss.x, boss.y - 18, boss.w * (boss.hp / boss.maxHp), 8);
    }

    for (let e of enemies) drawEnemy(e);

    if (p1.active) drawCommando(p1);
    if (p2.active) drawCommando(p2);

    for (let b of bullets) {
        const enemyShot = !b.fromPlayer;
        ctx.fillStyle = enemyShot ? '#ff6b32' : '#ffd34d';
        const trail = enemyShot ? 10 : 7;
        const tx = b.vx >= 0 ? b.x - trail : b.x + 4;
        ctx.fillRect(tx, b.y, trail, 3);
        ctx.fillStyle = enemyShot ? '#fff0a8' : '#fff7cf';
        ctx.fillRect(b.x, b.y - 1, 6, 5);
    }

    ctx.restore();

    document.getElementById('p1-hud').innerText = `[P1 LIFE: ${p1.life}] [CONT: ${p1.continues}] [WPN: ${WEAPON_NAMES[p1.weapon][0]}]`;
    document.getElementById('p2-hud').innerText = p2.active ? `[P2 LIFE: ${p2.life}] [CONT: ${p2.continues}] [WPN: ${WEAPON_NAMES[p2.weapon][0]}]` : `[PRESS C TO JOIN P2]`;
    document.getElementById('level-hud').innerText = `[STAGE ${currentLevel}: ${theme.name}]`;
}

function mainLoop() {
    updateGame();
    draw();
    requestAnimationFrame(mainLoop);
}

requestAnimationFrame(mainLoop);
</script>
