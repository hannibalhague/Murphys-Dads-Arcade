<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Attack</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 640px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #ui-layer {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: white;
            font-family: sans-serif;
            font-size: 11px;
            font-weight: bold;
            pointer-events: none;
            z-index: 20;
        }

        /* Touch Controls Overlay with Virtual Joystick */
        #touch-controls {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 15px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 20;
            opacity: 0.85;
            transition: opacity 0.2s ease;
        }

        #touch-controls:active, #touch-controls:hover {
            opacity: 1;
        }

        .control-group {
            pointer-events: auto;
            display: flex;
            gap: 10px;
        }

        /* Virtual Joystick Base Container */
        #virtual-joystick-base {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.3);
            touch-action: none;
            pointer-events: auto;
        }

        /* Virtual Joystick Floating Thumbstick Knob */
        #virtual-joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 65px;
            height: 65px;
            margin-top: -32.5px;
            margin-left: -32.5px;
            border-radius: 50%;
            background: rgba(255, 85, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.6);
            pointer-events: none;
            transition: transform 0.05s linear;
        }

        #virtual-joystick-knob.active {
            background: rgba(255, 85, 0, 0.95);
            border-color: #ffffff;
        }

        /* Action Buttons */
        .action-btn {
            width: 75px;
            height: 75px;
            font-size: 11px;
            font-weight: bold;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            pointer-events: auto;
            -webkit-touch-callout: none;
        }

        #btn-fire {
            background: rgba(229, 62, 62, 0.3);
            color: rgba(255, 255, 255, 0.9);
        }
        #btn-fire.active, #btn-fire:active {
            background: rgba(229, 62, 62, 0.9);
            color: white;
        }

        #btn-arm {
            background: rgba(49, 130, 206, 0.3);
            color: rgba(255, 255, 255, 0.9);
        }
        #btn-arm.active, #btn-arm:active {
            background: rgba(49, 130, 206, 0.9);
            color: white;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div>SCORE: <span id="score-val">0</span></div>
            <div>CARRIED: <span id="carried-val">0/10</span></div>
            <div>RESCUED: <span id="rescue-val">0</span></div>
            <div>KILLED: <span id="killed-astronauts-val">0</span></div>
            <div>LIVES: <span id="lives-val">4</span></div>
        </div>

        <canvas id="gameCanvas" width="480" height="640"></canvas>

        <div id="touch-controls">
            <div class="control-group">
                <div id="virtual-joystick-base">
                    <div id="virtual-joystick-knob"></div>
                </div>
            </div>
            <div class="control-group" style="align-items: center;">
                <button id="btn-arm" class="action-btn">F</button>
                <button id="btn-fire" class="action-btn">SPACE</button>
            </div>
        </div>
    </div>

    <!-- Complete Integrated Script Bundle (InputHandler + Game Loop) -->
    <script>
        // --- 1. InputHandler Implementation with Direct Joystick Bridge ---
        class InputHandler {
            constructor() {
                this.keys = {};

                window.addEventListener('keydown', (e) => {
                    this.keys[e.code] = true;
                });

                window.addEventListener('keyup', (e) => {
                    this.keys[e.code] = false;
                });
            }

            isDown(code) {
                // Check direct virtual joystick / action states injected globally
                if (window.virtualJoystickInput) {
                    if (code === 'ArrowUp' && window.virtualJoystickInput.up) return true;
                    if (code === 'ArrowDown' && window.virtualJoystickInput.down) return true;
                    if (code === 'ArrowLeft' && window.virtualJoystickInput.left) return true;
                    if (code === 'ArrowRight' && window.virtualJoystickInput.right) return true;
                }
                if (window.virtualButtonStates) {
                    if (code === 'Space' && window.virtualButtonStates.fire) return true;
                    if (code === 'KeyF' && window.virtualButtonStates.arm) return true;
                }

                if (!!this.keys[code]) return true;

                // Gamepad API check
                const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
                for (let gp of gamepads) {
                    if (!gp) continue;
                    if (code === 'ArrowUp' && (gp.buttons[12]?.pressed || gp.axes[1] < -0.5)) return true;
                    if (code === 'ArrowDown' && (gp.buttons[13]?.pressed || gp.axes[1] > 0.5)) return true;
                    if (code === 'ArrowLeft' && (gp.buttons[14]?.pressed || gp.axes[0] < -0.5)) return true;
                    if (code === 'ArrowRight' && (gp.buttons[15]?.pressed || gp.axes[0] > 0.5)) return true;
                    if (code === 'Space' && (gp.buttons[0]?.pressed || gp.buttons[7]?.pressed)) return true;
                    if (code === 'KeyF' && (gp.buttons[2]?.pressed || gp.buttons[5]?.pressed)) return true;
                }

                return false;
            }
        }
    </script>

    <!-- Game Modular Scripts -->
    <script src="js/background.js"></script>

    <!-- Virtual Joystick Touch Controller Engine -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const base = document.getElementById('virtual-joystick-base');
            const knob = document.getElementById('virtual-joystick-knob');
            
            if (!base || !knob) return;

            let activeTouchId = null;
            const maxRadius = 50;

            window.virtualJoystickInput = { left: false, right: false, up: false, down: false };
            window.virtualButtonStates = { fire: false, arm: false };

            function updateJoystick(clientX, clientY) {
                const rect = base.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let deltaX = clientX - centerX;
                let deltaY = clientY - centerY;
                const distance = Math.hypot(deltaX, deltaY);

                if (distance > maxRadius) {
                    deltaX = (deltaX / distance) * maxRadius;
                    deltaY = (deltaY / distance) * maxRadius;
                }

                knob.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
                knob.classList.add('active');

                const normX = deltaX / maxRadius;
                const normY = deltaY / maxRadius;
                const deadzone = 0.15;

                window.virtualJoystickInput.left = normX < -deadzone;
                window.virtualJoystickInput.right = normX > deadzone;
                window.virtualJoystickInput.up = normY < -deadzone;
                window.virtualJoystickInput.down = normY > deadzone;
            }

            function resetJoystick() {
                activeTouchId = null;
                knob.style.transform = `translate(0px, 0px)`;
                knob.classList.remove('active');
                window.virtualJoystickInput.left = false;
                window.virtualJoystickInput.right = false;
                window.virtualJoystickInput.up = false;
                window.virtualJoystickInput.down = false;
            }

            base.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                if (activeTouchId === null) {
                    activeTouchId = touch.identifier;
                    updateJoystick(touch.clientX, touch.clientY);
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (activeTouchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === activeTouchId) {
                        e.preventDefault();
                        updateJoystick(touch.clientX, touch.clientY);
                        break;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => {
                if (activeTouchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        e.preventDefault();
                        resetJoystick();
                        break;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchcancel', (e) => {
                if (activeTouchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        resetJoystick();
                        break;
                    }
                }
            }, { passive: false });

            // Mouse fallbacks for desktop testing
            let isMouseDown = false;
            base.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                updateJoystick(e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                updateJoystick(e.clientX, e.clientY);
            });
            window.addEventListener('mouseup', () => {
                if (!isMouseDown) return;
                isMouseDown = false;
                resetJoystick();
            });

            // Setup action buttons with responsive pointer bindings
            const setupButton = (id, actionKey) => {
                const btn = document.getElementById(id);
                if (!btn) return;
                
                const press = (e) => {
                    e.preventDefault();
                    btn.classList.add('active');
                    window.virtualButtonStates[actionKey] = true;
                };
                const release = (e) => {
                    e.preventDefault();
                    btn.classList.remove('active');
                    window.virtualButtonStates[actionKey] = false;
                };

                btn.addEventListener('pointerdown', press);
                btn.addEventListener('pointerup', release);
                btn.addEventListener('pointercancel', release);
            };

            setupButton('btn-fire', 'fire');
            setupButton('btn-arm', 'arm');
        });
    </script>
</body>
</html>
