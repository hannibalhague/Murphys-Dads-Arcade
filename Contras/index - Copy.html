<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Retro Alien Wars</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 35px rgba(255, 120, 35, 0.35);
            border: 5px solid #16130f;
            background: #111;
        }
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
            mix-blend-mode: screen;
        }
        canvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            letter-spacing: 1px;
        }
        #touch-controls {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
        }
        .touch-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .t-btn {
            width: 55px;
            height: 55px;
            background: rgba(211, 84, 0, 0.3);
            border: 2px solid rgba(230, 126, 34, 0.7);
            border-radius: 50%;
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6);
        }
        .t-btn:active, .t-btn.active-press {
            background: rgba(230, 126, 34, 0.8);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="640" height="360"></canvas>
    <div id="ui-overlay">
        <div id="p1-hud">[P1 LIFE: 3] [CONT: 3] [WPN: N]</div>
        <div id="level-hud">[STAGE 1: JUNGLE]</div>
        <div id="p2-hud">[P2 LIFE: 3] [CONT: 3] [WPN: N]</div>
    </div>
    <div id="touch-controls">
        <div class="touch-group">
            <div class="t-btn" id="btn-left">←</div>
            <div class="t-btn" id="btn-right">→</div>
            <div class="t-btn" id="btn-down">↓</div>
        </div>
        <div class="touch-group">
            <div class="t-btn" id="btn-jump">SPC</div>
            <div class="t-btn" id="btn-shoot">SFT</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'MENU';
let currentLevel = 1;
const MAX_LEVELS = 10;
const STAGE_LENGTH = 5200;
const WEAPON_NAMES = ['NORMAL', 'SPREAD', 'LASER', 'MISSILE', 'FLAME'];

let p1 = {
    x: 80, y: 220, w: 34, h: 56, vx: 0, vy: 0, speed: 3.1, jumpForce: -10.0,
    grounded: false, canDoubleJump: true, hanging: false, ledgeObj: null, dir: 1, up: false, down: false, ducking: false, 
    life: 3, continues: 3, weapon: 0, invulnerable: 0, active: true, color: '#2980b9', animTimer: 0
};

let p2 = {
    x: 120, y: 220, w: 34, h: 56, vx: 0, vy: 0, speed: 3.1, jumpForce: -10.0,
    grounded: false, canDoubleJump: true, hanging: false, ledgeObj: null, dir: 1, up: false, down: false, ducking: false, 
    life: 3, continues: 3, weapon: 0, invulnerable: 0, active: false, color: '#c0392b', animTimer: 0
};

let bullets = [];
let enemies = [];
let hazards = [];
let platforms = [];
let terrainFeatures = [];
let pickups = [];
let bloodParticles = [];
let boss = null;
let cameraX = 0;

const keys = {};
window.addEventListener('keydown', e => { 
    if (['Space', 'ShiftLeft', 'ShiftRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
        e.preventDefault();
    }
    keys[e.code] = true; 
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function setupControl(id, code) {
    const el = document.getElementById(id);
    const press = (e) => { e.preventDefault(); keys[code] = true; el.classList.add('active-press'); };
    const release = (e) => { e.preventDefault(); keys[code] = false; el.classList.remove('active-press'); };
    
    el.addEventListener('touchstart', press);
    el.addEventListener('touchend', release);
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);
}

setupControl('btn-left', 'KeyA');
setupControl('btn-right', 'KeyD');
setupControl('btn-down', 'KeyS');
setupControl('btn-jump', 'Space');
setupControl('btn-shoot', 'ShiftLeft');

const LEVEL_THEMES = [
    { name: "JUNGLE", skyTop: "#78281f", skyBot: "#d35400", ground: "#142914" },
    { name: "ALIEN HIVE", skyTop: "#4a148c", skyBot: "#7b1fa2", ground: "#2b1030" },
    { name: "ROBOT FACTORY", skyTop: "#212121", skyBot: "#424242", ground: "#1a237e" },
    { name: "TERMINATOR WASTELAND", skyTop: "#b71c1c", skyBot: "#e65100", ground: "#3e2723" },
    { name: "BIO-LABORATORY", skyTop: "#004d40", skyBot: "#00695c", ground: "#1b5e20" },
    { name: "CYBER CORE", skyTop: "#0d47a1", skyBot: "#1565c0", ground: "#000051" },
    { name: "VOLCANIC DEPTHS", skyTop: "#bf360c", skyBot: "#ff6f00", ground: "#263238" },
    { name: "MOTHERHIVE", skyTop: "#4a148c", skyBot: "#880e4f", ground: "#311b92" },
    { name: "DEFENSE GRID", skyTop: "#006064", skyBot: "#00838f", ground: "#004d40" },
    { name: "FINAL NEXUS", skyTop: "#311b92", skyBot: "#b71c1c", ground: "#111111" }
];

function startLevel(lvl) {
    currentLevel = lvl;
    enemies = [];
    bullets = [];
    pickups = [];
    hazards = [];
    platforms = [];
    terrainFeatures = [];
    bloodParticles = [];
    boss = null;
    cameraX = 0;
    p1.x = 80; p1.y = 220; p1.vy = 0; p1.grounded = true; p1.canDoubleJump = true; p1.ducking = false; p1.h = 56; p1.hanging = false; p1.ledgeObj = null;
    p2.x = 120; p2.y = 220; p2.vy = 0; p2.grounded = true; p2.canDoubleJump = true; p2.ducking = false; p2.h = 56; p2.hanging = false; p2.ledgeObj = null;

    let currentX = 350;
    while (currentX < STAGE_LENGTH - 400) {
        let featureType = Math.random();
        if (featureType < 0.18) {
            let pitWidth = 45 + Math.random() * 35;
            platforms.push({ type: 'pit', x: currentX, w: pitWidth });
            currentX += pitWidth;
        } else if (featureType < 0.36) {
            let waterWidth = 80 + Math.random() * 70;
            hazards.push({ type: 'water', x: currentX, y: 268, w: waterWidth, h: 30 });
            currentX += waterWidth;
        } else if (featureType < 0.54) {
            terrainFeatures.push({ type: 'mound', x: currentX, w: 90 + Math.random() * 70, h: 35 + Math.random() * 25 });
            currentX += 120;
        } else {
            if (Math.random() < 0.8) {
                let ledgeObj = {
                    type: 'ledge',
                    x: currentX + 20,
                    y: 110 + (Math.random() * 65),
                    w: 120 + Math.random() * 70,
                    h: 18
                };
                platforms.push(ledgeObj);

                // Spawning enemies or turrets on top level cliffs per instructions
                if (Math.random() < 0.5) {
                    let eType = Math.random() < 0.35 ? 'turret' : 'alien_crawler';
                    enemies.push({
                        type: eType,
                        x: ledgeObj.x + 20 + Math.random() * (ledgeObj.w - 40),
                        y: ledgeObj.y - 50,
                        w: 38, h: 50, vx: 0, vy: 0,
                        hp: eType === 'turret' ? 4 : 2,
                        shootTimer: 0, maxHp: 4,
                        behaviorTimer: 0, moveDir: 1
                    });
                }
            }
            if (Math.random() < 0.3) {
                hazards.push({ x: currentX + 50, y: 288, w: 30, h: 8, type: 'spike' });
            }
            currentX += 170 + Math.random() * 100;
        }
    }

    for (let xPos = 500; xPos < STAGE_LENGTH - 300; xPos += 400 + Math.random() * 250) {
        pickups.push({
            x: xPos,
            baseY: 170 + (Math.random() * 70),
            y: 200,
            w: 24, h: 28,
            type: Math.floor(Math.random() * 5),
            floatTimer: Math.random() * Math.PI * 2
        });
    }

    for (let xPos = 450; xPos < STAGE_LENGTH - 300; xPos += 150 + Math.random() * 80) {
        let tOpts = ['alien_crawler', 'alien_drone', 'alien_brute', 'turret'];
        let chosen = tOpts[Math.floor(Math.random() * tOpts.length)];
        spawnEnemy(chosen, xPos, 226);
    }
}

function spawnEnemy(type, x, y) {
    enemies.push({
        type: type,
        x: x, y: y, w: 38, h: 50, vx: 0, vy: 0,
        hp: type === 'alien_brute' ? 5 : (type === 'turret' ? 4 : 2),
        shootTimer: 0, maxHp: type === 'alien_brute' ? 5 : 3,
        behaviorTimer: 0, moveDir: -1
    });
}

function spawnBoss() {
    boss = {
        x: STAGE_LENGTH - 220, y: 80, w: 120, h: 140,
        hp: 60 + currentLevel * 15, maxHp: 60 + currentLevel * 15,
        vx: 0, vy: 1.5, timer: 0, active: true
    };
}

function spawnBlood(x, y, count = 8) {
    for (let i = 0; i < count; i++) {
        bloodParticles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.7) * 4,
            life: 25 + Math.random() * 20,
            size: 2 + Math.random() * 2
        });
    }
}

function checkGamepads() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < gamepads.length; i++) {
        let gp = gamepads[i];
        if (gp && gp.buttons.some(b => b.pressed)) return true;
    }
    return false;
}

function updateGame() {
    if (gameState === 'MENU') {
        if (keys['Space'] || keys['ShiftLeft'] || keys['ShiftRight'] || checkGamepads()) {
            gameState = 'PLAYING';
            startLevel(1);
        }
        return;
    }
    if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
        if (keys['Space'] || keys['ShiftLeft']) gameState = 'MENU';
        return;
    }

    handleGamepads();

    handlePlayerInput(p1, {
        left: keys['KeyA'],
        right: keys['KeyD'],
        up: keys['KeyW'],
        down: keys['KeyS'],
        jump: keys['Space'],
        shoot: keys['ShiftLeft'] || keys['ShiftRight']
    });

    if (!p2.active && (keys['KeyC'] || keys['GamepadJoin'])) p2.active = true;
    if (p2.active) {
        handlePlayerInput(p2, {
            left: keys['ArrowLeft'],
            right: keys['ArrowRight'],
            up: keys['ArrowUp'],
            down: keys['ArrowDown'],
            jump: keys['KeyN'],
            shoot: keys['KeyM']
        });
    }

    updatePlayerPhysics(p1, {
        jump: keys['Space'],
        down: keys['KeyS']
    });
    if (p2.active) {
        updatePlayerPhysics(p2, {
            jump: keys['KeyN'],
            down: keys['ArrowDown']
        });
    }

    let leadX = p1.x;
    if (p2.active && p2.x > p1.x) leadX = p2.x;
    if (leadX >= STAGE_LENGTH - 350 && !boss) {
        spawnBoss();
    }

    for (let i = bloodParticles.length - 1; i >= 0; i--) {
        let bp = bloodParticles[i];
        bp.x += bp.vx;
        bp.y += bp.vy;
        bp.vy += 0.3;
        bp.life--;
        if (bp.life <= 0) {
            bloodParticles.splice(i, 1);
        }
    }

    for (let pk of pickups) {
        pk.floatTimer += 0.05;
        pk.y = pk.baseY + Math.sin(pk.floatTimer) * 20;
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.x < cameraX || b.x > cameraX + canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
            continue;
        }

        if (boss && boss.active && b.fromPlayer) {
            if (b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
                boss.hp--;
                spawnBlood(b.x, b.y, 4);
                bullets.splice(i, 1);
                if (boss.hp <= 0) {
                    boss.active = false;
                    spawnBlood(boss.x + boss.w/2, boss.y + boss.h/2, 25);
                    pickups.push({x: boss.x, baseY: 200, y: 200, w: 24, h: 28, type: Math.floor(Math.random()*5), floatTimer: 0});
                }
                continue;
            }
        }

        let hitEnemy = false;
        if (b.fromPlayer) {
            for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                    e.hp--;
                    hitEnemy = true;
                    spawnBlood(e.x + e.w/2, e.y + e.h/2, 5);
                    if (e.hp <= 0) {
                        spawnBlood(e.x + e.w/2, e.y + e.h/2, 15);
                        if (Math.random() < 0.3) {
                            pickups.push({x: e.x, baseY: e.y, y: e.y, w: 24, h: 28, type: Math.floor(Math.random()*5), floatTimer: 0});
                        }
                        enemies.splice(j, 1);
                    }
                    break;
                }
            }
        }
        if (hitEnemy) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        let distToPlayer = Math.abs(e.x - leadX);
        
        if (distToPlayer < 550) {
            if (e.type !== 'turret') {
                e.behaviorTimer++;
                if (e.behaviorTimer > 100) {
                    e.behaviorTimer = 0;
                    e.moveDir = leadX < e.x ? -1 : 1;
                }
                e.vx = e.moveDir * 0.9;
                e.x += e.vx;
            }

            e.shootTimer++;
            if (e.shootTimer > 90) {
                e.shootTimer = 0;
                let exactHeadLevelY = e.y + 12;
                bullets.push({x: e.x + (e.moveDir > 0 ? 35 : -5), y: exactHeadLevelY, vx: e.type === 'turret' ? -4 : e.moveDir * 4.5, vy: 0, fromPlayer: false});
            }
        }
    }

    if (boss && boss.active) {
        boss.y += boss.vy;
        if (boss.y < 20 || boss.y > 140) boss.vy *= -1;
        boss.timer++;
        if (boss.timer > 35) {
            boss.timer = 0;
            bullets.push({x: boss.x, y: boss.y + 60, vx: -5.5, vy: (Math.random() - 0.5) * 1.5, fromPlayer: false});
        }
    }

    if (boss && !boss.active) {
        if (currentLevel < MAX_LEVELS) startLevel(currentLevel + 1);
        else gameState = 'VICTORY';
    }

    for (let i = pickups.length - 1; i >= 0; i--) {
        let pk = pickups[i];
        let target = null;
        if (p1.active && Math.abs(p1.x - pk.x) < 32 && Math.abs(p1.y - pk.y) < 32) target = p1;
        if (p2.active && Math.abs(p2.x - pk.x) < 32 && Math.abs(p2.y - pk.y) < 32) target = p2;

        if (target) {
            if (pk.type === 4) target.life = Math.min(5, target.life + 1);
            else target.weapon = pk.type;
            pickups.splice(i, 1);
        }
    }

    cameraX = leadX - 220;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > STAGE_LENGTH - canvas.width) cameraX = STAGE_LENGTH - canvas.width;
}

function handlePlayerInput(p, input) {
    if (!p.active) return;

    if (p.hanging) {
        p.vx = 0;
        p.vy = 0;
        if (input.jump || input.up) {
            const l = p.ledgeObj;
            p.h = 56;
            p.ducking = false;
            p.x = p.dir > 0 ? l.x + 6 : l.x + l.w - p.w - 6;
            p.y = l.y - p.h;
            p.vy = -1.5;
            p.hanging = false;
            p.grounded = true;
            p.canDoubleJump = true;
            p.ledgeObj = null;
        } else if (input.down) {
            p.hanging = false;
            p.vy = 3.0;
            p.y += 4;
            p.ledgeObj = null;
        }
        return;
    }

    p.vx = 0;
    if (input.left) { p.vx = -p.speed; p.dir = -1; p.animTimer += 0.25; }
    if (input.right) { p.vx = p.speed; p.dir = 1; p.animTimer += 0.25; }

    const wantsDuck = !!input.down && p.grounded;
    const targetH = wantsDuck ? 24 : 56;
    if (p.h !== targetH) {
        const feet = p.y + p.h;
        p.h = targetH;
        p.y = feet - p.h;
    }
    p.ducking = wantsDuck;

    p.up = !!input.up;
    p.down = !!input.down;

    if (input.shoot && (!p.lastShoot || performance.now() - p.lastShoot > 120)) {
        p.lastShoot = performance.now();
        fireOmniDirectionalWeapon(p, input);
    }
}

function fireOmniDirectionalWeapon(p, input) {
    let dx = 0;
    let dy = 0;

    if (input.left) dx = -1;
    if (input.right) dx = 1;
    if (input.up) dy = -1;
    if (input.down) dy = 1;

    // Default horizontal direction if no specific directional modifier is given
    if (dx === 0 && dy === 0) {
        dx = p.dir;
    } else if (dx !== 0) {
        p.dir = dx;
    }

    const speed = 10.0;
    let vx = 0, vy = 0;

    if (dx !== 0 && dy !== 0) {
        const diag = speed * 0.7071;
        vx = dx * diag; 
        vy = dy * diag;
    } else if (dx !== 0) {
        vx = dx * speed;
        vy = 0;
    } else if (dy !== 0) {
        vx = 0;
        vy = dy * speed;
    }

    const gunYOffset = p.ducking ? 11 : 22;
    const gunX = p.dir > 0 ? p.x + p.w - 1 : p.x - 7;

    const addBullet = (vx2, vy2, damage=1) => {
        bullets.push({
            x: gunX, y: p.y + gunYOffset,
            vx: vx2, vy: vy2, fromPlayer: true, damage
        });
    };

    if (p.weapon === 0) addBullet(vx, vy);
    else if (p.weapon === 1) {
        addBullet(vx, vy);
        addBullet(vx * 0.95, vy - 2.5);
        addBullet(vx * 0.95, vy + 2.5);
    } else if (p.weapon === 2) {
        addBullet(vx * 1.5, vy * 1.5, 2);
    } else if (p.weapon === 3) {
        addBullet(vx * 0.8, vy * 0.8 - 1.2, 2);
    } else {
        addBullet(vx * 0.7, vy + (Math.random() - 0.5) * 3, 2);
    }
}

function rectsOverlap(a, b, pad=0) {
    return a.x < b.x + b.w + pad &&
           a.x + a.w > b.x - pad &&
           a.y < b.y + b.h + pad &&
           a.y + a.h > b.y - pad;
}

function updatePlayerPhysics(p, inputState) {
    if (p.hanging) return;

    if (inputState.jump && !p.jumpPressedLast) {
        if (p.grounded && !p.ducking) {
            p.vy = p.jumpForce;
            p.grounded = false;
            p.canDoubleJump = true;
        } else if (!p.grounded && p.canDoubleJump) {
            p.vy = p.jumpForce * 0.9;
            p.canDoubleJump = false;
            spawnBlood(p.x + p.w/2, p.y + p.h, 3);
        }
        p.jumpPressedLast = true;
    }
    if (!inputState.jump) {
        p.jumpPressedLast = false;
    }

    const oldBottom = p.y + p.h;
    p.x += p.vx;
    p.vy += 0.42;
    p.y += p.vy;

    if (p.x < 0) p.x = 0;
    if (p.x > STAGE_LENGTH - p.w) p.x = STAGE_LENGTH - p.w;

    p.grounded = false;
    const floorY = 276;

    for (const l of platforms) {
        if (l.type !== 'ledge') continue;

        const horizontal = p.x + p.w - 5 > l.x && p.x + 5 < l.x + l.w;
        const crossedTop = oldBottom <= l.y + 4 && p.y + p.h >= l.y;
        
        if (horizontal && crossedTop && p.vy >= 0) {
            if (inputState.down && inputState.jump) {
                p.y += 6;
                p.vy = 2.0;
                continue;
            }
            p.y = l.y - p.h;
            p.vy = 0;
            p.grounded = true;
            p.canDoubleJump = true;
            break;
        }

        const isHighEnough = l.y < p.y + 20; 
        const nearRightLip = p.dir > 0 && Math.abs((p.x + p.w) - l.x) < 12;
        const nearLeftLip = p.dir < 0 && Math.abs(p.x - (l.x + l.w)) < 12;
        const nearLip = (nearRightLip || nearLeftLip) && isHighEnough;
        const verticalWindow = p.y + p.h > l.y + 2 && p.y < l.y + l.h + 24;

        if (!p.grounded && nearLip && verticalWindow && p.vy < 3.0) {
            p.hanging = true;
            p.ledgeObj = l;
            p.x = nearRightLip ? l.x - p.w + 2 : l.x + l.w - 2;
            p.y = l.y + 3;
            p.vx = 0;
            p.vy = 0;
            break;
        }
    }

    if (p.hanging) return;

    if (p.y + p.h >= floorY) {
        let overPit = false;
        for (const pit of platforms) {
            if (pit.type === 'pit' &&
                p.x + p.w * 0.5 > pit.x &&
                p.x + p.w * 0.5 < pit.x + pit.w) {
                overPit = true;
                break;
            }
        }

        if (overPit) {
            if (p.y > canvas.height + 30) triggerPlayerDeath(p);
        } else {
            p.y = floorY - p.h;
            p.vy = 0;
            p.grounded = true;
            p.canDoubleJump = true;
        }
    }

    for (let h of hazards) {
        if (h.type === 'water') continue;

        if (rectsOverlap(p, h)) {
            spawnBlood(p.x + p.w/2, p.y + p.h/2, 6);
            triggerPlayerDamage(p);
        }
    }

    if (p.invulnerable > 0) p.invulnerable--;

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (!b.fromPlayer) {
            const bulletBox = { x: b.x - 2, y: b.y - 2, w: 8, h: 5 };
            if (rectsOverlap(p, bulletBox)) {
                bullets.splice(i, 1);
                spawnBlood(p.x + p.w/2, p.y + p.h/2, 5);
                triggerPlayerDamage(p);
            }
        }
    }
}

function triggerPlayerDamage(p) {
    if (p.invulnerable === 0) {
        p.life--;
        p.invulnerable = 75;
        if (p.life <= 0) handlePlayerLoss(p);
    }
}

function triggerPlayerDeath(p) {
    p.life--;
    p.invulnerable = 75;
    p.vy = -7;
    p.hanging = false;
    p.ledgeObj = null;
    p.x = Math.max(0, cameraX + 40);
    p.y = 220;
    spawnBlood(p.x, p.y, 10);
    if (p.life <= 0) handlePlayerLoss(p);
}

function handlePlayerLoss(p) {
    if (p.continues > 0) {
        p.continues--;
        p.life = 3;
        p.x = cameraX + 50;
        p.y = 220;
    } else {
        if ((p === p1 && !p2.active) || (!p1.active && p === p2) || (!p1.active && !p2.active)) {
            gameState = 'GAMEOVER';
        } else {
            p.active = false;
        }
    }
}

function handleGamepads() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < gamepads.length; i++) {
        let gp = gamepads[i];
        if (!gp) continue;
        let target = i === 0 ? p1 : p2;
        if (i === 1 && !p2.active) p2.active = true;
        keys['GamepadJoin'] = true;

        let input = {
            left: gp.axes[0] < -0.4 || gp.buttons[14].pressed,
            right: gp.axes[0] > 0.4 || gp.buttons[15].pressed,
            up: gp.axes[1] < -0.4 || gp.buttons[12].pressed,
            down: gp.axes[1] > 0.4 || gp.buttons[13].pressed,
            jump: gp.buttons[0].pressed,
            shoot: gp.buttons[2].pressed
        };
        handlePlayerInput(target, input);
    }
}

function pxRect(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function drawCommando(p) {
    if (p.invulnerable > 0 && Math.floor(p.invulnerable / 4) % 2 === 0) return;
    ctx.save();
    ctx.translate(Math.round(p.x), Math.round(p.y));

    const skin = '#d58b55';
    const skinHi = '#f0b06b';
    const vest = p.color;
    const dark = '#17231c';
    const gun = '#333b42';
    const metal = '#cfd8dc';
    const barrel = '#11181c';

    if (p.hanging) {
        pxRect(6, 7, 24, 18, vest);
        pxRect(9, -4, 17, 12, skin);
        pxRect(8, -5, 19, 5, '#3a2b20');
        pxRect(p.dir > 0 ? 25 : 1, 25, 9, 14, dark);
        pxRect(p.dir > 0 ? 30 : -4, 20, 7, 4, skinHi);
        ctx.restore();
        return;
    }

    if (p.ducking) {
        pxRect(3, 15, 11, 9, dark);
        pxRect(21, 15, 11, 9, dark);
        pxRect(4, 7, 28, 13, vest);
        pxRect(8, 1, 18, 8, skin);
        pxRect(7, 0, 20, 4, '#3a2b20');
        pxRect(12, 9, 13, 4, '#273c2e');
        if (p.dir > 0) {
            pxRect(24, 9, 18, 6, gun);
            pxRect(28, 15, 6, 5, '#1e2326');
            pxRect(40, 8, 8, 8, metal);
            pxRect(46, 10, 6, 4, barrel);
        } else {
            pxRect(-8, 9, 18, 6, gun);
            pxRect(-2, 15, 6, 5, '#1e2326');
            pxRect(-16, 8, 8, 8, metal);
            pxRect(-20, 10, 6, 4, barrel);
        }
    } else {
        // Refined multi-joint running leg cycle animation
        let isMoving = p.grounded && p.vx !== 0;
        let hipOffsetL = 0, hipOffsetR = 0;
        let kneeOffsetL = 0, kneeOffsetR = 0;
        let footOffsetLX = 0, footOffsetRX = 0;

        if (isMoving) {
            let cycle = Math.sin(p.animTimer * 1.5);
            hipOffsetL = Math.round(Math.sin(p.animTimer * 1.5) * 6);
            hipOffsetR = Math.round(Math.sin(p.animTimer * 1.5 + Math.PI) * 6);
            kneeOffsetL = cycle > 0 ? 3 : -2;
            kneeOffsetR = cycle < 0 ? 3 : -2;
            footOffsetLX = cycle > 0 ? 4 : -3;
            footOffsetRX = cycle < 0 ? 4 : -3;
        }

        // Left leg joints
        pxRect(6, 36 + hipOffsetL, 8, 7, dark);
        pxRect(6, 43 + hipOffsetL, 8, 7 + kneeOffsetL, '#22382b');
        pxRect(4 + footOffsetLX, 50 + hipOffsetL, 11, 5, '#0b1110');

        // Right leg joints
        pxRect(20, 36 + hipOffsetR, 8, 7, dark);
        pxRect(20, 43 + hipOffsetR, 8, 7 + kneeOffsetR, '#22382b');
        pxRect(18 + footOffsetRX, 50 + hipOffsetR, 11, 5, '#0b1110');

        pxRect(7, 34, 10, 8, '#254b38');
        pxRect(20, 34, 10, 8, '#254b38');

        pxRect(5, 14, 27, 22, vest);
        pxRect(8, 17, 4, 17, '#356d50');
        pxRect(22, 17, 4, 17, '#356d50');
        pxRect(14, 17, 3, 19, '#14241b');
        pxRect(25, 25, 6, 6, '#111');

        pxRect(8, 3, 19, 14, skin);
        pxRect(7, 2, 20, 5, '#3a2b20');
        pxRect(11, 8, 4, 3, skinHi);
        pxRect(23, 8, 3, 2, '#202020');

        // Aiming postures (Up, Diagonal, Horizontal)
        if (p.up && ((keys['KeyA'] || keys['ArrowLeft']) || (keys['KeyD'] || keys['ArrowRight']))) {
            pxRect(p.dir > 0 ? 18 : -8, -4, 14, 7, gun);
            pxRect(p.dir > 0 ? 22 : -2, 3, 5, 8, '#1e2326');
            pxRect(p.dir > 0 ? 28 : -12, -9, 8, 8, metal);
            pxRect(p.dir > 0 ? 34 : -16, -11, 6, 4, barrel);
        } else if (p.up) {
            pxRect(p.dir > 0 ? 20 : 4, -8, 7, 20, gun);
            pxRect(p.dir > 0 ? 25 : -2, 0, 8, 6, '#1e2326');
            pxRect(p.dir > 0 ? 19 : 3, -14, 9, 8, metal);
            pxRect(p.dir > 0 ? 21 : 5, -18, 5, 5, barrel);
        } else if (p.dir > 0) {
            pxRect(23, 19, 20, 7, gun);
            pxRect(29, 24, 7, 7, '#1e2326');
            pxRect(41, 17, 10, 10, metal);
            pxRect(49, 19, 7, 6, barrel);
            pxRect(18, 20, 7, 5, '#3a2b20');
        } else {
            pxRect(-9, 19, 20, 7, gun);
            pxRect(-3, 24, 7, 7, '#1e2326');
            pxRect(-19, 17, 10, 10, metal);
            pxRect(-24, 19, 7, 6, barrel);
            pxRect(9, 20, 7, 5, '#3a2b20');
        }
    }
    ctx.restore();
}

function drawEnemy(e) {
    ctx.save();
    ctx.translate(Math.round(e.x), Math.round(e.y));
    
    if (e.type === 'turret') {
        pxRect(8, 28, 22, 18, '#555');
        pxRect(12, 32, 14, 10, '#222');
        pxRect(10, 14, 18, 16, '#7f8c8d');
        pxRect(e.moveDir > 0 ? 24 : -6, 18, 12, 6, '#2c3e50');
    } else if (e.type === 'alien_crawler') {
        ctx.fillStyle = '#76329e';
        ctx.beginPath();
        ctx.ellipse(19, 30, 16, 12, 0, 0, Math.PI * 2);
        ctx.fill();
        pxRect(11, 14, 16, 16, '#481c63');
        pxRect(12, 8, 6, 8, '#b861f5');
        pxRect(20, 8, 6, 8, '#b861f5');
        pxRect(14, 17, 4, 4, '#00ffcc');
        pxRect(20, 17, 4, 4, '#00ffcc');
    } else if (e.type === 'alien_drone') {
        ctx.fillStyle = '#2db872';
        ctx.beginPath();
        ctx.arc(19, 22, 15, 0, Math.PI * 2);
        ctx.fill();
        pxRect(10, 17, 18, 6, '#135c35');
        pxRect(15, 12, 8, 14, '#e6ff00');
    } else {
        pxRect(8, 10, 22, 34, '#8a1c1c');
        pxRect(5, 18, 28, 8, '#cf3434');
        pxRect(11, 4, 16, 14, '#521010');
        pxRect(13, 8, 4, 4, '#ffea00');
        pxRect(21, 8, 4, 4, '#ffea00');
    }
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'MENU') {
        ctx.fillStyle = '#f39c12';
        ctx.font = 'bold 24px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('SUPER RETRO ALIEN WARS', canvas.width/2, 75);
        ctx.fillStyle = '#fff';
        ctx.font = '12px Courier New';
        ctx.fillText('W,A,S,D: OMNI-DIRECTIONAL 8-WAY AIM & MOVE', canvas.width/2, 115);
        ctx.fillText('SPACE: DOUBLE JUMP   SHIFT: FIRE   DOWN+SPACE: DROP DOWN', canvas.width/2, 145);
        ctx.fillText('CLIFF TURRETS & ENEMIES ADDED. REFINED RUNNING LEGS!', canvas.width/2, 175);
        ctx.fillText('PRESS SPACE OR SHIFT TO START', canvas.width/2, 220);
        ctx.fillText('2 PLAYERS: PRESS C TO JOIN P2', canvas.width/2, 260);
        return;
    }

    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 30px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
        ctx.fillStyle = '#fff';
        ctx.font = '13px Courier New';
        ctx.fillText('PRESS SPACE OR SHIFT TO RESTART', canvas.width/2, canvas.height/2 + 40);
        return;
    }

    if (gameState === 'VICTORY') {
        ctx.fillStyle = '#2ecc71';
        ctx.font = 'bold 24px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION COMPLETE! EARTH IS SAVED.', canvas.width/2, canvas.height/2);
        ctx.fillStyle = '#fff';
        ctx.font = '13px Courier New';
        ctx.fillText('PRESS SPACE OR SHIFT TO RESTART', canvas.width/2, canvas.height/2 + 40);
        return;
    }

    let theme = LEVEL_THEMES[(currentLevel - 1) % LEVEL_THEMES.length];

    const sky = ctx.createLinearGradient(0, 0, 0, 276);
    sky.addColorStop(0, '#24152d');
    sky.addColorStop(0.38, theme.skyTop);
    sky.addColorStop(0.72, '#d85a27');
    sky.addColorStop(1, '#f4b45f');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(-cameraX * 0.08, 0);
    for (let i = -200; i < STAGE_LENGTH + 600; i += 170) {
        const y = 55 + ((i / 170) % 3) * 18;
        pxRect(i, y, 95, 7, 'rgba(74,29,31,.55)');
        pxRect(i + 18, y - 5, 52, 6, 'rgba(255,176,83,.38)');
        pxRect(i + 65, y + 7, 70, 5, 'rgba(98,35,28,.45)');
    }
    ctx.restore();

    ctx.save();
    ctx.translate(-cameraX * 0.14, 0);
    for (let i = -200; i < STAGE_LENGTH + 500; i += 110) {
        const h = 65 + ((i / 110) % 4) * 13;
        const bldgX = i;
        const bldgY = 210 - h;
        const bldgW = 70;
        const bldgH = h + 66;

        pxRect(bldgX, bldgY, bldgW, bldgH, '#263c29');

        for (let wx = bldgX + 8; wx < bldgX + bldgW - 10; wx += 14) {
            for (let wy = bldgY + 12; wy < bldgY + bldgH - 20; wy += 18) {
                pxRect(wx, wy, 8, 11, (wx + wy) % 3 === 0 ? '#ffea75' : '#4e6e52');
            }
        }
    }
    ctx.restore();

    ctx.save();
    ctx.translate(-cameraX * 0.20, 0);
    for (let tf of terrainFeatures) {
        if (tf.type === 'mound') {
            ctx.fillStyle = '#223825';
            ctx.beginPath();
            ctx.ellipse(tf.x + tf.w/2, 276, tf.w/2, tf.h, 0, Math.PI, 0, false);
            ctx.fill();
            ctx.fillStyle = '#3a4f3d';
            pxRect(tf.x + tf.w * 0.3, 276 - tf.h * 0.6, tf.w * 0.4, 6, '#4c6350');
        }
    }
    ctx.restore();

    ctx.save();
    ctx.translate(-cameraX, 0);

    let drawStart = cameraX - 50;
    let drawEnd = cameraX + canvas.width + 50;
    
    let pMap = platforms.filter(p => p.type === 'pit');
    pMap.sort((a,b) => a.x - b.x);

    let renderSegments = [];
    let lastEdge = 0;
    for (let pit of pMap) {
        if (pit.x > lastEdge) {
            renderSegments.push({ start: lastEdge, end: pit.x });
        }
        lastEdge = pit.x + pit.w;
    }
    renderSegments.push({ start: lastEdge, end: STAGE_LENGTH + 500 });

    for (let seg of renderSegments) {
        if (seg.end > drawStart && seg.start < drawEnd) {
            ctx.fillStyle = '#29351f';
            ctx.fillRect(seg.start, 276, seg.end - seg.start, 84);
            ctx.fillStyle = '#52683a';
            ctx.fillRect(seg.start, 276, seg.end - seg.start, 7);

            for (let gx = Math.floor(seg.start / 24) * 24; gx < seg.end; gx += 24) {
                const seed = Math.abs(Math.floor(gx * 17.31)) % 9;
                pxRect(gx, 287 + seed, 15, 5, '#3b4528');
                pxRect(gx + 8, 304 + (seed % 5), 19, 6, '#1e291b');
                pxRect(gx - 5, 330 - (seed % 7), 13, 4, '#56633a');
                if (seed % 3 === 0) pxRect(gx + 3, 318, 5, 5, '#687647');
            }
        }
    }

    for (let l of platforms) {
        if (l.type === 'ledge') {
            pxRect(l.x, l.y, l.w, l.h, '#46533a');
            pxRect(l.x, l.y, l.w, 5, '#77805a');
            pxRect(l.x + 5, l.y + 7, l.w - 10, 5, '#303b2a');
        }
    }

    for (let h of hazards) {
        if (h.type === 'water') {
            ctx.fillStyle = 'rgba(28, 107, 160, 0.75)';
            ctx.fillRect(h.x, h.y + 8, h.w, h.h - 8);
            ctx.fillStyle = 'rgba(74, 180, 235, 0.6)';
            ctx.fillRect(h.x, h.y + 4, h.w, 5);
        } else {
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(h.x, h.y + h.h);
            ctx.lineTo(h.x + h.w/2, h.y);
            ctx.lineTo(h.x + h.w, h.y + h.h);
            ctx.closePath();
            ctx.fill();
        }
    }

    for (let pk of pickups) {
        ctx.fillStyle = pk.type === 4 ? '#00ffff' : '#d2b4de';
        ctx.beginPath();
        ctx.ellipse(pk.x + pk.w/2, pk.y + pk.h/2, pk.w/2, pk.h/2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = 'bold 11px Courier New';
        ctx.fillText(pk.type === 4 ? 'H' : WEAPON_NAMES[pk.type][0], pk.x + 7, pk.y + 18);
    }

    if (boss && boss.active) {
        ctx.fillStyle = '#99154e';
        ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
        ctx.fillStyle = '#111';
        ctx.fillRect(boss.x, boss.y - 18, boss.w, 8);
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(boss.x, boss.y - 18, boss.w * (boss.hp / boss.maxHp), 8);
    }

    for (let e of enemies) drawEnemy(e);

    if (p1.active) drawCommando(p1);
    if (p2.active) drawCommando(p2);

    for (let bp of bloodParticles) {
        ctx.fillStyle = '#cc0022';
        ctx.fillRect(Math.round(bp.x), Math.round(bp.y), bp.size, bp.size);
    }

    for (let b of bullets) {
        const enemyShot = !b.fromPlayer;
        ctx.fillStyle = enemyShot ? '#ff6b32' : '#ffd34d';
        ctx.fillRect(b.x, b.y, 6, 5);
    }

    ctx.restore();

    document.getElementById('p1-hud').innerText = `[P1 LIFE: ${p1.life}] [CONT: ${p1.continues}] [WPN: ${WEAPON_NAMES[p1.weapon][0]}]`;
    document.getElementById('p2-hud').innerText = p2.active ? `[P2 LIFE: ${p2.life}] [CONT: ${p2.continues}] [WPN: ${WEAPON_NAMES[p2.weapon][0]}]` : `[PRESS C TO JOIN P2]`;
    document.getElementById('level-hud').innerText = `[STAGE ${currentLevel}: ${theme.name}]`;
}

function mainLoop() {
    updateGame();
    draw();
    requestAnimationFrame(mainLoop);
}

requestAnimationFrame(mainLoop);
</script>

</body>
