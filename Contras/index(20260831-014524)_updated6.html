let audioCtx=null,audioReady=false,musicTimer=null,musicStep=0,muted=false;
// ===================== EASY AUDIO VOLUME SETTINGS =====================
// Change these two numbers only. Range: 0.00 (silent) to 1.00 (full volume).
const MUSIC_VOLUME = 0.42;
const SFX_VOLUME   = 0.60; // 40% quieter than the previous SFX level
// =====================================================================
// Numbered soundtrack: mp3/1.mp3, mp3/2.mp3, mp3/3.mp3 ...
// The game starts with 1-4 today, but it automatically accepts 5, 6, etc. later as long as numbering stays consecutive.
const FIRST_MUSIC_TRACK=1;
const musicPlayer=new Audio();musicPlayer.loop=false;musicPlayer.preload='auto';musicPlayer.volume=MUSIC_VOLUME;
let musicTrack=FIRST_MUSIC_TRACK,musicStopped=false,musicLoadReason='startup';
function musicSrc(track){return `mp3/${track}.mp3`}
function loadMusicTrack(track,autoplay=false,reason='direct'){
 musicTrack=Math.max(FIRST_MUSIC_TRACK,Math.floor(track)||FIRST_MUSIC_TRACK);
 musicLoadReason=reason;musicStopped=false;musicPlayer.muted=false;
 musicPlayer.src=musicSrc(musicTrack);musicPlayer.load();
 updateMuteButton?.();
 if(autoplay){const pp=musicPlayer.play();if(pp&&pp.catch)pp.catch(()=>{});}
}
function stopMusic(){
 musicStopped=true;musicPlayer.pause();musicPlayer.removeAttribute('src');musicPlayer.load();updateMuteButton?.();
}
// Natural playback keeps advancing. The first missing numbered file marks the end of the playlist, then it loops to track 1.
musicPlayer.addEventListener('ended',()=>loadMusicTrack(musicTrack+1,true,'auto-next'));
musicPlayer.addEventListener('error',()=>{
 if(musicStopped)return;
 if(musicLoadReason==='auto-next'&&musicTrack>FIRST_MUSIC_TRACK){loadMusicTrack(FIRST_MUSIC_TRACK,true,'playlist-loop');return;}
 // When the player manually advances past the last existing song, the music button turns the soundtrack off.
 if(musicLoadReason==='manual-next'){stopMusic();return;}
 if(musicTrack!==FIRST_MUSIC_TRACK){loadMusicTrack(FIRST_MUSIC_TRACK,true,'recovery');return;}
 stopMusic();
});
function ensureAudio(){
 if(!audioReady){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume?.();audioReady=true}catch(e){}}
 startMusic();
}
function tone(freq,dur=.08,type='square',gain=.025,slide=0){
 if(!audioReady||muted)return;gain*=SFX_VOLUME;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;
 o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(35,freq+slide),t+dur);
 g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur)
}
function noise(dur=.08,gain=.02){
 if(!audioReady||muted)return;gain*=SFX_VOLUME;const n=Math.floor(audioCtx.sampleRate*dur),buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 const s=audioCtx.createBufferSource(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
 s.buffer=buf;f.type='bandpass';f.frequency.value=1000;g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
 s.connect(f);f.connect(g);g.connect(audioCtx.destination);s.start()
}
const FILE_SFX_NAMES=['death','shoot','splat','splatter','game over','loose life','explosion','cannon','mortar','game start','boss death','hostage'];
const FILE_SFX_POOL={};
function makeFileSfx(name){
 const a=new Audio();a.preload='auto';a.playsInline=true;
 const types={mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',m4a:'audio/mp4'};
 for(const ext of ['mp3','wav','ogg','m4a']){const src=document.createElement('source');src.src=`sfx/${encodeURIComponent(name)}.${ext}`;src.type=types[ext];a.appendChild(src)}
 return a;
}
for(const name of FILE_SFX_NAMES)FILE_SFX_POOL[name]=Array.from({length:(('ontouchstart' in window)||navigator.maxTouchPoints>0)?2:4},()=>makeFileSfx(name));
const fileSfxIndex=Object.create(null),fileSfxLast=Object.create(null);
function playFileSfx(name,vol=.72,minGap=.025){
 if(muted||!FILE_SFX_POOL[name])return;
 const now=performance.now()/1000;if(now-(fileSfxLast[name]||-999)<minGap)return;fileSfxLast[name]=now;
 const pool=FILE_SFX_POOL[name],i=((fileSfxIndex[name]||0)+1)%pool.length;fileSfxIndex[name]=i;
 const a=pool[i];a.volume=Math.max(0,Math.min(1,vol*SFX_VOLUME));a.currentTime=0;const q=a.play();if(q&&q.catch)q.catch(()=>{});
}
function sfx(n){
 ensureAudio();
 if(muted)return;
 if(n==='shot')playFileSfx('shoot',.68,.025);
 else if(n==='enemy')playFileSfx('shoot',.42,.045);
 else if(n==='kill'){playFileSfx('death',.76,.045);playFileSfx('splat',.64,.045)}
 else if(n==='explode'){playFileSfx('explosion',.78,.055);playFileSfx('splatter',.34,.07)}
 else if(n==='game over')playFileSfx('game over',.88,.25);
 else if(n==='loose life')playFileSfx('loose life',.82,.16);
 else if(n==='cannon')playFileSfx('cannon',.82,.08);
 else if(n==='mortar')playFileSfx('mortar',.82,.10);
 else if(n==='game start')playFileSfx('game start',.86,.30);
 else if(n==='boss death')playFileSfx('boss death',.90,.35);
 else if(n==='hostage')playFileSfx('hostage',.80,.35);
 if(!audioReady)return;
 if(n==='shot'){
   // Harder, rockier rifle crack: gritty blast + low punch + biting snap.
   noise(.038,.042);
   tone(108,.085,'sawtooth',.034,-44);
   tone(168,.065,'square',.022,-26);
   tone(1260,.022,'square',.012,-760);
   setTimeout(()=>tone(82,.10,'triangle',.022,-14),10);
   setTimeout(()=>noise(.028,.018),28);
 }
 else if(n==='enemy'){
   noise(.036,.024);
   tone(104,.072,'sawtooth',.021,-35);
   setTimeout(()=>tone(156,.04,'square',.010,-48),14);
 }
 else if(n==='jump'){
   // Heavier combat-boot takeoff: low thump, gritty scrape, short metallic snap.
   noise(.045,.026);
   tone(92,.075,'sawtooth',.030,-28);
   tone(155,.045,'square',.018,-38);
   setTimeout(()=>tone(62,.07,'triangle',.020,-10),18);
 }
 else if(n==='double'){
   noise(.05,.028);
   tone(112,.08,'sawtooth',.032,-35);
   tone(185,.055,'square',.020,-45);
   setTimeout(()=>tone(78,.08,'triangle',.021,-14),20);
 }
 else if(n==='hit'){noise(.06,.034);tone(96,.07,'square',.022,-35)}
 else if(n==='kill'){
   noise(.095,.052);
   tone(74,.13,'sawtooth',.040,-28);
   tone(49,.19,'triangle',.046,-13);
   setTimeout(()=>tone(96,.07,'square',.024,-46),18);
   setTimeout(()=>noise(.055,.025),38);
 }
 else if(n==='explode'){
   noise(.24,.060);
   tone(82,.20,'sawtooth',.036,-42);
   setTimeout(()=>noise(.11,.026),55);
 }
 else if(n==='firework'){
   tone(560,.035,'square',.010,0);
   setTimeout(()=>noise(.012,.010),14);
 }
 else if(n==='boss'){
   tone(68,.30,'sawtooth',.043,-16);
   setTimeout(()=>tone(51,.22,'square',.018,-8),90);
 }
 else if(n==='pickup'){
   tone(540,.07,'square',.022,160);
   setTimeout(()=>tone(760,.08,'triangle',.018,110),55);
 }
}
function startMusic(){
 if(muted||musicStopped)return;
 musicPlayer.muted=false;
 if(!musicPlayer.getAttribute('src'))loadMusicTrack(musicTrack,false,'startup');
 const pp=musicPlayer.play();if(pp&&pp.catch)pp.catch(()=>{});
}
['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,ensureAudio,{once:true}));

function updateMuteButton(){if(!muteBtn)return;muteBtn.textContent=musicStopped?'♫ MUSIC OFF':`♫ TRACK ${musicTrack}  ›`;muteBtn.classList.toggle('muted',musicStopped)}
if(muteBtn)muteBtn.addEventListener('click',(e)=>{

 }

function updateAdventureFeatures(dt){
  let p=state.p;
  for(let h of state.hostages){
    if(h.exploded)continue;
    h.anim+=dt*(h.rescued?7:4);
    if(h.rescued){h.rescueAnim=(h.rescueAnim||0)+dt;continue;}
    if(h.timer==null)h.timer=h.upper?HOSTAGE_TIMER_UPPER:HOSTAGE_TIMER_GROUND;
    if(h.armed==null)h.armed=false;
    if(h.warningSfxStarted==null)h.warningSfxStarted=false;
    // The countdown only starts when you get reasonably close, so distant hostages don't die unfairly.
    let hd=Math.hypot(p.x-h.x,p.y-h.y);
    if(!h.armed&&hd<620){h.armed=true;sfx('pickup')}
    if(h.armed){
      let before=h.timer;h.timer=Math.max(0,h.timer-dt);
      if(!h.warningSfxStarted&&before>HOSTAGE_WARNING_AT&&h.timer<=HOSTAGE_WARNING_AT){h.warningSfxStarted=true;sfx('hostage')}
    }
    if(h.timer<=0){
      h.exploded=true;state.shake=.22;burst(h.x,h.y,'orange');addStain(h.x,h.y+16,'soot');sfx('explode');
      for(let i=0;i<18;i++)pfx({x:h.x,y:h.y,vx:(Math.random()-.5)*180,vy:-40-Math.random()*180,g:300,life:.7+Math.random()*.45,size:2+Math.random()*3,col:'#ff9b3d'});
      if(Math.abs(p.x-h.x)<85&&Math.abs(p.y-h.y)<95)hurtPlayer(1,h.x);
      continue;
    }
    if(Math.abs(p.x-h.x)<38&&Math.abs(p.y-h.y)<50){
      h.rescued=true;h.rescueAnim=0;h.timer=999;state.rescued++;state.score+=900;sfx('pickup');for(let i=0;i<18;i++)sparks(h.x,h.y,'gold')
    }
  }
  for(let c of state.critters){
    if(c.dead){
      c.dead=Math.max(0,c.dead-dt);c.vy=(c.vy||0)+GRAV*.72*dt;c.x+=(c.vx||0)*dt;c.y+=(c.vy||0)*dt;c.deathRot=(c.deathRot||0)+(c.vx>=0?1:-1)*dt*4.5;
      let gy=terrainY(c.x);if(gy<9000&&c.y+c.h/2>=gy){c.y=gy-c.h/2;c.vy=0;c.vx*=Math.pow(.04,dt);c.deathRot+=(Math.PI*.5-c.deathRot)*Math.min(1,dt*9)}
      continue;
    }
    if(c.hitCooldown>0)c.hitCooldown=Math.max(0,c.hitCooldown-dt);
    if(c.behaviorT==null){c.behaviorT=.5+Math.random()*2;c.homeX=c.x;c.gait=Math.random()*6;c.peckT=0}
    c.behaviorT-=dt;c.peckT=Math.max(0,(c.peckT||0)-dt);c.anim+=dt*(c.type==='bird'?8:c.hostile?8:3.5);let dx=p.x-c.x,dist=Math.abs(dx);

    if(c.type==='bird'){
      // Birds glide, flap, bank away from the player and vary altitude instead of moving on a rigid sine.
      if(c.behaviorT<=0){c.behaviorT=1.3+Math.random()*2.4;if(Math.random()<.35)c.face*=-1;c.baseY=Math.max(120,Math.min(330,c.baseY+(Math.random()-.5)*70))}
      let flee=dist<150;if(flee)c.face=dx>0?-1:1;
      let speed=flee?72:38+Math.sin(c.anim*.37)*8;
      c.x+=c.face*speed*dt;c.y+=(c.baseY+Math.sin(c.anim*.72)*16-c.y)*Math.min(1,dt*2.2);
      if(c.x<state.cam-130)c.face=1;if(c.x>state.cam+W+210)c.face=-1;
      continue
    }

    if(c.hostile&&dist<205){
      c.face=dx<0?-1:1;
      let target=c.type==='boar'?108:58;
      c.vx+=(c.face*target-c.vx)*Math.min(1,dt*(c.type==='boar'?5.5:4));
      if(dist<(c.type==='boar'?32:24)&&c.hitCooldown<=0){hurtPlayer(1,c.x);c.hitCooldown=1.15}
    }else if(dist<125&&!c.hostile){
      // Harmless animals notice the player, hesitate, then move away.
      c.face=dx>0?-1:1;
      let fleeSpeed=c.type==='chicken'?72:c.type==='pig'?54:c.type==='cow'?40:46;
      c.vx+=(c.face*fleeSpeed-c.vx)*Math.min(1,dt*4.5);
    }else{
      // Idle/wander behaviour: cows amble, pigs trot, chickens peck and scurry.
      if(c.behaviorT<=0){
        c.behaviorT=.8+Math.random()*2.5;
        if(Math.random()<.45)c.face*=-1;
        if(c.type==='chicken'&&Math.random()<.55)c.peckT=.35+Math.random()*.35;
      }
      let wander=c.peckT>0?0:(c.type==='cow'?16:c.type==='pig'?25:c.type==='chicken'?31:22);
      if(Math.abs(c.x-c.homeX)>155)c.face=c.x>c.homeX?-1:1;
      c.vx+=(c.face*wander-c.vx)*Math.min(1,dt*2.4);
    }
    let old=c.y;c.vy+=GRAV*dt;c.x+=c.vx*dt;c.y+=c.vy*dt;
    let gy=terrainY(c.x);
    if(onGroundX(c.x)&&c.y+c.h/2>=gy&&old+c.h/2<=gy+24){
      let impact=c.vy;c.y=gy-c.h/2;c.vy=0;
      // Chickens make tiny hops while fleeing; pigs/cows keep their feet planted.
      if(c.type==='chicken'&&dist<125&&impact<70&&Math.random()<dt*2.0)c.vy=-135;
    }
    if(c.y>H+80)c.dead=.01;
  }
}

function updateVictorySequence(dt){
 let v=state.victorySeq;if(!v)return;v.t+=dt;
 let p=state.p,m=v.man,h=v.heli;
 if(v.phase>=3)h.hoverT=(h.hoverT||0)+dt;
 if(v.struck&&v.phase>=2){updateFireworks(dt,true);state.enemyBullets.length=0}

 if(v.phase===0){
   // Slow-motion ejection from the destroyed boss vehicle.
   m.pose+=dt*7;
   m.spin+=dt*2.6;
   m.vy+=GRAV*.43*dt;
   m.x+=m.vx*dt;
   m.y+=m.vy*dt;
   let gy=terrainY(m.x);if(gy>9000)gy=v.groundY;
   if(m.y+m.h/2>=gy){
     m.y=gy-m.h/2;m.vy=0;m.vx*=.55;m.on=true;
     v.phase=1;v.t=0;sfx('hit');dust(m.x,gy-2);
   }
 }
 else if(v.phase===1){
   // Player must reach the suited target.
   m.face=p.x<m.x?-1:1;
   if(Math.hypot(p.x-m.x,p.y-m.y)<52){
     v.phase=2;v.t=0;v.struck=false;v.dripClock=0;
     p.face=m.x>=p.x?1:-1;
     p.vx=0;p.vy=0;p.on=true;p.flipActive=false;p.flip=0;
     p.meleeSide=p.face;p.meleeDuration=.96;p.meleeAnim=.96;p.meleeCooldown=2;p.meleeDX=p.face;p.meleeDY=-.04;p.meleeHit=false;p.meleeTarget=null;
     state.shake=.08;
   }
 }
 else if(v.phase===2){
   // Cinematic beheading beat.
   let standX=m.x-p.face*34,targetY=terrainY(standX)-p.h/2;
   if(targetY<9000){p.y+=(targetY-p.y)*Math.min(1,dt*10);p.on=true;p.vy=0;}
   p.x+=(standX-p.x)*Math.min(1,dt*10);

   if(v.t>.42&&!v.struck){
     v.struck=true;m.dead=true;
     v.head={x:m.x+p.face*3,y:m.y-37,vx:p.face*34,vy:-56,r:-p.face*.30,held:false};
     state.heads=(state.heads||0)+1;state.campaignHeads=state.heads;
     state.score+=2500;state.shake=.22;sfx('kill');
     state.enemyBullets.length=0;startFireworks();
     bloodBurst(m.x,m.y-28);bloodBurst(m.x+p.face*2,m.y-30);
     for(let i=0;i<(lowPowerMode?8:18);i++)goreDrip(m.x,m.y-31,1,16,110);
     addStain(m.x,Math.min(terrainY(m.x)-2,m.y+25),'blood');
   }
   if(v.struck){
     if(v.head&&!v.head.held){
       v.head.vy+=GRAV*.12*dt;
       v.head.x+=v.head.vx*dt;
       v.head.y+=v.head.vy*dt;
       v.head.r+=dt*1.25*p.face;
     }
     v.dripClock+=dt;
     let dripRate=lowPowerMode?.08:.045;
     while(v.dripClock>dripRate){
       v.dripClock-=dripRate;
       goreDrip(m.x,m.y-26,2,14,92);
       if(v.head)goreDrip(v.head.x,v.head.y+10,1,10,60);
     }
     if(v.t>1.28&&v.head){
       v.head.held=true;
       v.phase=3;v.t=0;
       startFireworks();sfx('pickup');
     }
   }
 }
 else if(v.phase===3){
   // Trophy hold with continuous blood drips.
   if(v.head){
     v.head.held=true;
     v.head.x=p.x+p.face*27;
     v.head.y=p.y-48;
   }
   v.dripClock+=dt;
   if(v.dripClock>(lowPowerMode?.10:.055)){
     v.dripClock=0;
     goreDrip(m.x,m.y-24,2,12,75);
     if(v.head)goreDrip(v.head.x,v.head.y+12,1,9,48);
   }
   h.rotor+=dt*25;
   let entryX=Math.min(WORLD-170,Math.max(state.cam+W*.77,p.x+210))+Math.sin(h.hoverT*1.1)*7;
   let entryY=136+Math.sin(h.hoverT*1.8)*6+Math.cos(h.hoverT*1.2)*4;
   h.x+=(entryX-h.x)*Math.min(1,dt*1.35);
   h.y+=(entryY-h.y)*Math.min(1,dt*1.75);
   if(v.t>2.55){v.phase=4;v.t=0}
 }
 else if(v.phase===4){
   if(v.head){
     v.head.held=true;
     v.head.x=p.x+p.face*27;
     v.head.y=p.y-48;
   }
   v.dripClock+=dt;
   if(v.dripClock>(lowPowerMode?.12:.06)){
     v.dripClock=0;
     goreDrip(m.x,m.y-24,1,10,62);
     if(v.head)goreDrip(v.head.x,v.head.y+12,1,8,42);
   }
   h.rotor+=dt*28;
   let hoverBaseX=Math.max(state.cam+W*.68,p.x+165),hoverBaseY=132;
   let swirlX=Math.sin(h.hoverT*1.05)*14+Math.sin(h.hoverT*2.3)*4;

   h.y+=(hoverBaseY+swirlY-h.y)*Math.min(1,dt*2.0);
   let rx=h.x+8,top=h.y+30,deploy=Math.min(1,Math.max(0,v.t/1.15));deploy=1-Math.pow(1-deploy,3);let bottom=Math.min(top+184*deploy,458);

   if(deploy>.90&&h.y>74&&Math.abs(p.x-rx)<52&&p.y>top-34&&p.y<bottom+54){
     v.phase=5;v.t=0;p.vx=0;p.vy=0;p.x=rx;p.y=bottom+2;sfx('pickup');startFireworks();

 else if(v.phase===5){

   state.camY+=(0-state.camY)*Math.min(1,dt*3.4);
   if(h.x<310){v.phase=6;v.t=0}
 }
 else if(v.phase===6){

   let guide=verticalGuideInput();

   p.x=h.x;p.y=h.y+166;p.vx=-285;p.vy=-22+guide*110;p.on=false;p.climb=false;p.rideHeli=true;

function severEnemyPart(e,part,x,y){
 if(!e||e.dead)return false;

 if(part==='armR'&&e.noArmR)return false;
 if(part==='legL'&&e.noLegL)return false;
 if(part==='legR'&&e.noLegR)return false;
 if(part==='head'){e.noHead=1;spawnGib(x,y-18,'head',e.face||1,'#b32f2b',enemyHeadStyle(e))}
 else if(part==='armL'){e.noArmL=1;spawnGib(x-10,y-7,'arm',-1)}
 else if(part==='armR'){e.noArmR=1;spawnGib(x+10,y-7,'arm',1)}
 else if(part==='legL'){e.noLegL=1;spawnGib(x-6,y+12,'leg',-1)}
 else if(part==='legR'){e.noLegR=1;spawnGib(x+6,y+12,'leg',1)}
 bloodBurst(x,y);playFileSfx(part==='head'?'splatter':'splat',part==='head'?.78:.58,.055);addStain(x,(onGroundX(x)?terrainY(x):GY)-2,'blood');

 if(Math.random()>chance)return;

function drawHostageArrow(){

 let h=c.reduce((a,b)=>Math.hypot(p.x-a.x,p.y-a.y)<=Math.hypot(p.x-b.x,p.y-b.y)?a:b);
 let sx=h.x-state.cam,sy=h.y-state.camY,px=p.x-state.cam,py=p.y-state.camY;
 // If the hostage itself is visible, mark its exact position instead of pointing vaguely from screen center.
 if(sx>18&&sx<W-18&&sy>60&&sy<H-20){X.save();X.translate(sx,sy-38);X.fillStyle='rgba(5,10,12,.72)';X.beginPath();X.arc(0,0,7,0,Math.PI*2);X.fill();X.fillStyle='#ffe05c';X.beginPath();X.moveTo(0,7);X.lineTo(-5,-2);X.lineTo(5,-2);X.closePath();X.fill();X.restore();return}
 let ang=Math.atan2(sy-py,sx-px),dx=Math.cos(ang),dy=Math.sin(ang),left=14,right=W-14,top=60,bottom=H-18,t=Infinity;
 if(dx>0)t=Math.min(t,(right-px)/dx);else if(dx<0)t=Math.min(t,(left-px)/dx);
 if(dy>0)t=Math.min(t,(bottom-py)/dy);else if(dy<0)t=Math.min(t,(top-py)/dy);
 if(!Number.isFinite(t)||t<0)t=40;let ax=px+dx*t,ay=py+dy*t;
 X.save();X.translate(ax,ay);X.rotate(ang);X.fillStyle='rgba(4,10,12,.70)';X.beginPath();X.arc(0,0,9,0,Math.PI*2);X.fill();X.strokeStyle='#ffe05c';X.lineWidth=1.2;X.stroke();X.fillStyle='#ffe05c';X.beginPath();X.moveTo(8,0);X.lineTo(-4,-5);X.lineTo(-1,0);X.lineTo(-4,5);X.closePath();X.fill();X.restore();
