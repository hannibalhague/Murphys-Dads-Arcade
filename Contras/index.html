<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Retro Alien Wars</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 35px rgba(255, 120, 35, 0.35);
            border: 5px solid #16130f;
            background: #111;
            width: 640px;
            max-width: 100%;
        }
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
            mix-blend-mode: screen;
        }
        canvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: auto;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            letter-spacing: 1px;
        }
        #touch-controls {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            pointer-events: none;
        }
        .touch-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .t-btn {
            width: 55px;
            height: 55px;
            background: rgba(211, 84, 0, 0.3);
            border: 2px solid rgba(230, 126, 34, 0.7);
            border-radius: 50%;
            color: white;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6);
            text-align: center;
        }
        .t-btn:active, .t-btn.active-press {
            background: rgba(230, 126, 34, 0.8);
            transform: scale(0.95);
        }
        #joystick-base {
            position: relative;
            width: 110px;
            height: 110px;
            background: rgba(211, 84, 0, 0.2);
            border: 2px solid rgba(230, 126, 34, 0.5);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joystick-labels {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-size: 10px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.5);
        }
        #joystick-labels .jl-w { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); }
        #joystick-labels .jl-s { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); }
        #joystick-labels .jl-a { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); }
        #joystick-labels .jl-d { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); }
        
        #joystick-stick {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: rgba(230, 126, 34, 0.7);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
        }

        #game-container.menu-mode #ui-overlay,
        #game-container.menu-mode #touch-controls { opacity: 0; pointer-events: none; }
        #ui-overlay, #touch-controls { transition: opacity .18s ease; }
        #game-container { image-rendering: pixelated; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="640" height="360"></canvas>
    <div id="ui-overlay">
        <div id="p1-hud">[P1 LIFE: 3] [CONT: 3] [WPN: N]</div>
        <div id="level-hud">[STAGE 1: JUNGLE]</div>
        <div id="p2-hud">[P2 LIFE: 3] [CONT: 3] [WPN: N]</div>
    </div>
    <div id="touch-controls">
        <div class="touch-group">
            <div id="joystick-base">
                <div id="joystick-labels">
                    <span class="jl-w">w</span>
                    <span class="jl-a">a</span>
                    <span class="jl-s">s</span>
                    <span class="jl-d">d</span>
                </div>
                <div id="joystick-stick"></div>
            </div>
        </div>
        <div class="touch-group" style="align-items: flex-end;">
            <div class="t-btn" id="btn-jump">space</div>
            <div class="t-btn" id="btn-shoot">shift</div>
        </div>
    </div>
</div>

function setupControl(id, code) {
    const el = document.getElementById(id);
    const press = (e) => {
        e.preventDefault();
        if (el.setPointerCapture && e.pointerId !== undefined) el.setPointerCapture(e.pointerId);
        keys[code] = true;
        el.classList.add('active-press');
    };
    const release = (e) => {
        e.preventDefault();
        keys[code] = false;
        el.classList.remove('active-press');
    };
    el.addEventListener('pointerdown', press, { passive: false });
    el.addEventListener('pointerup', release, { passive: false });
    el.addEventListener('pointercancel', release, { passive: false });
    el.addEventListener('lostpointercapture', release, { passive: false });
}

const joyBase = document.getElementById('joystick-base');
const joyStick = document.getElementById('joystick-stick');

joyBase.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    joystick.active = true;
    joystick.identifier = e.pointerId;
    if (joyBase.setPointerCapture) joyBase.setPointerCapture(e.pointerId);
    const rect = joyBase.getBoundingClientRect();
    joystick.baseX = rect.left + rect.width / 2;
    joystick.baseY = rect.top + rect.height / 2;
    updateJoystick(e.clientX, e.clientY);
}, { passive: false });

joyBase.addEventListener('pointermove', (e) => {
    if (!joystick.active || e.pointerId !== joystick.identifier) return;
    e.preventDefault();
    updateJoystick(e.clientX, e.clientY);
}, { passive: false });

const endJoystickPointer = (e) => {
    if (!joystick.active || e.pointerId !== joystick.identifier) return;
    e.preventDefault();
    resetJoystick();
};
joyBase.addEventListener('pointerup', endJoystickPointer, { passive: false });
joyBase.addEventListener('pointercancel', endJoystickPointer, { passive: false });
joyBase.addEventListener('lostpointercapture', endJoystickPointer, { passive: false });

function updateJoystick(clientX, clientY) {
    const maxDist = 35;
    let dx = clientX - joystick.baseX;
    let dy = clientY - joystick.baseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
    }
    
    joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
    
    joystick.angle = Math.atan2(dy, dx);
    joystick.force = Math.min(dist / maxDist, 1.0);

    keys['KeyA'] = dx < -12;
    keys['KeyD'] = dx > 12;
    keys['KeyW'] = dy < -15;
    keys['KeyS'] = dy > 18;
}

function resetJoystick() {
    joystick.active = false;
    joystick.identifier = null;
    joyStick.style.transform = `translate(0px, 0px)`;
    keys['KeyA'] = false;
    keys['KeyD'] = false;
    keys['KeyW'] = false;
    keys['KeyS'] = false;
}

function makePickup(x, y, forceOneUp = false) {
    let kind = 'weapon';
    const r = Math.random();
    if (forceOneUp) kind = 'oneup';
    else if (r < 0.16) kind = 'health';
    else if (r < 0.20) kind = 'oneup';
    return {
        x, baseY: y, y, w: 28, h: 24,
        kind,
        weaponType: kind === 'weapon' ? Math.floor(Math.random() * WEAPON_NAMES.length) : 0,
        floatTimer: Math.random() * Math.PI * 2
    };
}

function getGamepadInput(index) {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = gps[index];
    if (!gp) return {left:false,right:false,up:false,down:false,jump:false,shoot:false};
    const b = gp.buttons || [];
    const pressed = n => !!(b[n] && b[n].pressed);
    const ax0 = gp.axes && Number.isFinite(gp.axes[0]) ? gp.axes[0] : 0;
    const ax1 = gp.axes && Number.isFinite(gp.axes[1]) ? gp.axes[1] : 0;
    return {
        left: ax0 < -0.28 || pressed(14),
        right: ax0 > 0.28 || pressed(15),
        up: ax1 < -0.36 || pressed(12),
        down: ax1 > 0.36 || pressed(13),
        jump: pressed(0) || pressed(1),
        shoot: pressed(2) || pressed(5) || pressed(7)
    };
}

function mergeInput(a, b) {
    return {
        left: !!(a.left || b.left), right: !!(a.right || b.right),
        up: !!(a.up || b.up), down: !!(a.down || b.down),
        jump: !!(a.jump || b.jump), shoot: !!(a.shoot || b.shoot)
    };
}

function updateLevelClearSequence(){
    if(levelClearTimer<=0) return false;
    levelClearTimer--;

        if(pendingNextLevel){ startLevel(pendingNextLevel); levelIntroTimer=95; for(const p of runners){p.x=cameraX-55; p.y=220; p.vx=0;} }
        else gameState='VICTORY';
    }
    return true;
}
function updateLevelIntro(){

    return true;
}

    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < gamepads.length; i++) {
        let gp = gamepads[i];
        if (gp && gp.buttons.some(b => b.pressed)) return true;
    }
    return false;

function updateGame() {
    if (gameState === 'MENU') {
        if (startRequested || checkGamepads()) {
            startRequested = false;
            gameState = 'PLAYING';
            p1.life = 3; p1.hp = 3; p1.continues = 3; p1.weapon = 0; p1.active = true;
            p2.life = 3; p2.hp = 3; p2.continues = 3; p2.weapon = 0; p2.active = false;
            startLevel(1);
            gameContainer.classList.remove('menu-mode');
        } else {
            return;
        }
    }
    gameContainer.classList.remove('menu-mode');
    if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
        if (keys['Space'] || keys['ShiftLeft']) gameState = 'MENU';
        return;
    }

    const p1Keyboard = {
        left: keys['KeyA'] || keys['ArrowLeft'], right: keys['KeyD'] || keys['ArrowRight'], up: keys['KeyW'] || keys['ArrowUp'], down: keys['KeyS'] || keys['ArrowDown'],
        jump: keys['Space'], shoot: keys['ShiftLeft'] || keys['ShiftRight']
    };
    const p2Keyboard = {
        left: keys['KeyJ'], right: keys['KeyL'], up: keys['KeyI'], down: keys['KeyK'],
        jump: keys['KeyN'], shoot: keys['KeyM']
    };
    const p1Input = mergeInput(p1Keyboard, getGamepadInput(0));
    const p2Pad = getGamepadInput(1);
    if (!p2.active && (keys['KeyC'] || Object.values(p2Pad).some(Boolean))) p2.active = true;
    const p2Input = mergeInput(p2Keyboard, p2Pad);

    const cinematic = updateLevelClearSequence() || updateLevelIntro();
    if (!cinematic) {
    handlePlayerInput(p1, p1Input);
    if (p2.active) handlePlayerInput(p2, p2Input);
    updatePlayerPhysics(p1, p1Input);
    if (p2.active) updatePlayerPhysics(p2, p2Input);
    }

    let leadX = p1.x;
    if (p2.active && p2.x > p1.x) leadX = p2.x;
    if (leadX >= STAGE_LENGTH - 350 && !boss) {
        spawnBoss();
    }

    for (let i = bloodParticles.length - 1; i >= 0; i--) {
        let bp = bloodParticles[i];
        bp.x += bp.vx;
        bp.y += bp.vy;
        bp.vy += 0.20;
        bp.life--;
        if (bp.y >= 273 && bp.vy > 0) {
            if (Math.random() < 0.42 && bloodStains.length < 80) {
                bloodStains.push({x: bp.x, y: 274, w: 3 + Math.random()*9, h: 1 + Math.random()*3, life: 1000});
            }
            bloodParticles.splice(i, 1);
        } else if (bp.life <= 0) {
            bloodParticles.splice(i, 1);
        }
    }

    for (let i = oilParticles.length - 1; i >= 0; i--) {
        const op = oilParticles[i];
        op.x += op.vx; op.y += op.vy; op.vy += 0.18; op.life--;
        if (op.y >= 273 && op.vy > 0) {
            if (Math.random() < 0.48 && oilStains.length < 75) oilStains.push({x: op.x, y: 274, w: 4 + Math.random()*10, h: 1 + Math.random()*3});
            oilParticles.splice(i, 1);
        } else if (op.life <= 0) oilParticles.splice(i, 1);
    }

    for (let i = fxParticles.length-1; i >= 0; i--) {
        const f=fxParticles[i]; f.age=(f.age||0)+1; f.x+=f.vx; f.y+=f.vy; f.life--;
        if (f.kind==='smoke') { f.vx*=.97; f.vy-=.025; f.size*=1.018; }
        else if(f.kind==='ember'){ f.vy+=.035; f.vx*=.99; }
        else { f.vy+=.065; f.vx*=.985; }
        if (f.life<=0) fxParticles.splice(i,1);
    }
    for (let i=muzzleFlashes.length-1;i>=0;i--) { muzzleFlashes[i].life--; if(muzzleFlashes[i].life<=0) muzzleFlashes.splice(i,1); }
    for(let i=fireworks.length-1;i>=0;i--){ const f=fireworks[i]; f.x+=f.vx; f.y+=f.vy; f.vy+=.035; f.vx*=.992; f.life--; if(f.trail&&f.life%3===0) fxParticles.push({x:f.x,y:f.y,vx:-f.vx*.12,vy:-f.vy*.12,life:9,size:1.2,kind:'ember'}); if(f.life<=0) fireworks.splice(i,1); }
    for (let i=wrecks.length-1;i>=0;i--) {
        const w=wrecks[i]; w.life--; w.smokeTimer=(w.smokeTimer||0)+1;
        if (w.smokeTimer%12===0 && w.life>80) fxParticles.push({x:w.x+w.w*.5+(Math.random()-.5)*10,y:w.y+8,vx:(Math.random()-.5)*.25,vy:-.65-Math.random()*.4,life:42+Math.random()*22,size:3+Math.random()*4,kind:'smoke',age:0});
        if (w.life<=0) wrecks.splice(i,1);
    }

    for (let pk of pickups) {
        pk.floatTimer += 0.05;
        pk.y = pk.baseY + Math.sin(pk.floatTimer) * 20;
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.x < cameraX || b.x > cameraX + canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
            continue;
        }

        if (boss && boss.active && b.fromPlayer) {
            if (b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
                boss.hp -= (b.damage || 1);
                spawnOil(b.x, b.y, 4);
                spawnHitSpark(b.x,b.y,true,1.25);
                bullets.splice(i, 1);
                if (boss.hp <= 0) {
                    boss.active = false;
                    spawnOil(boss.x + boss.w/2, boss.y + boss.h/2, 25);
                    spawnExplosion(boss.x + boss.w/2, boss.y + boss.h/2, 2.4);
                    pickups.push(makePickup(boss.x + boss.w/2, 190, true));
                }
                continue;
            }
        }

        let hitEnemy = false;
        if (b.fromPlayer) {
            for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                    e.hp -= (b.damage || 1);
                    hitEnemy = true;
                    if (isMetalEnemy(e.type) && e.hp <= Math.ceil(e.maxHp * 0.55)) {
                        e.damaged = true;
                        if (!e.damageBurst) {
                            e.damageBurst = true;
                            for (let s=0;s<8;s++) fxParticles.push({x:e.x+e.w/2,y:e.y+e.h*.45,vx:(Math.random()-.5)*2.6,vy:-1-Math.random()*2.4,life:18+Math.random()*14,size:1+Math.random()*2,kind:'spark',age:0});
                        }
                    }
                    (isMetalEnemy(e.type) ? spawnOil : spawnBlood)(e.x + e.w/2, e.y + e.h/2, 5);
                    spawnHitSpark(b.x,b.y,isMetalEnemy(e.type),1);
                    if (e.hp <= 0) {
                        (isMetalEnemy(e.type) ? spawnOil : spawnBlood)(e.x + e.w/2, e.y + e.h/2, 15);
                        spawnExplosion(e.x+e.w/2,e.y+e.h/2,isMetalEnemy(e.type)?1.15:.85);
                        if (e.type === 'turret') wrecks.push({type:'turret',x:e.x,y:e.y,w:e.w,h:e.h,life:900,smokeTimer:0});
                        if (e.type === 'robot' || e.type === 'terminator') wrecks.push({type:'robot',x:e.x,y:e.y+18,w:e.w,h:e.h-18,life:520,smokeTimer:0});
                        if (Math.random() < 0.12) {
                            pickups.push(makePickup(e.x, Math.max(140, e.y)));
                        }
                        enemies.splice(j, 1);
                    }
                    break;
                }
            }
        }
        if (hitEnemy) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        let distToPlayer = Math.abs(e.x - leadX);
        e.animTimer = (e.animTimer || 0) + 0.12;
        
        if (distToPlayer < 580) {
            e.actionTimer=(e.actionTimer||0)+1;
            if (e.recoilTimer > 0) e.recoilTimer--;
            if (e.stanceTimer > 0) { e.stanceTimer--; if (e.stanceTimer===0) e.stance='run'; }
            if (e.specialTimer > 0) e.specialTimer--;

            // Distinct enemy actions inspired by the feature showcase:
            // xenomorph ceiling/wall crawls, soldiers kneel/take cover, damaged robots limp/spark.
            if (e.type==='xenomorph' && !e.specialMode && e.actionTimer>205 && distToPlayer<360) {
                e.specialMode = Math.random()<.58 ? 'ceiling' : 'wall';
                e.specialTimer = e.specialMode==='ceiling' ? 105 : 78;
                e.actionTimer = 0;
                e.wallAnchorX = e.x;
            }
            if (e.type==='xenomorph' && e.specialMode==='ceiling') {
                e.y = 54 + Math.sin((e.animTimer||0)*.8)*3;
                e.vy = 0;
                e.vx = (leadX<e.x?-1:1) * 1.05;
                e.x += e.vx;
                e.faceDir = e.vx<0?-1:1;
                if (e.specialTimer<=0 || Math.abs(leadX-e.x)<80) { e.specialMode=null; e.vy=4.4; e.attackTimer=28; }
            } else if (e.type==='xenomorph' && e.specialMode==='wall') {
                e.x = e.wallAnchorX;
                e.vx = 0; e.vy = 0;
                e.y = Math.max(72, e.y - .72);
                e.faceDir = leadX<e.x?-1:1;
                if (e.specialTimer<=0) { e.specialMode=null; e.vx=(leadX<e.x?-1:1)*2.8; e.vy=-3.8; e.attackTimer=34; }
            }

            if (e.type==='army_soldier' && e.grounded && e.actionTimer>130 && distToPlayer<300 && !e.stanceTimer) {
                const r=Math.random();
                if(r<.42){ e.stance='kneel'; e.stanceTimer=85; e.vx=0; e.actionTimer=0; }
                else if(r<.72){ e.stance='cover'; e.stanceTimer=105; e.vx=0; e.actionTimer=0; }
            }
            if ((e.type==='robot'||e.type==='terminator') && e.damaged) {
                e.vx *= .91;
                if (Math.random()<.025) fxParticles.push({x:e.x+e.w*.5,y:e.y+e.h*.45,vx:(Math.random()-.5)*1.8,vy:-.7-Math.random()*1.5,life:12+Math.random()*10,size:1.2,kind:'spark',age:0});
            }

            if(e.type==='xenomorph' && !e.specialMode && e.grounded && e.actionTimer>110 && distToPlayer<210){ e.vy=-5.8; e.vx=(leadX<e.x?-1:1)*2.2; e.moveDir=e.vx<0?-1:1; e.actionTimer=0; e.attackTimer=32; }
            else if(e.type==='alien' && e.grounded && e.actionTimer>150){ e.vy=-4.8; e.moveDir*=-1; e.actionTimer=0; }
            else if(e.type==='robot' && e.grounded && e.actionTimer>125){ e.vx=(leadX<e.x?-1:1)*1.9; e.actionTimer=0; e.dashTimer=34; }
            else if(e.type==='terminator' && e.actionTimer>190){ e.moveDir=leadX<e.x?-1:1; e.actionTimer=0; e.guardTimer=45; }
            else if(e.type==='army_soldier' && e.grounded && e.actionTimer>260 && Math.random()<.10){ e.vy=-3.8; e.actionTimer=0; }
            if(e.dashTimer>0){e.dashTimer--; e.vx*=.995;} if(e.guardTimer>0)e.guardTimer--;
            if (e.type !== 'turret') {
                const stats = ENEMY_STATS[e.type];
                let moveIntent = e.moveDir || -1;
                if (e.type==='army_soldier' && (e.stance==='kneel'||e.stance==='cover')) moveIntent = 0;
                const moveSpeed = stats.speed;
                const targetVx = moveIntent * moveSpeed;
                e.vx += (targetVx - e.vx) * 0.085;
                if (Math.abs(e.vx) < 0.01) e.vx = 0;
                e.x += e.vx;
                if (!stats.shoot) e.faceDir = e.moveDir;

                e.vy += 0.3;
                e.y += e.vy;
                
                let floorY = groundYAt(e.x + e.w * 0.5);
                e.grounded = false;
                for (const l of platforms) {
                    if (l.type !== 'ledge') continue;
                    let horizontal = e.x + e.w > l.x && e.x < l.x + l.w;
                    let crossedTop = (e.y + e.h - e.vy) <= l.y + 4 && e.y + e.h >= l.y;
                    if (horizontal && crossedTop && e.vy >= 0) {
                        e.y = l.y - e.h;
                        e.vy = 0;
                        e.grounded = true;
                        break;
                    }
                }
                if (e.y + e.h >= floorY) {
                    e.y = floorY - e.h;
                    e.vy = 0;
                    e.grounded = true;
                }

                if (e.grounded) {
                    const lookX = e.moveDir > 0 ? e.x + e.w + 14 : e.x - 14;
                    const pitAhead = platforms.some(pit => pit.type === 'pit' && lookX > pit.x - 8 && lookX < pit.x + pit.w + 8);
                    const ledgeAhead = platforms.some(l => l.type === 'ledge' &&
                        (e.moveDir > 0 ? (l.x > e.x && l.x - (e.x + e.w) < 38) : (e.x > l.x + l.w && e.x - (l.x + l.w) < 38)) &&
                        l.y < e.y + e.h - 8 && l.y > e.y - 90);
                    if (e.canJump && (pitAhead || ledgeAhead)) {
                        e.vy = e.type === 'combat_dog' ? -4.15 : (e.type === 'xenomorph' ? -5.4 : -4.65);
                        e.grounded = false;
                    } else if (!e.canJump && pitAhead) {
                        e.moveDir *= -1;
                        e.faceDir = e.moveDir;
                        e.vx *= 0.4;
                    }
                }
            }

            e.attackTimer = Math.max(0, (e.attackTimer || 0) - 1);

            const estats = ENEMY_STATS[e.type];
            if (e.type === 'turret') {
                e.retractPhase = (e.retractPhase || 0) + 0.018;
                e.deployed = Math.sin(e.retractPhase + e.x * 0.01) > -0.20;
            }
            if (estats.shoot && distToPlayer < estats.range && (e.type !== 'turret' || e.deployed)) {
                e.shootTimer++;
                let fireInterval = e.type === 'terminator' ? 180 : e.type === 'robot' ? 210 : e.type === 'enemy_vehicle' ? 205 : e.type === 'turret' ? 235 : 245;
                if (e.type==='army_soldier' && e.stance==='kneel') fireInterval = 125;
                if (e.type==='army_soldier' && e.stance==='cover') fireInterval = 155;
                if ((e.type==='robot'||e.type==='terminator') && e.damaged) fireInterval = Math.max(105, fireInterval-55);
                if (e.shootTimer > fireInterval) {
                    e.shootTimer = 0;
                    e.recoilTimer = 8;
                    const shootDir = leadX < e.x ? -1 : 1;
                    e.faceDir = shootDir;
                    let exactHeadLevelY = e.y + (e.h / 2) - 8;
                    const shotSpeed = e.type === 'terminator' ? 2.05 : 1.82;
                    spawnMuzzleFlash(e.x + (shootDir > 0 ? e.w+4 : -7), exactHeadLevelY, shootDir, true);
                    bullets.push({
                        x: e.x + (shootDir > 0 ? e.w : -5), y: exactHeadLevelY,
                        vx: shootDir * shotSpeed, vy: e.type === 'alien' ? (Math.random() - 0.5) * 0.45 : 0,
                        fromPlayer: false, type: e.type === 'robot' ? 'plasma_enemy' : 'enemy'
                    });
                }
            }
        }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.type === 'combat_dog' && e.x + e.w < cameraX - 120) {
            enemies.splice(i, 1);
        }
    }

    if (boss && boss.active) {
        const bossIntro = (boss.introTimer||0) > 0;
        if (bossIntro) {
            boss.introTimer--;
            if (boss.introTimer % 16 === 0) spawnExplosion(boss.x + 25 + Math.random()*(boss.w-50), boss.y + 20 + Math.random()*(boss.h-30), .38);
        }
        const newPhase = boss.hp < boss.maxHp*.34 ? 3 : boss.hp < boss.maxHp*.68 ? 2 : 1;
        if (newPhase !== boss.combatPhase) {
            boss.combatPhase = newPhase; boss.phaseFlash = 34;
            spawnExplosion(boss.x+boss.w*.5,boss.y+boss.h*.45,1.4);
            spawnFireworkBurst(boss.x+boss.w*.5,boss.y+25,1.4);
        }
        if (boss.phaseFlash>0) boss.phaseFlash--;
        boss.phase += 0.025 + (boss.combatPhase-1)*.008;
        boss.moveTimer++;
        const arenaLeft = STAGE_LENGTH - 590;
        const arenaRight = STAGE_LENGTH - boss.w - 18;

        if (bossIntro) {
            boss.y += Math.sin(boss.phase*2.2)*.12;
        } else if (boss.kind === 'GUNSHIP') {
            boss.x += boss.vx;
            boss.y += boss.vy;
            if (boss.x < arenaLeft || boss.x > arenaRight) boss.vx *= -1;
            if (boss.y < 42 || boss.y > 138) boss.vy *= -1;
        } else {
            const speedBoost = ['DRILL_WALKER','PLASMA_SPIDER','WAR_MECH'].includes(boss.kind) ? 1.12 : 0.88;
            boss.x += boss.vx * speedBoost;
            if (boss.x < arenaLeft || boss.x > arenaRight) {
                boss.x = Math.max(arenaLeft, Math.min(arenaRight, boss.x));
                boss.vx *= -1;
            }
            const ground = groundYAt(boss.x + boss.w * .5);
            boss.y = ground - boss.h;
            if (boss.kind === 'PLASMA_SPIDER') boss.y += Math.sin(boss.phase * 2.8) * 5;
            if (boss.kind === 'DRILL_WALKER' && boss.moveTimer % 240 === 0) boss.vx *= -1;
        }

        if (!bossIntro) boss.timer++;
        let fireDelay = boss.kind === 'NEXUS_CORE' ? 150 : boss.kind === 'GUNSHIP' ? 165 : 180;
        fireDelay = Math.max(72, fireDelay - (boss.combatPhase-1)*38);
        if (!bossIntro && boss.timer > fireDelay) {
            boss.timer = 0;
            const target = p2.active && Math.abs(p2.x-boss.x) < Math.abs(p1.x-boss.x) ? p2 : p1;
            const muzzleY = boss.kind === 'GUNSHIP' ? boss.y + 48 : boss.y + Math.min(45, boss.h*.42);
            const aimErrorX = (Math.random() - 0.5) * 150;
            const aimErrorY = (Math.random() - 0.5) * 95;
            const dx = (target.x + aimErrorX) - boss.x;
            const dy = (target.y + 22 + aimErrorY) - muzzleY;
            const len = Math.max(1, Math.hypot(dx,dy));
            const spd = 1.35 + (boss.combatPhase-1)*.32;
            spawnMuzzleFlash(boss.x + (dx < 0 ? 4 : boss.w-4), muzzleY, dx < 0 ? -1 : 1, true);
            bullets.push({
                x: boss.x + (dx < 0 ? 6 : boss.w-6), y: muzzleY,
                vx: dx/len*spd, vy: dy/len*spd,
                fromPlayer: false,
                type: boss.kind === 'NEXUS_CORE' ? 'plasma_enemy' : 'enemy'
            });
        }
    }

    if (boss && !boss.active && !bossClearStarted) beginBossClearSequence();

    for (let i = pickups.length - 1; i >= 0; i--) {
        let pk = pickups[i];
        let target = null;
        if (p1.active && Math.abs(p1.x - pk.x) < 32 && Math.abs(p1.y - pk.y) < 32) target = p1;
        if (p2.active && Math.abs(p2.x - pk.x) < 32 && Math.abs(p2.y - pk.y) < 32) target = p2;

        if (target) {
            if (pk.kind === 'oneup') target.life = Math.min(9, target.life + 1);
            else if (pk.kind === 'health') { target.hp = Math.min(target.maxHp, target.hp + 1); spawnRespawnFireworks(target.x + target.w/2, target.y + 10, 7); }
            else target.weapon = pk.weaponType;
            pickups.splice(i, 1);
        }
    }

    cameraX = leadX - 220;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > STAGE_LENGTH - canvas.width) cameraX = STAGE_LENGTH - canvas.width;
}

function handlePlayerInput(p, input) {
    if (!p.active) return;

    if (p.hanging) {
        p.vx = 0;
        p.vy = 0;
        if (input.jump || input.up) {
            const l = p.ledgeObj;
            p.h = 56;
            p.ducking = false;
            p.climbTimer = 18;
            p.flipAngle = 0;
            p.x = p.dir > 0 ? l.x + 6 : l.x + l.w - p.w - 6;
            p.y = l.y - p.h - 4;
            p.vy = -2.4;
            p.hanging = false;
            p.grounded = false;
            p.canDoubleJump = true;
            p.ledgeObj = null;
        } else if (input.down) {
            p.hanging = false;
            p.vy = 3.0;
            p.y += 4;
            p.ledgeObj = null;
        }
        return;
    }

    if (p.deathTimer > 0) return;
    if (p.rollTimer > 0) p.rollTimer--;
    if (p.climbTimer > 0) p.climbTimer--;

    if (p.grounded && input.down && (input.left || input.right) && p.rollTimer <= 0) {
        p.rollTimer = 38;
        p.dir = input.left ? -1 : 1;
    }

    let targetVx = 0;
    if (p.rollTimer > 0) {
        targetVx = p.dir * p.speed * 1.28;
        p.animTimer += 0.17;
    } else if (input.left && !input.right) { targetVx = -p.speed; p.dir = -1; p.animTimer += 0.15; }
    if (p.rollTimer <= 0 && input.right && !input.left) { targetVx = p.speed; p.dir = 1; p.animTimer += 0.15; }
    const moveEase = targetVx === 0 ? (p.grounded ? 0.16 : 0.08) : (p.grounded ? 0.20 : 0.12);
    p.vx += (targetVx - p.vx) * moveEase;
    if (Math.abs(p.vx) < 0.025 && targetVx === 0) p.vx = 0;

    const wantsDuck = !!input.down && p.grounded && p.rollTimer <= 0;
    const targetH = wantsDuck ? 24 : 56;
    if (p.h !== targetH) {
        const feet = p.y + p.h;
        p.h = targetH;
        p.y = feet - p.h;
    }
    p.ducking = wantsDuck;

    p.up = !!input.up;
    p.down = !!input.down;

    if (input.shoot && (!p.lastShoot || performance.now() - p.lastShoot > 250)) {
        p.lastShoot = performance.now();
        fireOmniDirectionalWeapon(p, input);
    }
}

function fireOmniDirectionalWeapon(p, input) {
    let dx = 0;
    let dy = 0;

    if (input.left) dx = -1;
    if (input.right) dx = 1;
    if (input.up) dy = -1;
    if (input.down && !p.ducking) dy = 1;

    if (dx === 0 && dy === 0) {
        dx = p.dir;
    } else if (dx !== 0) {
        p.dir = dx;
    }

    const speed = 7.5;
    let vx = 0, vy = 0;

    if (dx !== 0 && dy !== 0) {
        const diag = speed * 0.7071;
        vx = dx * diag; 
        vy = dy * diag;
    } else if (dx !== 0) {
        vx = dx * speed;
        vy = 0;
    } else if (dy !== 0) {
        vx = 0;
        vy = dy * speed;
    }

    const gunYOffset = p.ducking ? 11 : 22;
    const gunX = p.dir > 0 ? p.x + p.w + 19 : p.x - 25;

    const addBullet = (vx2, vy2, damage=1, type='normal') => {
        bullets.push({
            x: gunX, y: p.y + gunYOffset,
            vx: vx2, vy: vy2, fromPlayer: true, damage, type
        });
    };

    spawnMuzzleFlash(gunX + (p.dir > 0 ? 7 : -2), p.y + gunYOffset, p.dir, false);

    if (p.weapon === 0) {
        addBullet(vx, vy, 1, 'normal');
    } else if (p.weapon === 1) {
        addBullet(vx, vy, 1, 'spread');
        addBullet(vx * 0.95, vy - 2.0, 1, 'spread');
        addBullet(vx * 0.95, vy + 2.0, 1, 'spread');
    } else if (p.weapon === 2) {
        addBullet(vx * 1.5, vy * 1.5, 3, 'laser');
    } else if (p.weapon === 3) {
        addBullet(vx * 0.8, vy * 0.8, 4, 'missile');
    } else {
        addBullet(vx * 0.7, vy + (Math.random() - 0.5) * 2.5, 2, 'flame');
    }
}

function rectsOverlap(a, b, pad=0) {
    return a.x < b.x + b.w + pad &&
           a.x + a.w > b.x - pad &&
           a.y < b.y + b.h + pad &&
           a.y + a.h > b.y - pad;
}

function groundYAt(worldX) {
    let y = 276;
    for (const tf of terrainFeatures) {
        if (tf.type !== 'mound' || worldX < tf.x || worldX > tf.x + tf.w) continue;
        const t = (worldX - tf.x) / tf.w;
        const rise = Math.sin(Math.PI * t) * tf.h;
        y = Math.min(y, 276 - rise);
    }
    return y;
}

function updatePlayerPhysics(p, inputState) {
    if (p.deathTimer > 0) {
        p.deathTimer--;
        p.deathSpin += (0.24 + (64 - p.deathTimer) * 0.0025) * p.dir;
        p.vy += 0.31;
        p.y += p.vy;
        p.x += p.vx;
        p.vx *= 0.985;
        if (p.deathTimer === 0) {
            if (p.life <= 0) handlePlayerLoss(p);
            else beginRespawn(p);
        }
        return;
    }
    if (p.respawnTimer > 0) {
        p.respawnTimer--;
        const t = 1 - p.respawnTimer / 54;
        const ease = 1 - Math.pow(1 - t, 3);
        p.y = p.respawnTargetY - (1 - ease) * 72;
        p.vx = 0; p.vy = 0;
        if (p.invulnerable > 0) p.invulnerable--;
        if (p.respawnTimer === 0) { p.y = p.respawnTargetY; p.grounded = true; p.canDoubleJump = true; }
        return;
    }
    if (p.hanging) return;

    if (inputState.jump && !p.jumpPressedLast) {
        if (p.grounded && !p.ducking) {
            p.vy = p.jumpForce;
            p.grounded = false;
            p.canDoubleJump = true;
        } else if (!p.grounded && p.canDoubleJump) {
            p.vy = p.jumpForce * 0.72;
            p.canDoubleJump = false;
        }
        p.jumpPressedLast = true;
    }
    if (!inputState.jump) {
        if (p.jumpPressedLast && p.vy < -2.2) p.vy *= 0.86;
        p.jumpPressedLast = false;
    }

    const oldBottom = p.y + p.h;
    p.x += p.vx;
    if (inputState.jump && p.vy < 0) p.vy -= 0.035;
    p.vy += 0.245;
    if (p.vy > 6.6) p.vy = 6.6;
    p.y += p.vy;
    if (!p.grounded && Math.abs(p.vx) > 0.55) p.flipAngle += 0.13 * p.dir;
    else if (p.grounded) p.flipAngle *= 0.6;
    if (p.climbTimer > 0) p.flipAngle += 0.24 * p.dir;

    if (p.x < 0) p.x = 0;
    if (p.x > STAGE_LENGTH - p.w) p.x = STAGE_LENGTH - p.w;

    p.grounded = false;
    const floorY = groundYAt(p.x + p.w * 0.5);

    for (const l of platforms) {
        if (l.type !== 'ledge') continue;

        const horizontal = p.x + p.w - 5 > l.x && p.x + 5 < l.x + l.w;
        const crossedTop = oldBottom <= l.y + 4 && p.y + p.h >= l.y;
        
        if (horizontal && crossedTop && p.vy >= 0) {
            if (inputState.down && inputState.jump) {
                p.y += 6;
                p.vy = 2.0;
                continue;
            }
            p.y = l.y - p.h;
            p.vy = 0;
            p.grounded = true;
            p.canDoubleJump = true;
            break;
        }

        const isHighEnough = l.y < p.y + 20; 
        const nearRightLip = p.dir > 0 && Math.abs((p.x + p.w) - l.x) < 12;
        const nearLeftLip = p.dir < 0 && Math.abs(p.x - (l.x + l.w)) < 12;
        const nearLip = (nearRightLip || nearLeftLip) && isHighEnough;
        const verticalWindow = p.y + p.h > l.y + 2 && p.y < l.y + l.h + 24;

        if (!p.grounded && nearLip && verticalWindow && p.vy < 3.0) {
            p.hanging = true;
            p.ledgeObj = l;
            p.x = nearRightLip ? l.x - p.w + 2 : l.x + l.w - 2;
            p.y = l.y + 3;
            p.vx = 0;
            p.vy = 0;
            break;
        }
    }

    if (p.hanging) return;

    if (p.y + p.h >= floorY) {
        let overPit = false;
        for (const pit of platforms) {
            if (pit.type === 'pit' &&
                p.x + p.w * 0.5 > pit.x &&
                p.x + p.w * 0.5 < pit.x + pit.w) {
                overPit = true;
                break;
            }
        }

        if (overPit) {
            if (p.y > canvas.height + 30) triggerPlayerDeath(p);
        } else {
            p.y = floorY - p.h;
            p.vy = 0;
            p.grounded = true;
            p.canDoubleJump = true;
        }
    }

    for (let h of hazards) {
        if (h.type === 'water') continue;

        if (rectsOverlap(p, h)) {
            spawnBlood(p.x + p.w/2, p.y + p.h/2, 6);
            triggerPlayerDamage(p);
        }
    }

    if (p.invulnerable > 0) p.invulnerable--;

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (!b.fromPlayer) {
            const bulletBox = { x: b.x - 2, y: b.y - 2, w: 8, h: 5 };
            if (rectsOverlap(p, bulletBox)) {
                if (p.ducking && b.y > p.y + p.h - 12) {
                    continue;
                }
                bullets.splice(i, 1);
                spawnBlood(p.x + p.w/2, p.y + p.h/2, 5);
                triggerPlayerDamage(p);
            }
        }
    }
}

function isPitAtX(x) {
    return platforms.some(pit => pit.type === 'pit' && x > pit.x + 8 && x < pit.x + pit.w - 8);
}

function findSafeRespawnX() {
    const minX = Math.max(30, cameraX + 55);
    const maxX = Math.min(STAGE_LENGTH - 80, cameraX + 280);
    for (let x = minX; x <= maxX; x += 22) {
        if (!isPitAtX(x) && !hazards.some(h => h.type !== 'water' && x > h.x - 18 && x < h.x + h.w + 18)) return x;
    }
    return minX;
}

function beginRespawn(p) {
    const safeX = findSafeRespawnX();
    p.x = safeX;
    p.h = 56;
    p.ducking = false;
    p.hanging = false;
    p.ledgeObj = null;
    p.vx = 0; p.vy = 0;
    p.respawnTargetY = groundYAt(safeX + p.w * 0.5) - p.h;
    p.y = p.respawnTargetY - 72;
    p.respawnTimer = 54;
    p.invulnerable = 150;
    p.deathSpin = 0;
    spawnRespawnFireworks(p.x+p.w/2,p.respawnTargetY,10);
}


function triggerPlayerDamage(p) {
    if (p.invulnerable === 0 && p.deathTimer <= 0 && p.respawnTimer <= 0) {
        p.hp--; p.invulnerable=55; screenFlash=5; spawnHitSpark(p.x+p.w/2,p.y+p.h/2,false,.8);
        if(p.hp<=0) triggerPlayerDeath(p);
    }
}

function triggerPlayerDeath(p) {
    if (p.deathTimer > 0 || p.respawnTimer > 0) return;
    p.life--;
    p.hp = p.maxHp;
    p.invulnerable = 0;
    p.deathTimer = 64;
    p.deathSpin = 0;
    p.deathSpark = 28;
    p.vy = -7.4;
    p.vx = -p.dir * 2.35;
    p.hanging = false;
    p.ledgeObj = null;
    screenFlash = 10;
    spawnBlood(p.x + p.w/2, p.y + p.h/2, 24);
}

function handlePlayerLoss(p) {
    if (p.continues > 0) {
        p.continues--;
        p.life = 3; p.hp = p.maxHp;
        beginRespawn(p);
    } else {
        if ((p === p1 && !p2.active) || (!p1.active && p === p2) || (!p1.active && !p2.active)) gameState = 'GAMEOVER';
        else p.active = false;
    }
}

function sceneSeed(x, salt = 0) {
    const n = Math.sin((x + currentLevel * 131 + salt * 977) * 0.0174533) * 43758.5453;
    return n - Math.floor(n);
}

function drawCloudsAndSmoke() {
    const now = performance.now();
    const t = now * 0.00004;

    ctx.save();
    const cloudPar = 0.05;
    ctx.translate(-cameraX * cloudPar, 0);
    const cloudWorldStart = cameraX * cloudPar - 520;
    const cloudWorldEnd = cameraX * cloudPar + canvas.width + 520;
    const firstCloud = Math.floor(cloudWorldStart / 430) * 430;
    for (let x = firstCloud; x < cloudWorldEnd; x += 430) {
        const drift = (t * 500 + x * 0.07) % 120;
        const cx = x + drift;
        const cy = 38 + sceneSeed(x, 1) * 65;
        ctx.fillStyle = currentLevel === 2 || currentLevel === 8 ? 'rgba(120,126,140,.22)' : 'rgba(235,226,207,.42)';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 34, 10, 0, 0, Math.PI*2);
        ctx.ellipse(cx + 24, cy - 7, 27, 13, 0, 0, Math.PI*2);
        ctx.ellipse(cx + 52, cy + 1, 33, 10, 0, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    const smokePar = 0.18;
    ctx.translate(-cameraX * smokePar, 0);
    const smokeStart = Math.floor((cameraX * smokePar - 850) / 760) * 760;
    const smokeEnd = cameraX * smokePar + canvas.width + 850;
    for (let x = smokeStart; x < smokeEnd; x += 760) {
        const baseY = 215;
        for (let k = 0; k < 4; k++) {
            const wobble = Math.sin(now*0.001 + k + x) * 5;
            ctx.fillStyle = `rgba(38,42,40,${0.14 + k*0.025})`;
            ctx.beginPath();
            ctx.arc(x + wobble + k*3, baseY - 25 - k*18, 11 + k*3, 0, Math.PI*2);
            ctx.fill();
        }
    }
    ctx.restore();
}

function drawBirds() {
    if ([2,3,5,6,8,10].includes(currentLevel)) return;
    const now = performance.now() * 0.001;
    ctx.save();
    const par = 0.10;
    ctx.translate(-cameraX * par, 0);
    const start = Math.floor((cameraX * par - 300) / 260) * 260;
    const end = cameraX * par + canvas.width + 320;
    ctx.strokeStyle = 'rgba(24,24,22,.65)';
    ctx.lineWidth = 2;
    for (let x = start; x < end; x += 260) {
        const y = 52 + sceneSeed(x, 72) * 80 + Math.sin(now + x) * 5;
        const wing = Math.sin(now * 5 + x) * 3;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + 7, y - 5 - wing, x + 14, y);
        ctx.quadraticCurveTo(x + 21, y - 5 + wing, x + 28, y);
        ctx.stroke();
    }
    ctx.restore();
}

function drawForegroundScenery() {
    // Keep the play path readable: only substantial, believable ground props.
    const start = Math.floor((cameraX - 160) / 150) * 150;
    const end = cameraX + canvas.width + 180;

    function drawTrashCan(x, gy, seed) {
        const w = 18, h = 25;
        const lean = seed > 0.66 ? 2 : 0;
        ctx.save();
        ctx.translate(x, gy);
        ctx.rotate(lean ? 0.08 : 0);
        pxRect(-1, -h-2, w+2, 4, '#697075');
        pxRect(1, -h, w-2, h, '#41484b');
        pxRect(4, -h+4, 2, h-7, '#5f686b');
        pxRect(w-6, -h+4, 2, h-7, '#2b3032');
        pxRect(3, 0, 4, 2, '#202527');
        pxRect(w-7, 0, 4, 2, '#202527');
        ctx.restore();
    }

    function drawFallenBody(x, gy, seed) {
        // Non-graphic fallen soldier silhouette with helmet and gear.
        const dir = seed > 0.5 ? 1 : -1;
        ctx.save();
        ctx.translate(x, gy);
        ctx.scale(dir, 1);
        pxRect(-2, -8, 28, 8, '#313b2b');
        pxRect(10, -13, 18, 7, '#3f4935');
        pxRect(26, -14, 8, 7, '#a98263');
        ctx.fillStyle = '#3a4033';
        ctx.beginPath(); ctx.arc(30, -15, 5, Math.PI, 0); ctx.fill();
        pxRect(-14, -6, 15, 5, '#222821');
        pxRect(2, -4, 7, 3, '#61674b');
        pxRect(8, -16, 7, 5, '#4e5b40');
        ctx.restore();
    }

    function drawLooseTrash(x, gy, seed) {
        if (seed < 0.5) {
            pxRect(x, gy-4, 11, 4, '#77736b');
            pxRect(x+12, gy-5, 5, 5, '#4c5553');
            pxRect(x+21, gy-3, 8, 3, '#9a8b67');
        } else {
            pxRect(x, gy-6, 17, 6, '#252a27');
            pxRect(x+3, gy-9, 8, 4, '#393d38');
            pxRect(x+18, gy-4, 8, 4, '#1d211f');
        }
    }

    for (let x = start; x < end; x += 150) {
        const r = sceneSeed(x, 3);
        const gy = groundYAt(x + 28);

        // Deliberately sparse: no tiny bushes or decorative grass clumps.
        if (r < 0.13) drawLooseTrash(x + 8, gy, sceneSeed(x, 91));
        else if (r < 0.23) drawTrashCan(x + 14, gy, sceneSeed(x, 92));
        else if (r < 0.31) drawFallenBody(x + 18, gy, sceneSeed(x, 93));
        else if (r > 0.78) {
            // Larger tree with brown trunk/branches and a soft, wavy canopy.
            const trunkX = x + 22;
            pxRect(trunkX, gy-72, 14, 72, '#4b3424');
            pxRect(trunkX+4, gy-72, 5, 72, '#72503a');
            pxRect(trunkX-5, gy-56, 9, 34, '#5b3b28');
            pxRect(trunkX-14, gy-68, 20, 6, '#5b3b28');
            pxRect(trunkX+10, gy-61, 25, 6, '#66442d');

            ctx.fillStyle = '#24512d';
            ctx.beginPath();
            ctx.moveTo(trunkX-30, gy-73);
            ctx.quadraticCurveTo(trunkX-38, gy-91, trunkX-18, gy-96);
            ctx.quadraticCurveTo(trunkX-12, gy-114, trunkX+7, gy-106);
            ctx.quadraticCurveTo(trunkX+24, gy-121, trunkX+36, gy-103);
            ctx.quadraticCurveTo(trunkX+55, gy-103, trunkX+53, gy-84);
            ctx.quadraticCurveTo(trunkX+45, gy-69, trunkX+27, gy-74);
            ctx.quadraticCurveTo(trunkX+8, gy-63, trunkX-8, gy-74);
            ctx.quadraticCurveTo(trunkX-22, gy-64, trunkX-30, gy-73);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#35653a';
            ctx.beginPath();
            ctx.moveTo(trunkX-17, gy-88);
            ctx.quadraticCurveTo(trunkX-10, gy-103, trunkX+4, gy-99);
            ctx.quadraticCurveTo(trunkX+17, gy-110, trunkX+28, gy-97);
            ctx.quadraticCurveTo(trunkX+39, gy-88, trunkX+27, gy-80);
            ctx.quadraticCurveTo(trunkX+8, gy-73, trunkX-8, gy-82);
            ctx.closePath();
            ctx.fill();
        }
    }
}

function drawRespawnBanner(p, label) {
    if (p.respawnTimer <= 0) return;
    const x = p.x - cameraX + p.w/2;
    const a = Math.min(1, (54-p.respawnTimer)/12) * Math.min(1, p.respawnTimer/12);
    ctx.save(); ctx.globalAlpha=a; ctx.textAlign='center'; ctx.font='bold 10px Courier New';
    ctx.fillStyle='#fff'; ctx.shadowColor='#000'; ctx.shadowBlur=4; ctx.fillText(label + ' READY', x, Math.max(82,p.y-14));
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'MENU') {
        drawTitleScreen();
        return;
    }

    if (gameState === 'GAMEOVER') {
        ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.save(); ctx.translate(canvas.width/2, canvas.height/2-5); ctx.rotate(-0.035);
        ctx.strokeStyle='#b3362d'; ctx.lineWidth=6; ctx.strokeRect(-126,-44,252,88);
        ctx.fillStyle='#d2473b'; ctx.font='bold 37px Courier New'; ctx.textAlign='center'; ctx.fillText('MISSION FAILED',0,12);
        ctx.restore();
        ctx.fillStyle='#fff'; ctx.font='13px Courier New'; ctx.textAlign='center';
        ctx.fillText('PRESS SPACE OR SHIFT TO RETURN', canvas.width/2, canvas.height/2 + 70);
        return;
    }

    if (gameState === 'VICTORY') {
        ctx.fillStyle = '#2ecc71';
        ctx.font = 'bold 24px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION COMPLETE! EARTH IS SAVED.', canvas.width/2, canvas.height/2);
        ctx.fillStyle = '#fff';
        ctx.font = '13px Courier New';
        ctx.fillText('PRESS SPACE OR SHIFT TO RESTART', canvas.width/2, canvas.height/2 + 40);
        return;
    }

    let theme = LEVEL_THEMES[(currentLevel - 1) % LEVEL_THEMES.length];

    const sky = ctx.createLinearGradient(0, 0, 0, 276);
    sky.addColorStop(0, '#24152d');
    sky.addColorStop(0.38, theme.skyTop);
    sky.addColorStop(0.72, '#d85a27');
    sky.addColorStop(1, '#f4b45f');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawCloudsAndSmoke();
    drawLevelSpecificBackdrop();
    drawBirds();

    ctx.save();
    ctx.translate(-cameraX * 0.035, 0);
    for (let i = Math.floor((cameraX * 0.035 - 360) / 280) * 280; i < cameraX * 0.035 + canvas.width + 420; i += 280) {
        const y = 55 + ((i / 170) % 3) * 18;
        pxRect(i, y, 95, 7, 'rgba(74,29,31,.55)');
        pxRect(i + 18, y - 5, 52, 6, 'rgba(255,176,83,.38)');
        pxRect(i + 65, y + 7, 70, 5, 'rgba(98,35,28,.45)');
    }
    ctx.restore();

    ctx.save();
    ctx.translate(-cameraX * 0.075, 0);
    const bgMode = (currentLevel - 1) % 4;
    if (bgMode === 0) {
        for (let i = -250; i < STAGE_LENGTH + 600; i += 290) {
            const h = 45 + sceneSeed(i, 8) * 55;
            ctx.fillStyle = '#253c2c';
            ctx.beginPath(); ctx.ellipse(i + 90, 245, 125, h, 0, Math.PI, 0, false); ctx.fill();
            pxRect(i + 35, 180 - h*0.15, 10, 70 + h*0.25, '#314332');
            pxRect(i + 10, 172 - h*0.15, 62, 22, '#31573a');
        }
    } else if (bgMode === 1) {
        ctx.fillStyle = '#352d38';
        for (let i = -220; i < STAGE_LENGTH + 700; i += 230) {
            const mh = 65 + sceneSeed(i, 9) * 75;
            ctx.beginPath(); ctx.moveTo(i, 276); ctx.lineTo(i+75, 276-mh); ctx.lineTo(i+135, 220-mh*0.25); ctx.lineTo(i+220,276); ctx.closePath(); ctx.fill();
            pxRect(i+72, 276-mh+15, 38, 5, 'rgba(192,125,83,.25)');
        }
    } else if (bgMode === 2) {
        for (let i = -200; i < STAGE_LENGTH + 500; i += 110) {
            const h = 65 + ((i / 110) % 4) * 13;
            const by = 210 - h;
            pxRect(i, by, 70, h + 66, '#26343a');
            pxRect(i+8, by-15, 11, 16, '#3e474b');
            for (let wx=i+8; wx<i+60; wx+=14) for (let wy=by+12; wy<250; wy+=18) pxRect(wx,wy,8,10,(wx+wy)%3===0?'#d9ad55':'#46555b');
        }
    } else {
        for (let i = -180; i < STAGE_LENGTH + 550; i += 150) {
            const hh = 45 + sceneSeed(i, 10) * 85;
            pxRect(i+45, 255-hh, 28, hh+21, '#3b2944');
            ctx.fillStyle='#53345f'; ctx.beginPath(); ctx.ellipse(i+59,255-hh,28,16,0,0,Math.PI*2); ctx.fill();
            pxRect(i+52, 242-hh, 14, 5, '#8c6ca0');
        }
    }
    ctx.restore();

    ctx.save();
    ctx.translate(-cameraX, 0);

    let drawStart = cameraX - 50;
    let drawEnd = cameraX + canvas.width + 50;
    
    let pMap = platforms.filter(p => p.type === 'pit');
    pMap.sort((a,b) => a.x - b.x);

    for (const pit of pMap) {
        if (pit.x + pit.w < drawStart || pit.x > drawEnd) continue;
        const pg = ctx.createLinearGradient(0, 276, 0, 360);
        pg.addColorStop(0, '#171014');
        pg.addColorStop(0.35, '#08080b');
        pg.addColorStop(1, '#000000');
        ctx.fillStyle = pg;
        ctx.fillRect(pit.x, 276, pit.w, 84);
        pxRect(pit.x, 276, pit.w, 5, '#15191a');
        for (let sx = pit.x + 5; sx < pit.x + pit.w - 4; sx += 13) {
            ctx.fillStyle = '#050607';
            ctx.beginPath(); ctx.moveTo(sx, 281); ctx.lineTo(sx + 5, 296 + ((sx|0)%9)); ctx.lineTo(sx + 10, 281); ctx.fill();
        }
        for (let sy = 310; sy < 352; sy += 14) {
            pxRect(pit.x + 7 + ((sy * 3) % Math.max(10, pit.w - 18)), sy, 5, 2, '#42191a');
        }
    }

    let renderSegments = [];
    let lastEdge = 0;
    for (let pit of pMap) {
        if (pit.x > lastEdge) {
            renderSegments.push({ start: lastEdge, end: pit.x });
        }
        lastEdge = pit.x + pit.w;
    }
    renderSegments.push({ start: lastEdge, end: STAGE_LENGTH + 500 });

    for (let seg of renderSegments) {
        if (seg.end > drawStart && seg.start < drawEnd) {
            ctx.fillStyle = '#29351f';
            ctx.beginPath();
            ctx.moveTo(seg.start, 360);
            ctx.lineTo(seg.start, groundYAt(seg.start));
            for (let gx = seg.start + 8; gx <= seg.end; gx += 8) ctx.lineTo(gx, groundYAt(gx));
            ctx.lineTo(seg.end, 360); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#68854b'; ctx.lineWidth = 5; ctx.beginPath();
            ctx.moveTo(seg.start, groundYAt(seg.start));
            for (let gx = seg.start + 8; gx <= seg.end; gx += 8) ctx.lineTo(gx, groundYAt(gx));
            ctx.stroke();

            for (let gx = Math.floor(seg.start / 24) * 24; gx < seg.end; gx += 24) {
                const gy = groundYAt(gx + 8);
                const seed = Math.abs(Math.floor(gx * 17.31)) % 9;
                pxRect(gx, gy + 11 + (seed%3), 15, 5, '#3b4528');
                pxRect(gx + 8, gy + 28 + (seed % 5), 19, 6, '#1e291b');
                if (seed % 3 === 0) pxRect(gx + 3, gy - 4, 3, 5, '#687647');
            }
        }
    }

    for (let l of platforms) {
        if (l.type === 'ledge') {
            // SNES jungle ruin ledge: carved stone under thick moss.
            pxRect(l.x, l.y, l.w, l.h, '#3b4431');
            pxRect(l.x, l.y, l.w, 4, '#91a65f');
            pxRect(l.x+2,l.y+4,l.w-4,4,'#536641');
            for(let bx=l.x+4; bx<l.x+l.w-5; bx+=16){
                pxRect(bx,l.y+9,14,7,'#4b4b39'); pxRect(bx+1,l.y+10,12,2,'#67644b');
                if(((bx/16)|0)%2===0) pxRect(bx+7,l.y+12,2,4,'#252b21');
            }
            for (let gx = l.x + 3; gx < l.x + l.w - 3; gx += 9) {
                const gh = 2 + ((gx|0) % 6);
                pxRect(gx, l.y-gh, 3, gh+2, '#446f35');
                if (((gx/9)|0)%2===0) pxRect(gx+3,l.y-gh+1,2,gh,'#78a14b');
                if (((gx/9)|0)%3===0) { pxRect(gx+1,l.y+l.h,2,8+(gx%9),'#274128'); pxRect(gx+3,l.y+l.h+5,1,6,'#41613a'); }
            }
            pxRect(l.x+2,l.y,l.w-4,1,'#c0c97a');
        }
    }

    for (let h of hazards) {
        if (h.type === 'water') {
            const wt = performance.now() * 0.004;
            const wg = ctx.createLinearGradient(0, h.y, 0, h.y + h.h);
            wg.addColorStop(0, 'rgba(83,198,232,.92)');
            wg.addColorStop(.35, 'rgba(23,118,164,.93)');
            wg.addColorStop(1, 'rgba(8,53,91,.98)');

            // Rounded water basin instead of a hard rectangular base.
            const radius = Math.min(15, h.w * 0.12, h.h * 0.34);
            ctx.fillStyle = wg;
            ctx.beginPath();
            ctx.moveTo(h.x, h.y + 4);
            ctx.lineTo(h.x + h.w, h.y + 4);
            ctx.lineTo(h.x + h.w, h.y + h.h - radius);
            ctx.quadraticCurveTo(h.x + h.w, h.y + h.h, h.x + h.w - radius, h.y + h.h);
            ctx.lineTo(h.x + radius, h.y + h.h);
            ctx.quadraticCurveTo(h.x, h.y + h.h, h.x, h.y + h.h - radius);
            ctx.closePath();
            ctx.fill();

            // Wavier, rounded surface line.
            ctx.strokeStyle = 'rgba(183,242,255,.9)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            for (let wx = h.x; wx <= h.x + h.w; wx += 5) {
                const wy = h.y + 4 + Math.sin(wt + wx * 0.10) * 2.2;
                if (wx === h.x) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
            }
            ctx.stroke();

            for (let wx = h.x + 8; wx < h.x + h.w - 6; wx += 18) {
                const wy = h.y + 13 + Math.sin(wt * .8 + wx * 0.08) * 2;
                pxRect(wx, wy, 8, 2, 'rgba(15,82,128,.62)');
            }
            ctx.strokeStyle = 'rgba(5,35,63,.9)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(h.x + radius, h.y + h.h - 1);
            ctx.lineTo(h.x + h.w - radius, h.y + h.h - 1);
            ctx.stroke();
        } else {
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(h.x, h.y + h.h);
            ctx.lineTo(h.x + h.w/2, h.y);
            ctx.lineTo(h.x + h.w, h.y + h.h);
            ctx.closePath();
            ctx.fill();
        }
    }

    for (let pk of pickups) drawWingPickup(pk);

    if (boss && boss.active) drawBossVehicle(boss);
    drawWrecks();

    for (let e of enemies) drawEnemy(e);

    if (p1.active) drawCommando(p1);
    if (p2.active) drawCommando(p2);

    for (let os of oilStains) {
        pxRect(os.x - os.w/2, os.y, os.w, os.h, '#111619');
        if (os.w > 7) pxRect(os.x, os.y, Math.max(2,os.w*.35), 1, '#43505a');
    }
    for (let op of oilParticles) {
        pxRect(op.x - 1, op.y - 1, op.size + 2, op.size + 2, '#090b0c');
        pxRect(op.x, op.y, op.size, op.size, '#252d31');
        if (op.vy > 1.3) pxRect(op.x, op.y - 3, Math.max(1,op.size-1), 3, '#111719');
    }

    for (let bs of bloodStains) {
        pxRect(bs.x - bs.w/2, bs.y, bs.w, bs.h, '#650812');
        if (bs.w > 7) pxRect(bs.x - 1, bs.y - 1, 3, 1, '#a91220');
    }
    for (let bp of bloodParticles) {
        pxRect(bp.x - 1, bp.y - 1, bp.size + 2, bp.size + 2, '#4b050b');
        pxRect(bp.x, bp.y, bp.size, bp.size, bp.shade || '#c20d22');
        if (bp.vy > 1.5) pxRect(bp.x, bp.y - 2, bp.size, 2, '#e02032');
    }

    for (const m of muzzleFlashes) {
        const a=m.life/m.maxLife, x=m.x, y=m.y, d=m.dir;
        ctx.save(); ctx.globalAlpha=Math.min(1,a*1.35);
        pxRect(x+(d>0?0:-12),y-2,12,5,m.enemy?'#ff5a24':'#ff8a22');
        pxRect(x+(d>0?4:-9),y-4,7,9,'#ffc43f');
        pxRect(x+(d>0?8:-5),y-2,5,5,'#fff4b0');
        ctx.restore();
    }
    for(const fw of fireworks){ const a=Math.max(0,Math.min(1,fw.life/20)); ctx.save();ctx.globalAlpha=a;pxRect(fw.x,fw.y,fw.size+1,fw.size+1,fw.color);pxRect(fw.x+fw.vx*.8,fw.y+fw.vy*.8,1,1,'#fff');ctx.restore(); }
    for (const f of fxParticles) {
        const a=Math.max(0,Math.min(1,f.life/12)); ctx.save(); ctx.globalAlpha=a;
        if(f.kind==='smoke'){ pxRect(f.x-f.size/2,f.y-f.size/2,f.size,f.size,'#252825'); pxRect(f.x-f.size*.15,f.y-f.size*.18,f.size*.72,f.size*.72,'#4e514b'); if((f.age||0)<10) pxRect(f.x,f.y,f.size*.35,f.size*.35,'#7c786d'); }
        else if(f.kind==='fire'){ pxRect(f.x-f.size/2,f.y-f.size/2,f.size,f.size,'#8d1c12'); pxRect(f.x-f.size*.15,f.y-f.size*.18,f.size*.72,f.size*.72,'#ff5a18'); pxRect(f.x+f.size*.08,f.y,f.size*.36,f.size*.36,'#ffe45d'); }
        else if(f.kind==='ember'){ pxRect(f.x,f.y,Math.max(1,f.size),Math.max(1,f.size),'#ff8d2a'); }
        else if(f.kind==='spark'){ pxRect(f.x,f.y,Math.max(1,f.size),1,'#ffd34d'); pxRect(f.x,f.y-1,1,3,'#fff6bd'); }
        else if(f.kind==='flash'){ pxRect(f.x-f.size/2,f.y-f.size/2,f.size,f.size,'#fff1a8'); }
        else { pxRect(f.x,f.y,Math.max(2,f.size),Math.max(1,f.size*.55),'#ff7b27'); }
        ctx.restore();
    }

    for (let b of bullets) {
        // Bright SNES projectile cores with a short motion streak.
        const sx = b.vx < 0 ? 1 : -1;
        if (b.type === 'spread') { pxRect(b.x+sx*5,b.y+1,6,1,'#9f4f13'); pxRect(b.x,b.y,6,3,'#ffd84d'); pxRect(b.x+1,b.y,3,2,'#fff6c7'); }
        else if (b.type === 'laser') { pxRect(b.x+sx*8,b.y+1,20,2,'#7d131c'); pxRect(b.x,b.y,15,4,'#ef3340'); pxRect(b.x+2,b.y+1,10,2,'#fff'); }
        else if (b.type === 'missile') { pxRect(b.x+sx*7,b.y+1,7,2,'#ff7a18'); pxRect(b.x,b.y,10,5,'#6f7475'); pxRect(b.x+(b.vx>0?7:0),b.y+1,4,3,'#d9dede'); }
        else if (b.type === 'flame') { pxRect(b.x+sx*6,b.y+1,8,4,'#c33116'); pxRect(b.x,b.y,7,6,'#ff6a1a'); pxRect(b.x+2,b.y+1,4,3,'#ffe45d'); }
        else if (b.type === 'plasma_enemy') { pxRect(b.x-2,b.y-2,10,10,'#123e4a'); pxRect(b.x,b.y,7,7,'#39e7ff'); pxRect(b.x+2,b.y+2,3,3,'#eaffff'); }
        else if (b.fromPlayer) { pxRect(b.x+sx*7,b.y+1,8,1,'#9d5419'); pxRect(b.x,b.y,7,3,'#ffbe3d'); pxRect(b.x+1,b.y,4,2,'#fff6cf'); }
        else { pxRect(b.x+sx*5,b.y+1,6,1,'#68151c'); pxRect(b.x,b.y,7,3,'#ff534d'); pxRect(b.x+1,b.y,3,2,'#ffd3a8'); }
    }

    ctx.restore();

    drawForegroundScenery();
    drawRespawnBanner(p1, 'P1');
    if (p2.active) drawRespawnBanner(p2, 'P2');
    if (screenFlash > 0) {
        ctx.save(); ctx.globalAlpha = screenFlash / 24; ctx.fillStyle = '#ffebe0'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.restore();
        screenFlash--;
    }

    drawBossIntroOverlay();

    document.getElementById('p1-hud').innerText = `[P1 ♥ ${'█'.repeat(Math.max(0,p1.hp))}${'░'.repeat(Math.max(0,p1.maxHp-p1.hp))}] [LIVES:${p1.life}] [WPN:${WEAPON_NAMES[p1.weapon][0]}]`;
    document.getElementById('level-hud').innerText = `[STAGE ${currentLevel}: ${LEVEL_THEMES[currentLevel-1].name}]`;
    document.getElementById('p2-hud').innerText = p2.active ? `[P2 ♥ ${'█'.repeat(Math.max(0,p2.hp))}${'░'.repeat(Math.max(0,p2.maxHp-p2.hp))}] [LIVES:${p2.life}] [WPN:${WEAPON_NAMES[p2.weapon][0]}]` : `[PRESS C / P2 START TO JOIN]`;
}

function gameLoop() {
    updateGame();
    draw();
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
