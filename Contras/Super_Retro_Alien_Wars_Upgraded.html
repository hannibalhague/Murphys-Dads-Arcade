<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Retro Alien Wars</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 35px rgba(255, 120, 35, 0.35);
            border: 5px solid #16130f;
            background: #111;
            width: 640px;
            max-width: 100%;
        }
        #game-container::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
            mix-blend-mode: screen;
        }
        canvas {
            display: block;
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: auto;
        }
        #ui-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            letter-spacing: 1px;
        }
        #touch-controls {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            pointer-events: none;
        }
        .touch-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .t-btn {
            width: 55px;
            height: 55px;
            background: rgba(211, 84, 0, 0.3);
            border: 2px solid rgba(230, 126, 34, 0.7);
            border-radius: 50%;
            color: white;
            font-size: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.6);
        }
        .t-btn:active, .t-btn.active-press {
            background: rgba(230, 126, 34, 0.8);
            transform: scale(0.95);
        }
        #joystick-base {
            position: relative;
            width: 110px;
            height: 110px;
            background: rgba(211, 84, 0, 0.2);
            border: 2px solid rgba(230, 126, 34, 0.5);
            border-radius: 50%;
            pointer-events: auto;
            touch-action: none;
        }
        #joystick-stick {
            position: absolute;
            top: 30px;
            left: 30px;
            width: 50px;
            height: 50px;
            background: rgba(230, 126, 34, 0.7);
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="640" height="360"></canvas>
    <div id="ui-overlay">
        <div id="p1-hud">[P1 LIFE: 3] [CONT: 3] [WPN: N]</div>
        <div id="level-hud">[STAGE 1: JUNGLE]</div>
        <div id="p2-hud">[P2 LIFE: 3] [CONT: 3] [WPN: N]</div>
    </div>
    <div id="touch-controls">
        <div class="touch-group">
            <div id="joystick-base">
                <div id="joystick-stick"></div>
            </div>
        </div>
        <div class="touch-group" style="align-items: flex-end;">
            <div class="t-btn" id="btn-jump">SPC</div>
            <div class="t-btn" id="btn-shoot">SFT</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'MENU';
let currentLevel = 1;
const MAX_LEVELS = 10;
const STAGE_LENGTH = 6500;
const WEAPON_NAMES = ['NORMAL', 'SPREAD', 'LASER', 'MISSILE', 'FLAME'];
const ENEMY_STATS = {
    army_soldier: { hp: 1, speed: 0.52, canJump: true, shoot: true, range: 250 },
    terminator: { hp: 3, speed: 0.46, canJump: true, shoot: true, range: 300 },
    robot: { hp: 2, speed: 0.48, canJump: true, shoot: true, range: 270 },
    alien: { hp: 2, speed: 0.66, canJump: true, shoot: true, range: 230 },
    xenomorph: { hp: 3, speed: 0.70, canJump: true, shoot: false, range: 0 },
    combat_dog: { hp: 1, speed: 0.98, canJump: true, shoot: false, range: 0 },
    enemy_vehicle: { hp: 7, speed: 0.40, canJump: false, shoot: true, range: 350 },
    turret: { hp: 3, speed: 0, canJump: false, shoot: true, range: 410 }
};
const BOSS_TYPES = [
    'SIEGE_TANK','ARMORED_CARRIER','ROCKET_CRAWLER','GUNSHIP',
    'DRILL_WALKER','PLASMA_SPIDER','WAR_MECH','LAVA_DREADNOUGHT',
    'HIVE_BEHEMOTH','NEXUS_CORE'
];

let p1 = {
    x: 80, y: 220, w: 34, h: 56, vx: 0, vy: 0, speed: 2.08, jumpForce: -9.8, // Higher, longer, floatier arcade jump
    grounded: false, canDoubleJump: true, hanging: false, ledgeObj: null, dir: 1, up: false, down: false, ducking: false, 
    life: 3, continues: 3, weapon: 0, invulnerable: 0, active: true, color: '#2980b9', animTimer: 0,
    rollTimer: 0, flipAngle: 0, climbTimer: 0, deathTimer: 0, deathSpin: 0
};

let p2 = {
    x: 120, y: 220, w: 34, h: 56, vx: 0, vy: 0, speed: 2.08, jumpForce: -9.8,
    grounded: false, canDoubleJump: true, hanging: false, ledgeObj: null, dir: 1, up: false, down: false, ducking: false, 
    life: 3, continues: 3, weapon: 0, invulnerable: 0, active: false, color: '#c0392b', animTimer: 0,
    rollTimer: 0, flipAngle: 0, climbTimer: 0, deathTimer: 0, deathSpin: 0
};

let bullets = [];
let enemies = [];
let hazards = [];
let platforms = [];
let terrainFeatures = [];
let pickups = [];
let bloodParticles = [];
let bloodStains = [];
let oilParticles = [];
let oilStains = [];
let boss = null;
let cameraX = 0;

let joystick = {
    active: false,
    identifier: null,
    baseX: 0,
    baseY: 0,
    stickX: 0,
    stickY: 0,
    angle: 0,
    force: 0
};

const keys = {};
window.addEventListener('keydown', e => { 
    if (['Space', 'ShiftLeft', 'ShiftRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
        e.preventDefault();
    }
    keys[e.code] = true; 
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function setupControl(id, code) {
    const el = document.getElementById(id);
    const press = (e) => {
        e.preventDefault();
        if (el.setPointerCapture && e.pointerId !== undefined) el.setPointerCapture(e.pointerId);
        keys[code] = true;
        el.classList.add('active-press');
    };
    const release = (e) => {
        e.preventDefault();
        keys[code] = false;
        el.classList.remove('active-press');
    };
    el.addEventListener('pointerdown', press, { passive: false });
    el.addEventListener('pointerup', release, { passive: false });
    el.addEventListener('pointercancel', release, { passive: false });
    el.addEventListener('lostpointercapture', release, { passive: false });
}

setupControl('btn-jump', 'Space');
setupControl('btn-shoot', 'ShiftLeft');

const joyBase = document.getElementById('joystick-base');
const joyStick = document.getElementById('joystick-stick');

joyBase.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    joystick.active = true;
    joystick.identifier = e.pointerId;
    if (joyBase.setPointerCapture) joyBase.setPointerCapture(e.pointerId);
    const rect = joyBase.getBoundingClientRect();
    joystick.baseX = rect.left + rect.width / 2;
    joystick.baseY = rect.top + rect.height / 2;
    updateJoystick(e.clientX, e.clientY);
}, { passive: false });

joyBase.addEventListener('pointermove', (e) => {
    if (!joystick.active || e.pointerId !== joystick.identifier) return;
    e.preventDefault();
    updateJoystick(e.clientX, e.clientY);
}, { passive: false });

const endJoystickPointer = (e) => {
    if (!joystick.active || e.pointerId !== joystick.identifier) return;
    e.preventDefault();
    resetJoystick();
};
joyBase.addEventListener('pointerup', endJoystickPointer, { passive: false });
joyBase.addEventListener('pointercancel', endJoystickPointer, { passive: false });
joyBase.addEventListener('lostpointercapture', endJoystickPointer, { passive: false });

function updateJoystick(clientX, clientY) {
    const maxDist = 35;
    let dx = clientX - joystick.baseX;
    let dy = clientY - joystick.baseY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist > maxDist) {
        dx = (dx / dist) * maxDist;
        dy = (dy / dist) * maxDist;
    }
    
    joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
    
    joystick.angle = Math.atan2(dy, dx);
    joystick.force = Math.min(dist / maxDist, 1.0);

    keys['KeyA'] = dx < -12;
    keys['KeyD'] = dx > 12;
    keys['KeyW'] = dy < -15;
    keys['KeyS'] = dy > 18;
}

function resetJoystick() {
    joystick.active = false;
    joystick.identifier = null;
    joyStick.style.transform = `translate(0px, 0px)`;
    keys['KeyA'] = false;
    keys['KeyD'] = false;
    keys['KeyW'] = false;
    keys['KeyS'] = false;
}


function makePickup(x, y, forceOneUp = false) {
    const oneUp = forceOneUp || Math.random() < 0.05;
    return {
        x, baseY: y, y, w: 28, h: 24,
        kind: oneUp ? 'oneup' : 'weapon',
        weaponType: oneUp ? 0 : Math.floor(Math.random() * WEAPON_NAMES.length),
        floatTimer: Math.random() * Math.PI * 2
    };
}

function getGamepadInput(index) {
    const gps = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = gps[index];
    if (!gp) return {left:false,right:false,up:false,down:false,jump:false,shoot:false};
    const b = gp.buttons || [];
    const pressed = n => !!(b[n] && b[n].pressed);
    const ax0 = gp.axes && Number.isFinite(gp.axes[0]) ? gp.axes[0] : 0;
    const ax1 = gp.axes && Number.isFinite(gp.axes[1]) ? gp.axes[1] : 0;
    return {
        left: ax0 < -0.28 || pressed(14),
        right: ax0 > 0.28 || pressed(15),
        up: ax1 < -0.36 || pressed(12),
        down: ax1 > 0.36 || pressed(13),
        jump: pressed(0) || pressed(1),
        shoot: pressed(2) || pressed(5) || pressed(7)
    };
}

function mergeInput(a, b) {
    return {
        left: !!(a.left || b.left), right: !!(a.right || b.right),
        up: !!(a.up || b.up), down: !!(a.down || b.down),
        jump: !!(a.jump || b.jump), shoot: !!(a.shoot || b.shoot)
    };
}

const LEVEL_THEMES = [
    { name: "JUNGLE", skyTop: "#78281f", skyBot: "#d35400", ground: "#142914" },
    { name: "ALIEN HIVE", skyTop: "#4a148c", skyBot: "#7b1fa2", ground: "#2b1030" },
    { name: "ROBOT FACTORY", skyTop: "#212121", skyBot: "#424242", ground: "#1a237e" },
    { name: "TERMINATOR WASTELAND", skyTop: "#b71c1c", skyBot: "#e65100", ground: "#3e2723" },
    { name: "BIO-LABORATORY", skyTop: "#004d40", skyBot: "#00695c", ground: "#1b5e20" },
    { name: "CYBER CORE", skyTop: "#0d47a1", skyBot: "#1565c0", ground: "#000051" },
    { name: "VOLCANIC DEPTHS", skyTop: "#bf360c", skyBot: "#ff6f00", ground: "#263238" },
    { name: "MOTHERHIVE", skyTop: "#4a148c", skyBot: "#880e4f", ground: "#311b92" },
    { name: "DEFENSE GRID", skyTop: "#006064", skyBot: "#00838f", ground: "#004d40" },
    { name: "FINAL NEXUS", skyTop: "#311b92", skyBot: "#b71c1c", ground: "#111111" }
];

function startLevel(lvl) {
    currentLevel = lvl;
    enemies = [];
    bullets = [];
    pickups = [];
    hazards = [];
    platforms = [];
    terrainFeatures = [];
    bloodParticles = [];
    bloodStains = [];
    oilParticles = [];
    oilStains = [];
    boss = null;
    cameraX = 0;
    p1.x = 80; p1.y = 220; p1.vy = 0; p1.grounded = true; p1.canDoubleJump = true; p1.ducking = false; p1.h = 56; p1.hanging = false; p1.ledgeObj = null;
    p2.x = 120; p2.y = 220; p2.vy = 0; p2.grounded = true; p2.canDoubleJump = true; p2.ducking = false; p2.h = 56; p2.hanging = false; p2.ledgeObj = null;

    let currentX = 350;
    while (currentX < STAGE_LENGTH - 400) {
        let featureType = Math.random();
        if (featureType < 0.18) {
            let pitWidth = 45 + Math.random() * 35;
            platforms.push({ type: 'pit', x: currentX, w: pitWidth });
            currentX += pitWidth;
        } else if (featureType < 0.36) {
            let waterWidth = 80 + Math.random() * 70;
            hazards.push({ type: 'water', x: currentX, y: 268, w: waterWidth, h: 30 });
            currentX += waterWidth;
        } else if (featureType < 0.68) {
            // More frequent rolling terrain, with a mix of broad hills and smaller mounds.
            const bigHill = Math.random() < 0.42;
            terrainFeatures.push({ type: 'mound', x: currentX, w: bigHill ? 260 + Math.random() * 180 : 130 + Math.random() * 120, h: bigHill ? 34 + Math.random() * 38 : 18 + Math.random() * 26 });
            currentX += bigHill ? 230 : 155;
        } else {
            if (Math.random() < 0.8) {
                let ledgeObj = {
                    type: 'ledge',
                    x: currentX + 20,
                    y: 110 + (Math.random() * 65),
                    w: 120 + Math.random() * 70,
                    h: 18
                };
                platforms.push(ledgeObj);

                if (Math.random() < 0.5) {
                    let eType = Math.random() < 0.5 ? 'turret' : 'army_soldier';
                    enemies.push({
                        type: eType,
                        x: ledgeObj.x + 20 + Math.random() * (ledgeObj.w - 40),
                        y: ledgeObj.y - 50,
                        w: 38, h: 50, vx: 0, vy: 0,
                        hp: ENEMY_STATS[eType].hp,
                        shootTimer: 0, maxHp: ENEMY_STATS[eType].hp,
                        behaviorTimer: 0, moveDir: 1, faceDir: 1, animTimer: Math.random() * 10,
                        grounded: true, canJump: ENEMY_STATS[eType].canJump
                    });
                }
            }
            if (Math.random() < 0.3) {
                hazards.push({ x: currentX + 50, y: 288, w: 30, h: 8, type: 'spike' });
            }
            currentX += 170 + Math.random() * 100;
        }
    }

    for (let xPos = 700; xPos < STAGE_LENGTH - 300; xPos += 780 + Math.random() * 420) {
        pickups.push(makePickup(xPos, 170 + (Math.random() * 70)));
    }
    // At least two visible 1-UP wings per stage, in addition to rare random drops.
    pickups.push(makePickup(1650, 185, true));
    pickups.push(makePickup(3450, 155, true));

    for (let xPos = 450; xPos < STAGE_LENGTH - 300; xPos += 185 + Math.random() * 95) {
        // Dogs are intentionally rare. Most encounters are soldiers/robots/aliens.
        let tOpts = ['army_soldier','army_soldier','terminator','robot','robot','alien','xenomorph','enemy_vehicle','turret'];
        let chosen = Math.random() < 0.055 ? 'combat_dog' : tOpts[Math.floor(Math.random() * tOpts.length)];
        let spawnW = chosen === 'combat_dog' ? 62 : (chosen === 'enemy_vehicle' ? 92 : 38);
        let spawnH = chosen === 'combat_dog' ? 42 : (chosen === 'enemy_vehicle' ? 56 : 50);
        let spawnY = 276 - spawnH;
        enemies.push({
            type: chosen,
            x: xPos, y: spawnY, w: spawnW, h: spawnH, vx: 0, vy: 0,
            hp: ENEMY_STATS[chosen].hp,
            shootTimer: 0, maxHp: ENEMY_STATS[chosen].hp,
            behaviorTimer: 0, moveDir: chosen === 'combat_dog' ? -1 : (Math.random() < 0.82 ? -1 : 1), faceDir: -1, animTimer: Math.random() * 10,
            grounded: true, canJump: ENEMY_STATS[chosen].canJump
        });
    }
}

function spawnBoss() {
    const kind = BOSS_TYPES[(currentLevel - 1) % BOSS_TYPES.length];
    const dims = kind === 'GUNSHIP' ? {w: 176, h: 82, y: 70} : {w: 184, h: 104, y: 172};
    const hp = 58 + currentLevel * 12;
    boss = {
        kind,
        x: STAGE_LENGTH - 245, y: dims.y, w: dims.w, h: dims.h,
        hp, maxHp: hp,
        vx: kind === 'GUNSHIP' ? -0.75 : -0.48 - Math.random() * 0.22,
        vy: kind === 'GUNSHIP' ? 0.55 : 0,
        timer: 0, active: true, phase: 0, moveTimer: 0,
        homeX: STAGE_LENGTH - 245, dashTimer: 0, attackMode: 0
    };
}

function spawnBlood(x, y, count = 8) {
    const amount = Math.min(30, Math.max(6, Math.round(count * 1.65)));
    for (let i = 0; i < amount; i++) {
        bloodParticles.push({
            x, y,
            vx: (Math.random() - 0.5) * 5.4,
            vy: -0.8 - Math.random() * 4.2,
            life: 32 + Math.random() * 28,
            size: 1.5 + Math.random() * 3.2,
            shade: Math.random() < 0.38 ? '#7b0712' : (Math.random() < 0.6 ? '#b70d1f' : '#e02032')
        });
    }
    if (bloodParticles.length > 220) bloodParticles.splice(0, bloodParticles.length - 220);
}

function spawnOil(x, y, count = 8) {
    const amount = Math.min(26, Math.max(5, Math.round(count * 1.45)));
    for (let i = 0; i < amount; i++) {
        oilParticles.push({
            x, y,
            vx: (Math.random() - 0.5) * 4.6,
            vy: -0.6 - Math.random() * 3.5,
            life: 38 + Math.random() * 35,
            size: 1.5 + Math.random() * 3.3
        });
    }
    if (oilParticles.length > 190) oilParticles.splice(0, oilParticles.length - 190);
}

function isMetalEnemy(type) {
    return ['terminator','robot','enemy_vehicle','turret'].includes(type);
}

function checkGamepads() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < gamepads.length; i++) {
        let gp = gamepads[i];
        if (gp && gp.buttons.some(b => b.pressed)) return true;
    }
    return false;
}

function updateGame() {
    if (gameState === 'MENU') {
        if (keys['Space'] || keys['ShiftLeft'] || keys['ShiftRight'] || checkGamepads()) {
            gameState = 'PLAYING';
            p1.life = 3; p1.continues = 3; p1.weapon = 0; p1.active = true;
            p2.life = 3; p2.continues = 3; p2.weapon = 0;
            startLevel(1);
        }
        return;
    }
    if (gameState === 'GAMEOVER' || gameState === 'VICTORY') {
        if (keys['Space'] || keys['ShiftLeft']) gameState = 'MENU';
        return;
    }

    const p1Keyboard = {
        left: keys['KeyA'] || keys['ArrowLeft'], right: keys['KeyD'] || keys['ArrowRight'], up: keys['KeyW'] || keys['ArrowUp'], down: keys['KeyS'] || keys['ArrowDown'],
        jump: keys['Space'], shoot: keys['ShiftLeft'] || keys['ShiftRight']
    };
    const p2Keyboard = {
        left: keys['KeyJ'], right: keys['KeyL'], up: keys['KeyI'], down: keys['KeyK'],
        jump: keys['KeyN'], shoot: keys['KeyM']
    };
    const p1Input = mergeInput(p1Keyboard, getGamepadInput(0));
    const p2Pad = getGamepadInput(1);
    if (!p2.active && (keys['KeyC'] || Object.values(p2Pad).some(Boolean))) p2.active = true;
    const p2Input = mergeInput(p2Keyboard, p2Pad);

    handlePlayerInput(p1, p1Input);
    if (p2.active) handlePlayerInput(p2, p2Input);
    updatePlayerPhysics(p1, p1Input);
    if (p2.active) updatePlayerPhysics(p2, p2Input);

    let leadX = p1.x;
    if (p2.active && p2.x > p1.x) leadX = p2.x;
    if (leadX >= STAGE_LENGTH - 350 && !boss) {
        spawnBoss();
    }

    for (let i = bloodParticles.length - 1; i >= 0; i--) {
        let bp = bloodParticles[i];
        bp.x += bp.vx;
        bp.y += bp.vy;
        bp.vy += 0.20;
        bp.life--;
        if (bp.y >= 273 && bp.vy > 0) {
            if (Math.random() < 0.42 && bloodStains.length < 80) {
                bloodStains.push({x: bp.x, y: 274, w: 3 + Math.random()*9, h: 1 + Math.random()*3, life: 1000});
            }
            bloodParticles.splice(i, 1);
        } else if (bp.life <= 0) {
            bloodParticles.splice(i, 1);
        }
    }

    for (let i = oilParticles.length - 1; i >= 0; i--) {
        const op = oilParticles[i];
        op.x += op.vx; op.y += op.vy; op.vy += 0.18; op.life--;
        if (op.y >= 273 && op.vy > 0) {
            if (Math.random() < 0.48 && oilStains.length < 75) oilStains.push({x: op.x, y: 274, w: 4 + Math.random()*10, h: 1 + Math.random()*3});
            oilParticles.splice(i, 1);
        } else if (op.life <= 0) oilParticles.splice(i, 1);
    }

    for (let pk of pickups) {
        pk.floatTimer += 0.05;
        pk.y = pk.baseY + Math.sin(pk.floatTimer) * 20;
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;

        if (b.x < cameraX || b.x > cameraX + canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
            continue;
        }

        if (boss && boss.active && b.fromPlayer) {
            if (b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
                boss.hp -= (b.damage || 1);
                spawnOil(b.x, b.y, 4);
                bullets.splice(i, 1);
                if (boss.hp <= 0) {
                    boss.active = false;
                    spawnOil(boss.x + boss.w/2, boss.y + boss.h/2, 25);
                    pickups.push(makePickup(boss.x + boss.w/2, 190, true));
                }
                continue;
            }
        }

        let hitEnemy = false;
        if (b.fromPlayer) {
            for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                if (b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
                    e.hp -= (b.damage || 1);
                    hitEnemy = true;
                    (isMetalEnemy(e.type) ? spawnOil : spawnBlood)(e.x + e.w/2, e.y + e.h/2, 5);
                    if (e.hp <= 0) {
                        (isMetalEnemy(e.type) ? spawnOil : spawnBlood)(e.x + e.w/2, e.y + e.h/2, 15);
                        if (Math.random() < 0.08) {
                            pickups.push(makePickup(e.x, Math.max(140, e.y)));
                        }
                        enemies.splice(j, 1);
                    }
                    break;
                }
            }
        }
        if (hitEnemy) bullets.splice(i, 1);
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        let distToPlayer = Math.abs(e.x - leadX);
        e.animTimer = (e.animTimer || 0) + 0.12;
        
        if (distToPlayer < 580) {
            if (e.type !== 'turret') {
                const stats = ENEMY_STATS[e.type];
                // Enemies never steer toward or away from the player. They keep their own patrol/run direction.
                // This prevents packs from bunching up on the player and getting stuck on terrain.
                let moveIntent = e.moveDir || -1;
                const moveSpeed = stats.speed;
                const targetVx = moveIntent * moveSpeed;
                e.vx += (targetVx - e.vx) * 0.085;
                if (Math.abs(e.vx) < 0.01) e.vx = 0;
                e.x += e.vx;
                if (!stats.shoot) e.faceDir = e.moveDir;

                // Enemy jumping/falling physics on platforms
                e.vy += 0.3;
                e.y += e.vy;
                
                let floorY = groundYAt(e.x + e.w * 0.5);
                e.grounded = false;
                for (const l of platforms) {
                    if (l.type !== 'ledge') continue;
                    let horizontal = e.x + e.w > l.x && e.x < l.x + l.w;
                    let crossedTop = (e.y + e.h - e.vy) <= l.y + 4 && e.y + e.h >= l.y;
                    if (horizontal && crossedTop && e.vy >= 0) {
                        e.y = l.y - e.h;
                        e.vy = 0;
                        e.grounded = true;
                        break;
                    }
                }
                if (e.y + e.h >= floorY) {
                    e.y = floorY - e.h;
                    e.vy = 0;
                    e.grounded = true;
                }

                // Foot soldiers/creatures only jump when terrain actually requires it.
                // Tanks, vehicles and turrets never jump.
                if (e.grounded) {
                    const lookX = e.moveDir > 0 ? e.x + e.w + 14 : e.x - 14;
                    const pitAhead = platforms.some(pit => pit.type === 'pit' && lookX > pit.x - 8 && lookX < pit.x + pit.w + 8);
                    const ledgeAhead = platforms.some(l => l.type === 'ledge' &&
                        (e.moveDir > 0 ? (l.x > e.x && l.x - (e.x + e.w) < 38) : (e.x > l.x + l.w && e.x - (l.x + l.w) < 38)) &&
                        l.y < e.y + e.h - 8 && l.y > e.y - 90);
                    if (e.canJump && (pitAhead || ledgeAhead)) {
                        e.vy = e.type === 'combat_dog' ? -5.0 : (e.type === 'xenomorph' ? -5.8 : -5.4);
                        e.grounded = false;
                    } else if (!e.canJump && pitAhead) {
                        // Heavy vehicles turn around before pits rather than hopping or getting wedged.
                        e.moveDir *= -1;
                        e.faceDir = e.moveDir;
                        e.vx *= 0.4;
                    }
                }
            }

            // Enemy bodies are non-lethal: touching/running through an enemy never costs a life.
            // Damage now comes from bullets, hazards and pits only.
            e.attackTimer = Math.max(0, (e.attackTimer || 0) - 1);

            const estats = ENEMY_STATS[e.type];
            if (e.type === 'turret') {
                e.retractPhase = (e.retractPhase || 0) + 0.018;
                e.deployed = Math.sin(e.retractPhase + e.x * 0.01) > -0.20;
            }
            if (estats.shoot && distToPlayer < estats.range && (e.type !== 'turret' || e.deployed)) {
                e.shootTimer++;
                let fireInterval = e.type === 'terminator' ? 145 : e.type === 'robot' ? 175 : e.type === 'enemy_vehicle' ? 165 : e.type === 'turret' ? 190 : 205;
                if (e.shootTimer > fireInterval) {
                    e.shootTimer = 0;
                    const shootDir = leadX < e.x ? -1 : 1;
                    e.faceDir = shootDir;
                    let exactHeadLevelY = e.y + (e.h / 2) - 8;
                    const shotSpeed = e.type === 'terminator' ? 2.05 : 1.82;
                    bullets.push({
                        x: e.x + (shootDir > 0 ? e.w : -5), y: exactHeadLevelY,
                        vx: shootDir * shotSpeed, vy: e.type === 'alien' ? (Math.random() - 0.5) * 0.45 : 0,
                        fromPlayer: false, type: e.type === 'robot' ? 'plasma_enemy' : 'enemy'
                    });
                }
            }
        }
    }

    // One-pass dogs leave the encounter after sprinting beyond the camera instead of circling back.
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.type === 'combat_dog' && e.x + e.w < cameraX - 120) {
            enemies.splice(i, 1);
        }
    }

    if (boss && boss.active) {
        boss.phase += 0.025;
        boss.moveTimer++;
        const arenaLeft = STAGE_LENGTH - 590;
        const arenaRight = STAGE_LENGTH - boss.w - 18;

        // Every boss actively patrols its arena. Some surge or change altitude for a more arcade-like fight.
        if (boss.kind === 'GUNSHIP') {
            boss.x += boss.vx;
            boss.y += boss.vy;
            if (boss.x < arenaLeft || boss.x > arenaRight) boss.vx *= -1;
            if (boss.y < 42 || boss.y > 138) boss.vy *= -1;
        } else {
            const speedBoost = ['DRILL_WALKER','PLASMA_SPIDER','WAR_MECH'].includes(boss.kind) ? 1.45 : 1;
            boss.x += boss.vx * speedBoost;
            if (boss.x < arenaLeft || boss.x > arenaRight) {
                boss.x = Math.max(arenaLeft, Math.min(arenaRight, boss.x));
                boss.vx *= -1;
            }
            const ground = groundYAt(boss.x + boss.w * .5);
            boss.y = ground - boss.h;
            if (boss.kind === 'PLASMA_SPIDER') boss.y += Math.sin(boss.phase * 2.8) * 5;
            if (boss.kind === 'DRILL_WALKER' && boss.moveTimer % 190 === 0) boss.vx *= -1.55;
        }

        // Bosses fire deliberately instead of constantly; movement is the main pressure.
        boss.timer++;
        const fireDelay = boss.kind === 'NEXUS_CORE' ? 92 : boss.kind === 'GUNSHIP' ? 105 : 118;
        if (boss.timer > fireDelay) {
            boss.timer = 0;
            const target = p2.active && Math.abs(p2.x-boss.x) < Math.abs(p1.x-boss.x) ? p2 : p1;
            const muzzleY = boss.kind === 'GUNSHIP' ? boss.y + 48 : boss.y + Math.min(45, boss.h*.42);
            const dx = target.x - boss.x, dy = (target.y+22) - muzzleY;
            const len = Math.max(1, Math.hypot(dx,dy));
            const spd = 1.75;
            bullets.push({x: boss.x + (dx < 0 ? 6 : boss.w-6), y: muzzleY, vx: dx/len*spd, vy: dy/len*spd, fromPlayer: false, type: boss.kind === 'NEXUS_CORE' ? 'plasma_enemy' : 'enemy'});
        }
    }

    if (boss && !boss.active) {
        if (currentLevel < MAX_LEVELS) startLevel(currentLevel + 1);
        else gameState = 'VICTORY';
    }

    for (let i = pickups.length - 1; i >= 0; i--) {
        let pk = pickups[i];
        let target = null;
        if (p1.active && Math.abs(p1.x - pk.x) < 32 && Math.abs(p1.y - pk.y) < 32) target = p1;
        if (p2.active && Math.abs(p2.x - pk.x) < 32 && Math.abs(p2.y - pk.y) < 32) target = p2;

        if (target) {
            if (pk.kind === 'oneup') target.life = Math.min(9, target.life + 1);
            else target.weapon = pk.weaponType;
            pickups.splice(i, 1);
        }
    }

    cameraX = leadX - 220;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > STAGE_LENGTH - canvas.width) cameraX = STAGE_LENGTH - canvas.width;
}

function handlePlayerInput(p, input) {
    if (!p.active) return;

    if (p.hanging) {
        p.vx = 0;
        p.vy = 0;
        if (input.jump || input.up) {
            const l = p.ledgeObj;
            p.h = 56;
            p.ducking = false;
            p.climbTimer = 18;
            p.flipAngle = 0;
            p.x = p.dir > 0 ? l.x + 6 : l.x + l.w - p.w - 6;
            p.y = l.y - p.h - 4;
            p.vy = -2.4;
            p.hanging = false;
            p.grounded = false;
            p.canDoubleJump = true;
            p.ledgeObj = null;
        } else if (input.down) {
            p.hanging = false;
            p.vy = 3.0;
            p.y += 4;
            p.ledgeObj = null;
        }
        return;
    }

    if (p.deathTimer > 0) return;
    if (p.rollTimer > 0) p.rollTimer--;
    if (p.climbTimer > 0) p.climbTimer--;

    // Down + left/right performs a fast combat roll while grounded.
    if (p.grounded && input.down && (input.left || input.right) && p.rollTimer <= 0) {
        p.rollTimer = 26;
        p.dir = input.left ? -1 : 1;
    }

    let targetVx = 0;
    if (p.rollTimer > 0) {
        targetVx = p.dir * p.speed * 1.55;
        p.animTimer += 0.28;
    } else if (input.left && !input.right) { targetVx = -p.speed; p.dir = -1; p.animTimer += 0.15; }
    if (p.rollTimer <= 0 && input.right && !input.left) { targetVx = p.speed; p.dir = 1; p.animTimer += 0.15; }
    const moveEase = targetVx === 0 ? (p.grounded ? 0.16 : 0.08) : (p.grounded ? 0.20 : 0.12);
    p.vx += (targetVx - p.vx) * moveEase;
    if (Math.abs(p.vx) < 0.025 && targetVx === 0) p.vx = 0;

    const wantsDuck = !!input.down && p.grounded && p.rollTimer <= 0;
    const targetH = wantsDuck ? 24 : 56;
    if (p.h !== targetH) {
        const feet = p.y + p.h;
        p.h = targetH;
        p.y = feet - p.h;
    }
    p.ducking = wantsDuck;

    p.up = !!input.up;
    p.down = !!input.down;

    if (input.shoot && (!p.lastShoot || performance.now() - p.lastShoot > 250)) {
        p.lastShoot = performance.now();
        fireOmniDirectionalWeapon(p, input);
    }
}

function fireOmniDirectionalWeapon(p, input) {
    let dx = 0;
    let dy = 0;

    if (input.left) dx = -1;
    if (input.right) dx = 1;
    if (input.up) dy = -1;
    if (input.down && !p.ducking) dy = 1;

    if (dx === 0 && dy === 0) {
        dx = p.dir;
    } else if (dx !== 0) {
        p.dir = dx;
    }

    const speed = 7.5; // Slower player bullets matching slower pace
    let vx = 0, vy = 0;

    if (dx !== 0 && dy !== 0) {
        const diag = speed * 0.7071;
        vx = dx * diag; 
        vy = dy * diag;
    } else if (dx !== 0) {
        vx = dx * speed;
        vy = 0;
    } else if (dy !== 0) {
        vx = 0;
        vy = dy * speed;
    }

    const gunYOffset = p.ducking ? 11 : 22;
    const gunX = p.dir > 0 ? p.x + p.w - 1 : p.x - 7;

    const addBullet = (vx2, vy2, damage=1, type='normal') => {
        bullets.push({
            x: gunX, y: p.y + gunYOffset,
            vx: vx2, vy: vy2, fromPlayer: true, damage, type
        });
    };

    if (p.weapon === 0) {
        addBullet(vx, vy, 1, 'normal');
    } else if (p.weapon === 1) {
        addBullet(vx, vy, 1, 'spread');
        addBullet(vx * 0.95, vy - 2.0, 1, 'spread');
        addBullet(vx * 0.95, vy + 2.0, 1, 'spread');
    } else if (p.weapon === 2) {
        addBullet(vx * 1.5, vy * 1.5, 3, 'laser');
    } else if (p.weapon === 3) {
        addBullet(vx * 0.8, vy * 0.8, 4, 'missile');
    } else {
        addBullet(vx * 0.7, vy + (Math.random() - 0.5) * 2.5, 2, 'flame');
    }
}

function rectsOverlap(a, b, pad=0) {
    return a.x < b.x + b.w + pad &&
           a.x + a.w > b.x - pad &&
           a.y < b.y + b.h + pad &&
           a.y + a.h > b.y - pad;
}

function groundYAt(worldX) {
    let y = 276;
    for (const tf of terrainFeatures) {
        if (tf.type !== 'mound' || worldX < tf.x || worldX > tf.x + tf.w) continue;
        const t = (worldX - tf.x) / tf.w;
        const rise = Math.sin(Math.PI * t) * tf.h;
        y = Math.min(y, 276 - rise);
    }
    return y;
}

function updatePlayerPhysics(p, inputState) {
    if (p.deathTimer > 0) {
        p.deathTimer--;
        p.deathSpin += 0.28 * p.dir;
        p.vy += 0.28;
        p.y += p.vy;
        p.x += p.vx;
        if (p.deathTimer === 0) {
            p.x = Math.max(0, cameraX + 50); p.y = 210; p.vx = 0; p.vy = 0;
            p.invulnerable = 90; p.deathSpin = 0; p.hanging = false;
        }
        return;
    }
    if (p.hanging) return;

    if (inputState.jump && !p.jumpPressedLast) {
        if (p.grounded && !p.ducking) {
            p.vy = p.jumpForce;
            p.grounded = false;
            p.canDoubleJump = true;
        } else if (!p.grounded && p.canDoubleJump) {
            p.vy = p.jumpForce * 0.72;
            p.canDoubleJump = false;
        }
        p.jumpPressedLast = true;
    }
    if (!inputState.jump) {
        if (p.jumpPressedLast && p.vy < -2.2) p.vy *= 0.86; // keep momentum for a longer, floatier jump
        p.jumpPressedLast = false;
    }

    const oldBottom = p.y + p.h;
    p.x += p.vx;
    // Gentle gravity plus a tiny hold boost creates a higher, longer SNES-style floaty arc.
    if (inputState.jump && p.vy < 0) p.vy -= 0.035;
    p.vy += 0.245;
    if (p.vy > 6.6) p.vy = 6.6;
    p.y += p.vy;
    if (!p.grounded && Math.abs(p.vx) > 0.55) p.flipAngle += 0.13 * p.dir;
    else if (p.grounded) p.flipAngle *= 0.6;
    if (p.climbTimer > 0) p.flipAngle += 0.24 * p.dir;

    if (p.x < 0) p.x = 0;
    if (p.x > STAGE_LENGTH - p.w) p.x = STAGE_LENGTH - p.w;

    p.grounded = false;
    const floorY = groundYAt(p.x + p.w * 0.5);

    for (const l of platforms) {
        if (l.type !== 'ledge') continue;

        const horizontal = p.x + p.w - 5 > l.x && p.x + 5 < l.x + l.w;
        const crossedTop = oldBottom <= l.y + 4 && p.y + p.h >= l.y;
        
        if (horizontal && crossedTop && p.vy >= 0) {
            if (inputState.down && inputState.jump) {
                p.y += 6;
                p.vy = 2.0;
                continue;
            }
            p.y = l.y - p.h;
            p.vy = 0;
            p.grounded = true;
            p.canDoubleJump = true;
            break;
        }

        const isHighEnough = l.y < p.y + 20; 
        const nearRightLip = p.dir > 0 && Math.abs((p.x + p.w) - l.x) < 12;
        const nearLeftLip = p.dir < 0 && Math.abs(p.x - (l.x + l.w)) < 12;
        const nearLip = (nearRightLip || nearLeftLip) && isHighEnough;
        const verticalWindow = p.y + p.h > l.y + 2 && p.y < l.y + l.h + 24;

        if (!p.grounded && nearLip && verticalWindow && p.vy < 3.0) {
            p.hanging = true;
            p.ledgeObj = l;
            p.x = nearRightLip ? l.x - p.w + 2 : l.x + l.w - 2;
            p.y = l.y + 3;
            p.vx = 0;
            p.vy = 0;
            break;
        }
    }

    if (p.hanging) return;

    if (p.y + p.h >= floorY) {
        let overPit = false;
        for (const pit of platforms) {
            if (pit.type === 'pit' &&
                p.x + p.w * 0.5 > pit.x &&
                p.x + p.w * 0.5 < pit.x + pit.w) {
                overPit = true;
                break;
            }
        }

        if (overPit) {
            if (p.y > canvas.height + 30) triggerPlayerDeath(p);
        } else {
            p.y = floorY - p.h;
            p.vy = 0;
            p.grounded = true;
            p.canDoubleJump = true;
        }
    }

    for (let h of hazards) {
        if (h.type === 'water') continue;

        if (rectsOverlap(p, h)) {
            spawnBlood(p.x + p.w/2, p.y + p.h/2, 6);
            triggerPlayerDamage(p);
        }
    }

    if (p.invulnerable > 0) p.invulnerable--;

    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (!b.fromPlayer) {
            const bulletBox = { x: b.x - 2, y: b.y - 2, w: 8, h: 5 };
            if (rectsOverlap(p, bulletBox)) {
                // If ducking, ensure high bullets pass completely over you without hitting
                if (p.ducking && b.y > p.y + p.h - 12) {
                    // Ducking successfully avoids it!
                    continue;
                }
                bullets.splice(i, 1);
                spawnBlood(p.x + p.w/2, p.y + p.h/2, 5);
                triggerPlayerDamage(p);
            }
        }
    }
}

function triggerPlayerDamage(p) {
    if (p.invulnerable === 0) {
        p.life--;
        p.invulnerable = 75;
        if (p.life <= 0) handlePlayerLoss(p);
    }
}

function triggerPlayerDeath(p) {
    if (p.deathTimer > 0) return;
    p.life--;
    p.invulnerable = 120;
    p.deathTimer = 52;
    p.deathSpin = 0;
    p.vy = -6.7;
    p.vx = -p.dir * 1.8;
    p.hanging = false;
    p.ledgeObj = null;
    spawnBlood(p.x + p.w/2, p.y + p.h/2, 18);
    if (p.life <= 0) {
        p.deathTimer = 28;
        setTimeout(() => { if (p.life <= 0) handlePlayerLoss(p); }, 500);
    }
}

function handlePlayerLoss(p) {
    if (p.continues > 0) {
        p.continues--;
        p.life = 3;
        p.x = cameraX + 50;
        p.y = 220;
    } else {
        if ((p === p1 && !p2.active) || (!p1.active && p === p2) || (!p1.active && !p2.active)) {
            gameState = 'GAMEOVER';
        } else {
            p.active = false;
        }
    }
}

function handleGamepads() { /* input is merged in updateGame */ }

function pxRect(x, y, w, h, c) {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

function drawCommando(p) {
    if (p.invulnerable > 0 && Math.floor(p.invulnerable / 4) % 2 === 0) return;
    ctx.save();
    ctx.translate(Math.round(p.x + p.w/2), Math.round(p.y + p.h/2));
    if (p.deathTimer > 0) ctx.rotate(p.deathSpin);
    else if (p.rollTimer > 0) ctx.rotate((26 - p.rollTimer) * 0.32 * p.dir);
    else if (p.climbTimer > 0 || (!p.grounded && Math.abs(p.vx) > 0.55)) ctx.rotate(p.flipAngle);
    ctx.translate(-p.w/2, -p.h/2);

    const skin = '#d58b55';
    const skinHi = '#f0b06b';
    const vest = p.color;
    const dark = '#17231c';
    const gun = '#333b42';
    const metal = '#cfd8dc';
    const barrel = '#11181c';

    if (p.hanging) {
        pxRect(6, 7, 24, 18, vest);
        pxRect(9, -4, 17, 12, skin);
        pxRect(8, -5, 19, 5, '#3a2b20');
        pxRect(p.dir > 0 ? 25 : 1, 25, 9, 14, dark);
        pxRect(p.dir > 0 ? 30 : -4, 20, 7, 4, skinHi);
        ctx.restore();
        return;
    }

    if (p.ducking) {
        // Low kneeling combat pose: rear knee down, front foot planted, torso leaning into rifle.
        const f = p.dir > 0 ? 1 : -1;
        pxRect(5, 15, 13, 6, '#254b38');
        pxRect(5, 20, 9, 4, dark);
        pxRect(20, 17, 12, 5, '#22382b');
        pxRect(p.dir > 0 ? 26 : 0, 20, 9, 4, '#0b1110');
        pxRect(7, 7, 23, 13, vest);
        pxRect(9, 10, 4, 10, '#356d50');
        pxRect(22, 10, 4, 9, '#14241b');
        pxRect(10, 0, 16, 9, skin);
        pxRect(8, -2, 20, 4, '#46563b');
        pxRect(11, -4, 15, 3, '#667851');
        pxRect(p.dir > 0 ? 23 : 3, 8, 8, 4, skinHi);
        if (p.dir > 0) {
            pxRect(26, 8, 18, 5, gun); pxRect(42, 7, 10, 7, metal); pxRect(50, 9, 7, 3, barrel);
        } else {
            pxRect(-10, 8, 18, 5, gun); pxRect(-18, 7, 10, 7, metal); pxRect(-23, 9, 7, 3, barrel);
        }
    } else {
        let isMoving = p.grounded && p.vx !== 0;
        let hipOffsetL = 0, hipOffsetR = 0;
        let kneeOffsetL = 0, kneeOffsetR = 0;
        let footOffsetLX = 0, footOffsetRX = 0;

        if (isMoving) {
            let cycle = Math.sin(p.animTimer * 1.5);
            hipOffsetL = Math.round(Math.sin(p.animTimer * 1.5) * 6);
            hipOffsetR = Math.round(Math.sin(p.animTimer * 1.5 + Math.PI) * 6);
            kneeOffsetL = cycle > 0 ? 3 : -2;
            kneeOffsetR = cycle < 0 ? 3 : -2;
            footOffsetLX = cycle > 0 ? 4 : -3;
            footOffsetRX = cycle < 0 ? 4 : -3;
        }

        pxRect(6, 36 + hipOffsetL, 8, 7, dark);
        pxRect(6, 43 + hipOffsetL, 8, 7 + kneeOffsetL, '#22382b');
        pxRect(4 + footOffsetLX, 50 + hipOffsetL, 11, 5, '#0b1110');

        pxRect(20, 36 + hipOffsetR, 8, 7, dark);
        pxRect(20, 43 + hipOffsetR, 8, 7 + kneeOffsetR, '#22382b');
        pxRect(18 + footOffsetRX, 50 + hipOffsetR, 11, 5, '#0b1110');

        pxRect(7, 34, 10, 8, '#254b38');
        pxRect(20, 34, 10, 8, '#254b38');

        pxRect(5, 14, 27, 22, vest);
        pxRect(5, 14, 27, 4, '#607a54');
        pxRect(8, 17, 4, 17, '#356d50');
        pxRect(22, 17, 4, 17, '#356d50');
        pxRect(14, 17, 3, 19, '#14241b');
        pxRect(25, 25, 6, 6, '#111');

        pxRect(8, 3, 19, 14, skin);
        pxRect(7, 2, 20, 5, '#3a2b20');
        pxRect(5, 0, 24, 4, '#46563b');
        pxRect(7, -2, 20, 4, '#667851');
        pxRect(11, 8, 4, 3, skinHi);
        pxRect(23, 8, 3, 2, '#202020');

        if (p.up && ((keys['KeyA']) || (keys['KeyD']))) {

function drawEnemy(e) {
    ctx.save();

    const t = Math.sin((e.animTimer || 0) * 1.2);
    const right = (e.faceDir ?? e.moveDir) > 0;
    const gunX = right ? 27 : -11;

    if (e.type === 'turret') {
        // Retractable armored turret: head sinks into the reinforced emplacement between firing windows.
        const dep = e.deployed === false ? 17 : Math.max(0, 6 + Math.sin((e.retractPhase||0)*2)*3);
        pxRect(1, 39, 36, 9, '#554a34'); pxRect(4, 34, 30, 7, '#786849');
        pxRect(6, 30, 28, 8, '#30383a'); pxRect(9, 25 + dep*.35, 22, 9, '#596266');
        pxRect(13, 11 + dep, 15, 12, '#747f82'); pxRect(15, 9 + dep, 11, 4, '#929b9d');
        if (dep < 13) {
            pxRect(right ? 25 : -19, 15 + dep, 30, 7, '#202629');
            pxRect(right ? 52 : -25, 17 + dep, 9, 3, '#0d1113');
            pxRect(right ? 20 : 13, 13 + dep, 5, 5, '#d94132');
        }
        pxRect(6, 45, 27, 3, '#252a2b');
    } else if (e.type === 'army_soldier') {
        pxRect(6, 16, 26, 20, '#7c3a31'); pxRect(9, 10, 20, 8, '#46543c');

    // Extra readable SNES-scale anatomy: hands/fingers and proper feet/shoes.
    if (['army_soldier','terminator','robot','alien'].includes(e.type)) {
        const hand = e.type === 'army_soldier' ? '#c98255' : (e.type === 'alien' ? '#79a66f' : '#9ca6aa');

        pxRect(5 + t*2, 50, 13, 3, '#080a0b');

        pxRect(4, -6, Math.max(0, (e.w - 8) * (e.hp / e.maxHp)), 3, '#d8ba45');

}

function sceneSeed(x, salt = 0) {
    const n = Math.sin((x + currentLevel * 131 + salt * 977) * 0.0174533) * 43758.5453;
    return n - Math.floor(n);
}

function drawCloudsAndSmoke() {
    const t = performance.now() * 0.00004;
    ctx.save();
    ctx.translate(-cameraX * 0.05, 0);
    for (let x = -300; x < STAGE_LENGTH + 700; x += 430) {
        const drift = (t * 500 + x * 0.07) % 120;
        const cx = x + drift;
        const cy = 38 + sceneSeed(x, 1) * 65;
        ctx.fillStyle = 'rgba(235,226,207,.48)';
        ctx.beginPath();
        ctx.ellipse(cx, cy, 34, 10, 0, 0, Math.PI*2);
        ctx.ellipse(cx + 24, cy - 7, 27, 13, 0, 0, Math.PI*2);
        ctx.ellipse(cx + 52, cy + 1, 33, 10, 0, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(-cameraX * 0.18, 0);
    for (let x = 520; x < STAGE_LENGTH; x += 760) {
        const baseY = 215;
        for (let k = 0; k < 5; k++) {
            const wobble = Math.sin(performance.now()*0.001 + k + x) * 5;
            ctx.fillStyle = `rgba(38,42,40,${0.16 + k*0.025})`;
            ctx.beginPath();
            ctx.arc(x + wobble + k*3, baseY - 25 - k*18, 11 + k*3, 0, Math.PI*2);
            ctx.fill();
        }
    }
    ctx.restore();
}

function drawLevelSpecificBackdrop() {
    ctx.save();
    ctx.translate(-cameraX * 0.22, 0);
    const lvl = currentLevel;
    for (let x = -120; x < STAGE_LENGTH + 500; x += 420) {
        const r = sceneSeed(x, 31);
        if (lvl === 1) { // jungle ruins
            pxRect(x+40,182,65,94,'#24392b'); pxRect(x+49,169,48,15,'#536247');
            for(let v=0;v<3;v++) pxRect(x+55+v*14,197,6,58,'#17271d');
        } else if (lvl === 2 || lvl === 8) { // hive
            ctx.fillStyle='#42234b'; ctx.beginPath(); ctx.ellipse(x+90,215,55,72,0,0,Math.PI*2); ctx.fill();
            pxRect(x+83,147,14,78,'#6e3a70');
        } else if (lvl === 3 || lvl === 6 || lvl === 9) { // machinery / grid
            pxRect(x+25,155,135,110,'#222d35'); pxRect(x+42,137,18,20,'#4e5e65');
            for(let q=0;q<5;q++) pxRect(x+39+q*23,178,12,9,q%2?'#9a7d3a':'#477a83');
        } else if (lvl === 4) { // destroyed city
            pxRect(x+25,170-r*55,90,110+r*55,'#3b302e'); pxRect(x+36,188-r*55,17,19,'#8c482e'); pxRect(x+73,206-r*55,21,13,'#251c1c');
        } else if (lvl === 5) { // bio lab
            pxRect(x+35,168,108,96,'#28433c'); pxRect(x+50,186,22,58,'#5b8d7c'); pxRect(x+91,177,30,67,'#2f6d62');
            ctx.fillStyle='#6ce6a5'; ctx.beginPath(); ctx.arc(x+106,198,8,0,Math.PI*2); ctx.fill();
        } else if (lvl === 7) { // volcano
            ctx.fillStyle='#2b2527'; ctx.beginPath(); ctx.moveTo(x,264); ctx.lineTo(x+98,112); ctx.lineTo(x+190,264); ctx.closePath(); ctx.fill();
            pxRect(x+84,125,28,6,'#d24a24'); pxRect(x+90,118,18,5,'#ff8b32');
        } else if (lvl === 10) { // nexus
            pxRect(x+34,124,10,142,'#453066'); pxRect(x+145,124,10,142,'#453066'); pxRect(x+34,124,121,9,'#7350a0');
            ctx.fillStyle='#9ce8ff'; ctx.beginPath(); ctx.arc(x+95,169,14,0,Math.PI*2); ctx.fill();
        }
    }
    ctx.restore();
}

function drawForegroundScenery() {
    // Deterministic low-cost scenery: vegetation, sandbags and occasional tree trunks.
    const start = Math.floor((cameraX - 120) / 105) * 105;
    const end = cameraX + canvas.width + 140;
    for (let x = start; x < end; x += 105) {
        const r = sceneSeed(x, 3);
        const detail = sceneSeed(x, 44);
        if (detail < 0.12) {
            const gy = groundYAt(x+18);
            if ([3,5,6,9,10].includes(currentLevel)) {
                pxRect(x+3, gy-7, 38, 8, '#555b5e'); pxRect(x+7, gy-10, 29, 4, '#777d7f');
                pxRect(x+15, gy-11, 2, 11, '#2e3234');
            } else if ([4,7].includes(currentLevel)) {
                pxRect(x+4, gy-8, 13, 8, '#3c3331'); pxRect(x+18, gy-12, 19, 12, '#51433d'); pxRect(x+31, gy-6, 12, 6, '#2a2524');
            } else {
                pxRect(x+2, gy-3, 44, 4, '#8b7650'); pxRect(x+9, gy-6, 7, 3, '#aa9261'); pxRect(x+28, gy-5, 10, 2, '#c0a870');
            }
        } else if (r < 0.28) {
            // Grass tufts in front of boots.
            const y = 274;
            pxRect(x+8, y-5, 2, 7, '#31522b');
            pxRect(x+13, y-9, 2, 11, '#496d36');
            pxRect(x+18, y-6, 2, 8, '#274824');
            pxRect(x+23, y-11, 2, 13, '#5e7b3d');
        } else if (r < 0.48) {
            // Bush.
            pxRect(x, 259, 42, 17, '#1b3825');
            pxRect(x+7, 251, 30, 19, '#285131');
            pxRect(x+14, 247, 17, 12, '#3e6638');
            pxRect(x+4, 266, 35, 7, '#142a1c');
        } else if (r < 0.61) {
            // Sandbags.
            for (let row=0; row<2; row++) {
                for (let b=0; b<3-row; b++) {
                    const bx=x + b*15 + row*7;
                    const by=264-row*8;
                    pxRect(bx, by, 14, 7, '#8a754b');
                    pxRect(bx+2, by+1, 10, 2, '#b09a68');
                    pxRect(bx+1, by+6, 12, 2, '#5e5036');
                }
            }
        } else if (r < 0.70) {
            // Tree/trunk, kept sparse so it does not hide gameplay too often.
            pxRect(x+14, 202, 13, 74, '#4b3424');
            pxRect(x+18, 202, 5, 74, '#72503a');
            pxRect(x-4, 194, 52, 18, '#173820');
            pxRect(x+3, 182, 41, 21, '#24512d');
            pxRect(x+14, 175, 28, 18, '#35653a');
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'MENU') {
        ctx.fillStyle = '#f39c12';
        ctx.font = 'bold 24px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('SUPER RETRO ALIEN WARS', canvas.width/2, 75);
        ctx.fillStyle = '#fff';
        ctx.font = '11px Courier New';
        ctx.fillText('MOVE: ARROW KEYS / W,A,S,D / ON-SCREEN JOYSTICK', canvas.width/2, 115);
        ctx.fillText('SPACE: JUMP   SHIFT: FIRE   DOWN+SPACE: DROP', canvas.width/2, 145);
        ctx.fillText('16-BIT RUN-AND-GUN EDITION (DUCK, AIM, BLAST THROUGH)', canvas.width/2, 175);
        ctx.fillText('PRESS SPACE / SHIFT / GAMEPAD BUTTON TO START', canvas.width/2, 220);
        ctx.fillText('GAMEPAD: STICK/D-PAD MOVE • A JUMP • X/TRIGGER FIRE', canvas.width/2, 260);
        return;
    }

    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 30px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
        ctx.fillStyle = '#fff';
        ctx.font = '13px Courier New';
        ctx.fillText('PRESS SPACE OR SHIFT TO RESTART', canvas.width/2, canvas.height/2 + 40);
        return;
    }

    if (gameState === 'VICTORY') {
        ctx.fillStyle = '#2ecc71';
        ctx.font = 'bold 24px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText('MISSION COMPLETE! EARTH IS SAVED.', canvas.width/2, canvas.height/2);
        ctx.fillStyle = '#fff';
        ctx.font = '13px Courier New';
        ctx.fillText('PRESS SPACE OR SHIFT TO RESTART', canvas.width/2, canvas.height/2 + 40);
        return;
    }

    let theme = LEVEL_THEMES[(currentLevel - 1) % LEVEL_THEMES.length];

    const sky = ctx.createLinearGradient(0, 0, 0, 276);
    sky.addColorStop(0, '#24152d');
    sky.addColorStop(0.38, theme.skyTop);
    sky.addColorStop(0.72, '#d85a27');
    sky.addColorStop(1, '#f4b45f');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawCloudsAndSmoke();
    drawLevelSpecificBackdrop();

    ctx.save();
    ctx.translate(-cameraX * 0.08, 0);
    for (let i = -200; i < STAGE_LENGTH + 600; i += 170) {
        const y = 55 + ((i / 170) % 3) * 18;
        pxRect(i, y, 95, 7, 'rgba(74,29,31,.55)');
        pxRect(i + 18, y - 5, 52, 6, 'rgba(255,176,83,.38)');
        pxRect(i + 65, y + 7, 70, 5, 'rgba(98,35,28,.45)');
    }
    ctx.restore();

    ctx.save();
    ctx.translate(-cameraX * 0.14, 0);
    const bgMode = (currentLevel - 1) % 4;
    if (bgMode === 0) {
        // Layered jungle hills and distant tree line.
        for (let i = -250; i < STAGE_LENGTH + 600; i += 180) {
            const h = 45 + sceneSeed(i, 8) * 55;
            ctx.fillStyle = '#253c2c';
            ctx.beginPath(); ctx.ellipse(i + 90, 245, 125, h, 0, Math.PI, 0, false); ctx.fill();
            pxRect(i + 35, 180 - h*0.15, 10, 70 + h*0.25, '#314332');
            pxRect(i + 10, 172 - h*0.15, 62, 22, '#31573a');
        }
    } else if (bgMode === 1) {
        // Rocky wasteland/mountain silhouettes.
        ctx.fillStyle = '#352d38';
        for (let i = -220; i < STAGE_LENGTH + 700; i += 230) {
            const mh = 65 + sceneSeed(i, 9) * 75;
            ctx.beginPath(); ctx.moveTo(i, 276); ctx.lineTo(i+75, 276-mh); ctx.lineTo(i+135, 220-mh*0.25); ctx.lineTo(i+220,276); ctx.closePath(); ctx.fill();
            pxRect(i+72, 276-mh+15, 38, 5, 'rgba(192,125,83,.25)');
        }
    } else if (bgMode === 2) {
        // Industrial base/factory skyline.
        for (let i = -200; i < STAGE_LENGTH + 500; i += 110) {
            const h = 65 + ((i / 110) % 4) * 13;
            const by = 210 - h;
            pxRect(i, by, 70, h + 66, '#26343a');
            pxRect(i+8, by-15, 11, 16, '#3e474b');
            for (let wx=i+8; wx<i+60; wx+=14) for (let wy=by+12; wy<250; wy+=18) pxRect(wx,wy,8,10,(wx+wy)%3===0?'#d9ad55':'#46555b');
        }
    } else {
        // Alien terrain: uneven organic towers and glowing distant pools.
        for (let i = -180; i < STAGE_LENGTH + 550; i += 150) {
            const hh = 45 + sceneSeed(i, 10) * 85;
            pxRect(i+45, 255-hh, 28, hh+21, '#3b2944');
            ctx.fillStyle='#53345f'; ctx.beginPath(); ctx.ellipse(i+59,255-hh,28,16,0,0,Math.PI*2); ctx.fill();
            pxRect(i+52, 242-hh, 14, 5, '#8c6ca0');
        }
    }
    ctx.restore();


    ctx.save();
    ctx.translate(-cameraX, 0);

    let drawStart = cameraX - 50;
    let drawEnd = cameraX + canvas.width + 50;
    
    let pMap = platforms.filter(p => p.type === 'pit');
    pMap.sort((a,b) => a.x - b.x);

    // Deep, dangerous-looking chasms beneath gaps in the ground.
    for (const pit of pMap) {
        if (pit.x + pit.w < drawStart || pit.x > drawEnd) continue;
        const pg = ctx.createLinearGradient(0, 276, 0, 360);
        pg.addColorStop(0, '#171014');
        pg.addColorStop(0.35, '#08080b');
        pg.addColorStop(1, '#000000');
        ctx.fillStyle = pg;
        ctx.fillRect(pit.x, 276, pit.w, 84);
        pxRect(pit.x, 276, pit.w, 5, '#15191a');
        for (let sx = pit.x + 5; sx < pit.x + pit.w - 4; sx += 13) {
            ctx.fillStyle = '#050607';
            ctx.beginPath(); ctx.moveTo(sx, 281); ctx.lineTo(sx + 5, 296 + ((sx|0)%9)); ctx.lineTo(sx + 10, 281); ctx.fill();
        }
        for (let sy = 310; sy < 352; sy += 14) {
            pxRect(pit.x + 7 + ((sy * 3) % Math.max(10, pit.w - 18)), sy, 5, 2, '#42191a');
        }
    }

    let renderSegments = [];
    let lastEdge = 0;
    for (let pit of pMap) {
        if (pit.x > lastEdge) {
            renderSegments.push({ start: lastEdge, end: pit.x });
        }
        lastEdge = pit.x + pit.w;
    }
    renderSegments.push({ start: lastEdge, end: STAGE_LENGTH + 500 });

    for (let seg of renderSegments) {
        if (seg.end > drawStart && seg.start < drawEnd) {
            // Actual rolling terrain: this same curve is used by player/enemy floor collision.
            ctx.fillStyle = '#29351f';
            ctx.beginPath();
            ctx.moveTo(seg.start, 360);
            ctx.lineTo(seg.start, groundYAt(seg.start));
            for (let gx = seg.start + 8; gx <= seg.end; gx += 8) ctx.lineTo(gx, groundYAt(gx));
            ctx.lineTo(seg.end, 360); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = '#68854b'; ctx.lineWidth = 5; ctx.beginPath();
            ctx.moveTo(seg.start, groundYAt(seg.start));
            for (let gx = seg.start + 8; gx <= seg.end; gx += 8) ctx.lineTo(gx, groundYAt(gx));
            ctx.stroke();

            for (let gx = Math.floor(seg.start / 24) * 24; gx < seg.end; gx += 24) {
                const gy = groundYAt(gx + 8);
                const seed = Math.abs(Math.floor(gx * 17.31)) % 9;
                pxRect(gx, gy + 11 + (seed%3), 15, 5, '#3b4528');
                pxRect(gx + 8, gy + 28 + (seed % 5), 19, 6, '#1e291b');
                if (seed % 3 === 0) pxRect(gx + 3, gy - 4, 3, 5, '#687647');
            }
        }
    }

    for (let l of platforms) {
        if (l.type === 'ledge') {
            pxRect(l.x, l.y, l.w, l.h, '#46533a');
            pxRect(l.x, l.y, l.w, 5, '#77805a');
            pxRect(l.x + 5, l.y + 7, l.w - 10, 5, '#303b2a');
            // Ragged grassy lip with roots hanging beneath the ledge.
            for (let gx = l.x + 4; gx < l.x + l.w - 3; gx += 11) {
                const gh = 3 + ((gx|0) % 5);
                pxRect(gx, l.y - gh, 2, gh + 1, '#4f7539');
                if (((gx/11)|0) % 2 === 0) pxRect(gx + 4, l.y - gh + 2, 2, gh - 1, '#76924c');
                if (((gx/11)|0) % 3 === 0) pxRect(gx + 2, l.y + l.h, 2, 5 + (gx % 7), '#252f22');
            }
            pxRect(l.x + 2, l.y, l.w - 4, 2, '#89a85a');
        }
    }

    for (let h of hazards) {
        if (h.type === 'water') {
            const wt = performance.now() * 0.004;
            const wg = ctx.createLinearGradient(0, h.y, 0, h.y + h.h);
            wg.addColorStop(0, 'rgba(83,198,232,.92)');
            wg.addColorStop(.35, 'rgba(23,118,164,.93)');
            wg.addColorStop(1, 'rgba(8,53,91,.98)');
            ctx.fillStyle = wg;
            ctx.fillRect(h.x, h.y + 3, h.w, h.h - 3);
            // Animated pixel-wave crests and dark troughs.
            for (let wx = h.x; wx < h.x + h.w; wx += 13) {
                const wy = h.y + 3 + Math.sin(wt + wx * 0.11) * 2;
                pxRect(wx, wy, 9, 2, 'rgba(183,242,255,.86)');
                pxRect(wx + 5, wy + 7, 8, 2, 'rgba(15,82,128,.72)');
            }
            pxRect(h.x, h.y + h.h - 3, h.w, 3, 'rgba(5,35,63,.9)');
        } else {
            ctx.fillStyle = '#e74c3c';
            ctx.beginPath();
            ctx.moveTo(h.x, h.y + h.h);
            ctx.lineTo(h.x + h.w/2, h.y);
            ctx.lineTo(h.x + h.w, h.y + h.h);
            ctx.closePath();
            ctx.fill();
        }
    }

    for (let pk of pickups) drawWingPickup(pk);

    if (boss && boss.active) drawBossVehicle(boss);

    for (let e of enemies) drawEnemy(e);

    if (p1.active) drawCommando(p1);
    if (p2.active) drawCommando(p2);

    for (let os of oilStains) {
        pxRect(os.x - os.w/2, os.y, os.w, os.h, '#111619');
        if (os.w > 7) pxRect(os.x, os.y, Math.max(2,os.w*.35), 1, '#43505a');
    }
    for (let op of oilParticles) {
        pxRect(op.x - 1, op.y - 1, op.size + 2, op.size + 2, '#090b0c');
        pxRect(op.x, op.y, op.size, op.size, '#252d31');
        if (op.vy > 1.3) pxRect(op.x, op.y - 3, Math.max(1,op.size-1), 3, '#111719');
    }

    for (let bs of bloodStains) {
        pxRect(bs.x - bs.w/2, bs.y, bs.w, bs.h, '#650812');
        if (bs.w > 7) pxRect(bs.x - 1, bs.y - 1, 3, 1, '#a91220');
    }
    for (let bp of bloodParticles) {
        // Dark rim + brighter core makes each droplet read as a chunky 16-bit splatter.
        pxRect(bp.x - 1, bp.y - 1, bp.size + 2, bp.size + 2, '#4b050b');
        pxRect(bp.x, bp.y, bp.size, bp.size, bp.shade || '#c20d22');
        if (bp.vy > 1.5) pxRect(bp.x, bp.y - 3, Math.max(1, bp.size - 1), 3, '#840912');
    }

    for (let b of bullets) {
        const dir = b.vx >= 0 ? 1 : -1;
        if (!b.fromPlayer) {
            if (b.type === 'plasma_enemy') {
                ctx.fillStyle = '#a9f4ff'; ctx.beginPath(); ctx.arc(b.x + 3, b.y + 2, 4, 0, Math.PI*2); ctx.fill();
                pxRect(b.x - dir*5, b.y + 1, 6, 2, '#3a8fa5');
            } else {
                pxRect(b.x - dir*5, b.y + 1, 7, 2, '#8e2f20');
                pxRect(b.x, b.y, 6, 4, '#ff8a38');
                pxRect(b.x + (dir>0?4:-2), b.y + 1, 3, 2, '#ffe36a');
            }
        } else if (b.type === 'laser') {
            pxRect(b.x - dir*7, b.y + 1, 9, 2, '#166f42');
            pxRect(b.x, b.y, dir*14, 3, '#6dffad');
            pxRect(b.x + dir*10, b.y + 1, dir*5, 1, '#ffffff');
        } else if (b.type === 'missile') {
            pxRect(b.x - dir*5, b.y + 1, 5, 3, '#ff9f2f');
            pxRect(b.x, b.y, dir*10, 5, '#d94b3e');
            pxRect(b.x + dir*7, b.y + 1, dir*4, 3, '#d9dfe3');
        } else if (b.type === 'flame') {
            ctx.fillStyle = Math.random() < 0.5 ? '#ff6a22' : '#ffe35d';
            ctx.beginPath(); ctx.arc(b.x + 2, b.y + 2, 3 + Math.random()*2, 0, Math.PI*2); ctx.fill();
        } else if (b.type === 'spread') {
            pxRect(b.x - dir*4, b.y + 1, 4, 2, '#168d97');
            ctx.fillStyle = '#76f6ff'; ctx.beginPath(); ctx.arc(b.x + 2, b.y + 2, 3, 0, Math.PI*2); ctx.fill();
        } else {
            pxRect(b.x - dir*5, b.y + 1, 6, 2, '#9d6a1d');
            pxRect(b.x, b.y, 7, 3, '#ffd75e');
            pxRect(b.x + (dir>0?5:-1), b.y, 2, 3, '#fff5b0');
        }
    }
    drawForegroundScenery();
    ctx.restore();

    document.getElementById('p1-hud').innerText = `[P1 LIVES: ${p1.life}] [CONT: ${p1.continues}] [WPN: ${WEAPON_NAMES[p1.weapon][0]}]`;
    document.getElementById('p2-hud').innerText = p2.active ? `[P2 LIVES: ${p2.life}] [CONT: ${p2.continues}] [WPN: ${WEAPON_NAMES[p2.weapon][0]}]` : `[PRESS C TO JOIN P2]`;
    document.getElementById('level-hud').innerText = `[STAGE ${currentLevel}: ${theme.name}]`;
}

function mainLoop() {
    updateGame();
    draw();
    requestAnimationFrame(mainLoop);
}

requestAnimationFrame(mainLoop);
</script>

</body>
