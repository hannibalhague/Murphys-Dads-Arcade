let audioCtx=null,audioReady=false,musicTimer=null,musicStep=0,muted=false;
const gameMusic=new Audio('mp3/1.mp3');gameMusic.loop=true;gameMusic.preload='auto';gameMusic.volume=.42;
function ensureAudio(){
 if(!audioReady){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume?.();audioReady=true}catch(e){}}
 startMusic();
}
function tone(freq,dur=.08,type='square',gain=.025,slide=0){
 if(!audioReady||muted)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;
 o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(35,freq+slide),t+dur);
 g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur)
}
function noise(dur=.08,gain=.02){
 if(!audioReady||muted)return;const n=Math.floor(audioCtx.sampleRate*dur),buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
 const s=audioCtx.createBufferSource(),g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
 s.buffer=buf;f.type='bandpass';f.frequency.value=1000;g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
 s.connect(f);f.connect(g);g.connect(audioCtx.destination);s.start()
}
function sfx(n){
 ensureAudio();
 if(!audioReady||muted)return;
 if(n==='shot'){
   noise(.028,.032);
   tone(150,.055,'sawtooth',.022,-68);
   tone(980,.016,'square',.010,-460);
   setTimeout(()=>tone(74,.045,'triangle',.010,-18),12);
 }
 else if(n==='enemy'){
   noise(.03,.020);
   tone(118,.06,'sawtooth',.018,-42);
 }
 else if(n==='jump'){
   // Heavier combat-boot takeoff: low thump, gritty scrape, short metallic snap.
   noise(.045,.026);
   tone(92,.075,'sawtooth',.030,-28);
   tone(155,.045,'square',.018,-38);
   setTimeout(()=>tone(62,.07,'triangle',.020,-10),18);
 }
 else if(n==='double'){
   noise(.05,.028);
   tone(112,.08,'sawtooth',.032,-35);
   tone(185,.055,'square',.020,-45);
   setTimeout(()=>tone(78,.08,'triangle',.021,-14),20);
 }
 else if(n==='hit'){noise(.06,.034);tone(96,.07,'square',.022,-35)}
 else if(n==='explode'){
   noise(.24,.060);
   tone(82,.20,'sawtooth',.036,-42);
   setTimeout(()=>noise(.11,.026),55);
 }
 else if(n==='boss'){
   tone(68,.30,'sawtooth',.043,-16);
   setTimeout(()=>tone(51,.22,'square',.018,-8),90);
 }
 else if(n==='pickup'){
   tone(540,.07,'square',.022,160);
   setTimeout(()=>tone(760,.08,'triangle',.018,110),55);
 }
}

function setupAdventureFeatures(){

      let L={x:spec.x+side,y,w,h:18,upper:true,structure:f===spec.floors-1?'bunker':null,tower:true,towerId:ti,floor:f};

        if((f+ti)%2===0){let e=spawnEnemy(L.x+(f%2?28:-28),enemyType);placeEnemyOnLedge(e,L)}
      }

    }
    // A rescued prisoner high in each tower gives you a reason to climb.
    let hostageFloor=floors[Math.max(2,floors.length-2)];
    if(hostageFloor)state.hostages.push({x:hostageFloor.x,y:hostageFloor.y-35,rescued:false,anim:ti+10,upper:true});

  });

  // Long ziplines now start from places that are genuinely above the old screen.
  state.ziplines=[
    {x1:1518,y1:-250,x2:2140,y2:-45,speed:.55},
    {x1:3070,y1:-475,x2:3670,y2:-180,speed:.53},
    {x1:4395,y1:-355,x2:4980,y2:-115,speed:.56}
  ];

  // Rocket platforms travel through the vertical space and act as elevators.
  [
    [1040,255,112,65,115],
    [2380,-95,120,72,145],
    [2860,-420,112,60,125],
    [3860,-235,125,78,150],
    [4720,-520,110,62,135]
  ].forEach((a,i)=>state.movingPlatforms.push({x:a[0],baseX:a[0],y:a[1],baseY:a[1],w:a[2],h:16,phase:i*1.7,range:a[3],verticalRange:a[4],vx:0,prevX:a[0],prevY:a[1],upper:a[1]<0}));

  // Ground hostages remain, while tower hostages above reward exploration.
  [1280,2730,4190].forEach((x,i)=>{let y=terrainY(x);if(y<9000)state.hostages.push({x,y:y-26,rescued:false,anim:i});});

  // Wildlife: harmless farm animals/birds plus dangerous boars and snakes.

  const types=['chicken','pig','bird','cow','chicken','pig','bird','cow','chicken','boar','pig','bird','cow','chicken','snake'];

function updateMovingPlatforms(dt){

  let p=state.p;if(!p||p.dead>0)return;for(let m of state.movingPlatforms){let top=m.y-m.h/2;if(p.vy>=0&&Math.abs((p.y+p.h/2)-top)<10&&p.x>m.x-m.w/2&&p.x<m.x+m.w/2){p.x+=m.x-m.prevX;p.y+=m.y-m.prevY;p.on=true;p.vy=0}}
}
function updateAdventureFeatures(dt){
  let p=state.p;
  for(let h of state.hostages){
    if(h.exploded)continue;
    h.anim+=dt*(h.rescued?7:4);
    if(h.rescued){h.rescueAnim=(h.rescueAnim||0)+dt;continue;}
    if(h.timer==null)h.timer=h.upper?50:45; // forgiving timer
    if(h.armed==null)h.armed=false;
    // The countdown only starts when you get reasonably close, so distant hostages don't die unfairly.
    let hd=Math.hypot(p.x-h.x,p.y-h.y);
    if(!h.armed&&hd<620){h.armed=true;sfx('pickup')}
    if(h.armed)h.timer=Math.max(0,h.timer-dt);
    if(h.timer<=0){
      h.exploded=true;state.shake=.22;burst(h.x,h.y,'orange');addStain(h.x,h.y+16,'soot');sfx('explode');
      for(let i=0;i<18;i++)pfx({x:h.x,y:h.y,vx:(Math.random()-.5)*180,vy:-40-Math.random()*180,g:300,life:.7+Math.random()*.45,size:2+Math.random()*3,col:'#ff9b3d'});
      if(Math.abs(p.x-h.x)<85&&Math.abs(p.y-h.y)<95)hurtPlayer(1,h.x);
      continue;
    }
    if(Math.abs(p.x-h.x)<38&&Math.abs(p.y-h.y)<50){
      h.rescued=true;h.rescueAnim=0;h.timer=999;state.rescued++;state.score+=900;sfx('pickup');for(let i=0;i<18;i++)sparks(h.x,h.y,'gold')
    }
  }
  for(let c of state.critters){
    if(c.dead){
      c.dead=Math.max(0,c.dead-dt);c.vy=(c.vy||0)+GRAV*.72*dt;c.x+=(c.vx||0)*dt;c.y+=(c.vy||0)*dt;c.deathRot=(c.deathRot||0)+(c.vx>=0?1:-1)*dt*4.5;
      let gy=terrainY(c.x);if(gy<9000&&c.y+c.h/2>=gy){c.y=gy-c.h/2;c.vy=0;c.vx*=Math.pow(.04,dt);c.deathRot+=(Math.PI*.5-c.deathRot)*Math.min(1,dt*9)}
      continue;
    }
    if(c.hitCooldown>0)c.hitCooldown=Math.max(0,c.hitCooldown-dt);
    if(c.behaviorT==null){c.behaviorT=.5+Math.random()*2;c.homeX=c.x;c.gait=Math.random()*6;c.peckT=0}
    c.behaviorT-=dt;c.peckT=Math.max(0,(c.peckT||0)-dt);c.anim+=dt*(c.type==='bird'?8:c.hostile?8:3.5);let dx=p.x-c.x,dist=Math.abs(dx);

    if(c.type==='bird'){
      // Birds glide, flap, bank away from the player and vary altitude instead of moving on a rigid sine.
      if(c.behaviorT<=0){c.behaviorT=1.3+Math.random()*2.4;if(Math.random()<.35)c.face*=-1;c.baseY=Math.max(120,Math.min(330,c.baseY+(Math.random()-.5)*70))}
      let flee=dist<150;if(flee)c.face=dx>0?-1:1;
      let speed=flee?72:38+Math.sin(c.anim*.37)*8;
      c.x+=c.face*speed*dt;c.y+=(c.baseY+Math.sin(c.anim*.72)*16-c.y)*Math.min(1,dt*2.2);
      if(c.x<state.cam-130)c.face=1;if(c.x>state.cam+W+210)c.face=-1;
      continue
    }

    if(c.hostile&&dist<205){
      c.face=dx<0?-1:1;
      let target=c.type==='boar'?108:58;
      c.vx+=(c.face*target-c.vx)*Math.min(1,dt*(c.type==='boar'?5.5:4));
      if(dist<(c.type==='boar'?32:24)&&c.hitCooldown<=0){hurtPlayer(1,c.x);c.hitCooldown=1.15}
    }else if(dist<125&&!c.hostile){
      // Harmless animals notice the player, hesitate, then move away.
      c.face=dx>0?-1:1;
      let fleeSpeed=c.type==='chicken'?72:c.type==='pig'?54:c.type==='cow'?40:46;
      c.vx+=(c.face*fleeSpeed-c.vx)*Math.min(1,dt*4.5);
    }else{
      // Idle/wander behaviour: cows amble, pigs trot, chickens peck and scurry.
      if(c.behaviorT<=0){
        c.behaviorT=.8+Math.random()*2.5;
        if(Math.random()<.45)c.face*=-1;
        if(c.type==='chicken'&&Math.random()<.55)c.peckT=.35+Math.random()*.35;
      }
      let wander=c.peckT>0?0:(c.type==='cow'?16:c.type==='pig'?25:c.type==='chicken'?31:22);
      if(Math.abs(c.x-c.homeX)>155)c.face=c.x>c.homeX?-1:1;

      if(c.type==='chicken'&&dist<125&&impact<70&&Math.random()<dt*2.0)c.vy=-135;
    }
    if(c.y>H+80)c.dead=.01;
  }
}

function startBossExtraction(b){

 else{state.clear=true;state.victorySeq=null;}
}
function updateVictorySequence(dt){
 let v=state.victorySeq;if(!v)return;v.t+=dt;
 let p=state.p,m=v.man,h=v.heli;

 if(v.phase===0){
   // Slow-motion ejection from the destroyed boss vehicle.
   m.pose+=dt*7;
   m.spin+=dt*2.6;
   m.vy+=GRAV*.43*dt;
   m.x+=m.vx*dt;
   m.y+=m.vy*dt;
   let gy=terrainY(m.x);if(gy>9000)gy=v.groundY;
   if(m.y+m.h/2>=gy){
     m.y=gy-m.h/2;m.vy=0;m.vx*=.55;m.on=true;
     v.phase=1;v.t=0;sfx('hit');dust(m.x,gy-2);
   }
 }
 else if(v.phase===1){
   // Player must reach the suited target.
   m.face=p.x<m.x?-1:1;
   if(Math.hypot(p.x-m.x,p.y-m.y)<52){
     v.phase=2;v.t=0;v.struck=false;v.dripClock=0;
     p.face=m.x>=p.x?1:-1;
     p.vx=0;p.vy=0;p.on=true;p.flipActive=false;p.flip=0;
     p.meleeSide=p.face;p.meleeDuration=.96;p.meleeAnim=.96;p.meleeCooldown=2;p.meleeDX=p.face;p.meleeDY=-.04;p.meleeHit=false;p.meleeTarget=null;
     state.shake=.08;
   }
 }
 else if(v.phase===2){
   // Cinematic beheading beat.
   let standX=m.x-p.face*34,targetY=terrainY(standX)-p.h/2;
   if(targetY<9000){p.y+=(targetY-p.y)*Math.min(1,dt*10);p.on=true;p.vy=0;}
   p.x+=(standX-p.x)*Math.min(1,dt*10);

   if(v.t>.42&&!v.struck){
     v.struck=true;m.dead=true;
     v.head={x:m.x+p.face*3,y:m.y-37,vx:p.face*34,vy:-56,r:-p.face*.30,held:false};
     state.heads=(state.heads||0)+1;state.campaignHeads=state.heads;
     state.score+=2500;state.shake=.22;sfx('hit');
     bloodBurst(m.x,m.y-28);bloodBurst(m.x+p.face*2,m.y-30);
     for(let i=0;i<(lowPowerMode?8:18);i++)goreDrip(m.x,m.y-31,1,16,110);
     addStain(m.x,Math.min(terrainY(m.x)-2,m.y+25),'blood');
   }
   if(v.struck){
     if(v.head&&!v.head.held){
       v.head.vy+=GRAV*.12*dt;
       v.head.x+=v.head.vx*dt;
       v.head.y+=v.head.vy*dt;
       v.head.r+=dt*1.25*p.face;
     }
     v.dripClock+=dt;
     let dripRate=lowPowerMode?.08:.045;
     while(v.dripClock>dripRate){
       v.dripClock-=dripRate;
       goreDrip(m.x,m.y-26,2,14,92);
       if(v.head)goreDrip(v.head.x,v.head.y+10,1,10,60);
     }
     if(v.t>1.28&&v.head){
       v.head.held=true;
       v.phase=3;v.t=0;
       startFireworks();sfx('pickup');
     }
   }
 }
 else if(v.phase===3){
   // Trophy hold with continuous blood drips.
   if(v.head){
     v.head.held=true;
     v.head.x=p.x+p.face*7;
     v.head.y=p.y-42;
   }
   v.dripClock+=dt;
   if(v.dripClock>(lowPowerMode?.10:.055)){
     v.dripClock=0;
     goreDrip(m.x,m.y-24,2,12,75);
     if(v.head)goreDrip(v.head.x,v.head.y+12,1,9,48);
   }
   h.rotor+=dt*25;
   if(v.t>1.95){v.phase=4;v.t=0}
 }
 else if(v.phase===4){
   if(v.head){
     v.head.held=true;
     v.head.x=p.x+p.face*7;
     v.head.y=p.y-42;
   }
   v.dripClock+=dt;
   if(v.dripClock>(lowPowerMode?.12:.06)){
     v.dripClock=0;
     goreDrip(m.x,m.y-24,1,10,62);
     if(v.head)goreDrip(v.head.x,v.head.y+12,1,8,42);
   }
   h.rotor+=dt*28;
   h.y+=(h.targetY-h.y)*Math.min(1,dt*1.65);
   h.x+=(Math.max(state.cam+W*.70,p.x+215)-h.x)*Math.min(1,dt*.9);
   let top=h.y+30,bottom=Math.min(h.y+178,420);
   if(h.y>85&&Math.abs(p.x-h.x)<30&&p.y>top-20&&p.y<bottom+38){
     v.phase=5;v.t=0;p.vx=0;p.vy=0;sfx('pickup');startFireworks();
   }
 }
 else if(v.phase===5){
   h.rotor+=dt*34;
   h.x+=185*dt;h.y-=82*dt;
   p.x=h.x;p.y=h.y+166;p.vx=185;p.vy=-82;p.on=false;p.climb=true;p.climbAnim+=dt*10;
   if(v.head){
     v.head.held=true;
     v.head.x=p.x+p.face*6;
     v.head.y=p.y-40;
   }
   if(state.fireworks.length<6)startFireworks();
   state.cam+=(Math.max(0,Math.min(WORLD-W,p.x-440))-state.cam)*Math.min(1,dt*3.5);
   state.camY+=(Math.max(WORLD_TOP,Math.min(0,p.y-H*.54))-state.camY)*Math.min(1,dt*3);
   if(v.t>3.0)advanceAfterExtraction();
 }
}
