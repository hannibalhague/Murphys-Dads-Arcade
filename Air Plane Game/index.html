<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panic at 30,000 Feet</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0505;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Full Screen Responsive Game Wrapper Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020408;
        }

        canvas {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            object-fit: contain;
            background: #020408;
            display: block;
        }
        
        /* On-Screen Center Top Mute Button */
        #btn-mute {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100000;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid rgba(56, 189, 248, 0.5);
            color: #38bdf8;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            pointer-events: auto;
        }

        #btn-mute.muted {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.8);
            color: #ef4444;
        }

        #btn-mute:active, #btn-mute.pressed {
            transform: translateX(-50%) scale(0.95);
        }

        .controls-info {
            position: absolute;
            bottom: 5px;
            width: 100%;
            color: rgba(255, 170, 136, 0.7);
            font-size: 0.75rem;
            text-align: center;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Mobile Touch Controls Overlay - Highly Responsive Virtual Joystick D-Pad */
        #touch-controls {
            position: fixed;
            bottom: 15px;
            left: 0;
            width: 100%;
            height: 200px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 99999;
            pointer-events: none;
            opacity: 0.85;
            transition: opacity 0.1s ease;
        }

        #touch-controls:active, #touch-controls:hover {
            opacity: 1;
        }
        
        .touch-group {
            position: relative;
            width: 170px;
            height: 170px;
            pointer-events: auto;
        }
        
        /* Virtual Joystick Base Container */
        #virtual-joystick-base {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            touch-action: none;
        }

        /* Virtual Joystick Floating Thumbstick Knob */
        #virtual-joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 70px;
            height: 70px;
            margin-top: -35px;
            margin-left: -35px;
            border-radius: 50%;
            background: rgba(255, 85, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.6);
            pointer-events: none;
            transition: transform 0.05s linear;
        }

        #virtual-joystick-knob.active {
            background: rgba(255, 85, 0, 0.85);
            border-color: #ffffff;
        }

        /* Larger Action Button Cluster for Mobile */
        #action-controls {
            display: flex;
            align-items: center;
            pointer-events: auto;
            margin-right: 10px;
            margin-bottom: 15px;
        }
        
        .action-btn {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            background: rgba(255, 51, 0, 0.25);
            border: 2px solid rgba(255, 51, 0, 0.6);
            color: rgba(255, 255, 255, 0.95);
            font-weight: bold;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            touch-action: none;
        }
        
        .action-btn.pressed, .action-btn:active {
            background: rgba(255, 85, 0, 0.9);
            border-color: #ff5500;
            color: #ffffff;
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <!-- On-Screen Center Top Mute Button -->
    <div id="btn-mute">🔊 AUDIO: ON</div>

    <!-- Fullscreen Wrapper Container -->
    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
    </div>

    <div class="controls-info">
        <strong>CONTROLS</strong> Virtual Joystick / Keyboard | UNIFIED ACTION | <strong>C</strong> Wardrobe
    </div>

    <!-- On-Screen Touch Controls Overlay with Virtual Joystick -->
    <div id="touch-controls">
        <div class="touch-group" id="dpad">
            <div id="virtual-joystick-base">
                <div id="virtual-joystick-knob"></div>
            </div>
        </div>
        <div id="action-controls">
            <div class="action-btn" id="btn-action">SPACE</div>
        </div>
    </div>

    <!-- Modular Script Inclusions -->
    <script src="config.js"></script>
    <script src="audio.js"></script>
    <script src="emergencies.js"></script>
    <script src="plane.js"></script>
    <script src="npcs.js"></script>
    <script src="player.js"></script>
    <script src="level1.js"></script>
    <script src="level2.js"></script>
    <script src="level3.js"></script>
    <script src="input.js"></script>
    <script src="game.js"></script>

    <!-- Perfectly Labeled & Strict Anti-Drift Joystick Script Integration -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const base = document.getElementById('virtual-joystick-base');
            const knob = document.getElementById('virtual-joystick-knob');
            
            if (!base || !knob) return;

            let activeTouchId = null;
            const maxRadius = 55;

            window.virtualJoystickState = {
                x: 0,
                y: 0,
                active: false
            };

            function updateJoystick(clientX, clientY) {
                const rect = base.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let deltaX = clientX - centerX;
                let deltaY = clientY - centerY;
                const distance = Math.hypot(deltaX, deltaY);

                if (distance > maxRadius) {
                    deltaX = (deltaX / distance) * maxRadius;
                    deltaY = (deltaY / distance) * maxRadius;
                }

                knob.style.transform = `translate(${deltaX}px, ${deltaY}px)`;

                window.virtualJoystickState.x = deltaX / maxRadius;
                window.virtualJoystickState.y = deltaY / maxRadius;
                window.virtualJoystickState.active = true;
            }

            function resetJoystick() {
                activeTouchId = null;
                knob.style.transform = `translate(0px, 0px)`;
                knob.classList.remove('active');
                window.virtualJoystickState.x = 0;
                window.virtualJoystickState.y = 0;
                window.virtualJoystickState.active = false;

                // Force input directions and player velocities immediately to 0 to prevent any lingering drift
                activeInputs.xDir = 0;
                activeInputs.yDir = 0;
                if (typeof player !== 'undefined') {
                    player.vx = 0;
                    player.vy = 0;
                }
            }

            base.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.changedTouches[0];
                if (activeTouchId === null) {
                    activeTouchId = touch.identifier;
                    knob.classList.add('active');
                    updateJoystick(touch.clientX, touch.clientY);
                }
            }, { passive: false });

            window.addEventListener('touchmove', (e) => {
                if (activeTouchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const touch = e.changedTouches[i];
                    if (touch.identifier === activeTouchId) {
                        e.preventDefault();
                        updateJoystick(touch.clientX, touch.clientY);
                        break;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchend', (e) => {
                if (activeTouchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        e.preventDefault();
                        resetJoystick();
                        break;
                    }
                }
            }, { passive: false });

            window.addEventListener('touchcancel', (e) => {
                if (activeTouchId === null) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        resetJoystick();
                        break;
                    }
                }
            }, { passive: false });

            // Mouse support fallback
            let isMouseDown = false;
            base.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                knob.classList.add('active');
                updateJoystick(e.clientX, e.clientY);
            });

            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                updateJoystick(e.clientX, e.clientY);
            });

            window.addEventListener('mouseup', () => {
                if (!isMouseDown) return;
                isMouseDown = false;
                resetJoystick();
            });

            // Action Button Pointer Handling
            const actionBtn = document.getElementById('btn-action');
            if (actionBtn) {
                actionBtn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    if (typeof initAudio === 'function') initAudio();
                    actionBtn.classList.add('pressed');
                    if (typeof triggerUnifiedAction === 'function') {
                        triggerUnifiedAction();
                    }
                });
                actionBtn.addEventListener('pointerup', (e) => {
                    e.preventDefault();
                    actionBtn.classList.remove('pressed');
                });
                actionBtn.addEventListener('pointercancel', () => {
                    actionBtn.classList.remove('pressed');
                });
            }

            // High-precision loop managing joystick input override ONLY when active. 
            // When inactive, it cleanly yields control back to keyboard inputs without forcing zero velocities.
            setInterval(() => {
                if (window.virtualJoystickState && window.virtualJoystickState.active) {
                    const jx = window.virtualJoystickState.x;
                    const jy = window.virtualJoystickState.y;
                    const deadzone = 0.08;

                    if (Math.abs(jx) > deadzone) {
                        activeInputs.xDir = jx > 0 ? 1 : -1;
                        activeInputs.facingDir = jx > 0 ? 'right' : 'left';
                    } else {
                        activeInputs.xDir = 0;
                    }

                    if (Math.abs(jy) > deadzone) {
                        activeInputs.yDir = jy > 0 ? 1 : -1;
                    } else {
                        activeInputs.yDir = 0;
                    }

                    if (typeof player !== 'undefined') {
                        const sensitivityMultiplier = 1.4;
                        player.vx = Math.abs(jx) > deadzone ? jx * player.maxSpeed * sensitivityMultiplier : 0;
                        player.vy = Math.abs(jy) > deadzone ? jy * player.maxSpeed * sensitivityMultiplier : 0;
                    }
                }
            }, 10);
        });
    </script>
</body>
</html>
